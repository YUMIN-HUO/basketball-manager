    yearEvents: [],
    yearAwards: [],
    peakOvr: 0,          // 生涯最高OVR
    peakSalary: 0,       // 生涯最高年薪
    peakWealth: 0,       // 生涯最高身价
    internationalResults: [],  // 国际大赛成绩记录
    leagueAwards: [],          // 联赛奖项(MVP/FMVP/总冠军等)
    championshipYears: [],     // 夺冠赛季
    proYears: 0,               // 职业生涯年数 (用于判定生涯阶段)
    injuryChanceMod: 0,        // 伤病概率加成修正 (事件加减,逐年衰减)
    fatigue: 0,                // 疲劳值 0-100 (影响伤病概率与成长)
    cleanScore: 80,            // 清白值 (固定初始值,事件可影响)
    _storyEventHistory: [],    // 已触发事件id历史 (避免短期重复)
    abilities: {},             // 14项分项能力值 (generateAbilities填充)
    stats36: null              // 36分钟标准化数据 (generateStats36填充)
  };
  
  // Pick initial high school
  const hs = pickN(HIGH_SCHOOLS[nationality] || HIGH_SCHOOLS.USA, 3);
  player.highSchoolChoices = hs;
  
  log('INIT', `创建球员: ${player.name} #${player.number} | ${country.name} ${position.code} | 初始OVR=${player.ovr} 潜力=${player.potential}`, { nationality, position: position.code, ovr: player.ovr });
  
  player.peakOvr = player.ovr;
  player.peakSalary = 0;
  player.peakWealth = 0;
  player.abilities = generateAbilities(player.ovr, player.position);
  player.stats36 = generateStats36(player.ovr, player.position, player.abilities);
  
  return player;
}

function startGame(nationality, position, name, number) {
  clearLog();
  state = createPlayer(nationality, position, name, number);
  gameYear = 2024;
  log('GAME_START', `游戏开始 | ${gameYear}年 | 球员: ${state.name}`);
  render();
}

// ============= GAME LOGIC =============
function advanceYear() {
  const p = state;
  if (p.retired) return;

  // 清空本年度奖项/事件列表 (避免跨年累积)
  p.yearAwards = [];
  p.yearEvents = [];

  const prevOvr = p.ovr;
  p.age++;
  gameYear++;
  if (p.phase === 'pro') p.proYears++;

  log('YEAR', `--- ${gameYear}年 | ${p.name} ${p.age}岁 | 阶段:${p.phase} | OVR:${p.ovr} ---`);
  
  // 高中年级递增
  if (p.phase === 'highschool') p.hsYear++;
  // 大学年级递增
  if (p.phase === 'university') p.uniYear++;
  
  // OVR变化: 向潜力值渐近的成长模型
  // 潜力值 = OVR天花板,越接近潜力值增长越慢,自然形成峰值分布
  // 潜力95-99(5%)→峰值95+ | 90-94(10%)→峰值90+ | 80-89(30%)→峰值80+ | 55-79(55%)→峰值60-79
  const gap = p.potential - p.ovr;  // 与潜力值的差距
  let change;

  if (p.phase === 'highschool') {
    // 高中: 向潜力值快速靠近 (成长率0.30)
    change = Math.round(gap * 0.30 + rand(-1, 2));
  } else if (p.phase === 'university') {
    // 大学: 稳步趋近 (成长率0.22)
    change = Math.round(gap * 0.22 + rand(-1, 1));
  } else if (p.phase === 'pro' && p.age <= 25) {
    // 职业新秀期: 缓慢趋近 (成长率0.15)
    change = Math.round(gap * 0.15 + rand(-1, 1));
  } else if (p.age <= 30) {
    // 黄金期: 微幅趋近或持平 (成长率0.08)
    change = Math.round(gap * 0.08 + randInt(-1, 0));
  } else {
    // 30岁后: 下降期,高潜力球员下降更慢
    const declineRate = p.age >= 36 ? randInt(-4, -2) : p.age >= 33 ? randInt(-3, -1) : randInt(-2, 0);
    const potSave = Math.round((p.potential - 70) * 0.05); // 潜力越高衰退越慢
    change = declineRate + potSave;
  }

  // 伤病惩罚
  const chronicPenalty = p.chronicInjuries > 0 ? -randInt(0, p.chronicInjuries) : 0;
  change += chronicPenalty;

  // 边界保护: 年轻球员至少有微量成长
  if (p.age <= 18 && change < 1) change = 1;

  p.ovr = clamp(p.ovr + change, 40, 99);
  growAbilities(p, change);  // 同步分项能力值
  log('OVR', `OVR变化: ${prevOvr} → ${p.ovr} (潜力:${p.potential} 差距:${gap} 成长:${change - chronicPenalty} 伤病:${chronicPenalty})`);
  
  // === 伤病系统 ===
  // 概率基于年龄和打球强度 (年龄越大概率越高)
  const baseInjuryChance = 0.12;
  const ageInjuryMod = p.age > 30 ? (p.age - 30) * 0.02 : 0;
  const chronicMod = p.chronicInjuries * 0.03;
  const fatigueMod = p.fatigue * 0.001;        // 疲劳值影响 (0-100 → 0-0.1)
  const injuryChance = baseInjuryChance + ageInjuryMod + chronicMod + fatigueMod + p.injuryChanceMod;
  
  if (!p.currentInjury && Math.random() < injuryChance) {
    const injury = pick(INJURIES);
    const duration = randInt(injury.recovery[0], injury.recovery[1]);
    p.currentInjury = { ...injury, weeksMissed: duration, yearMissed: duration > 8 };
    
    // 严重伤病: OVR下降 + 慢性伤病计数
    if (injury.severity >= 2) {
      const ovrLoss = randInt(1, 3);
      p.ovr = Math.max(40, p.ovr - ovrLoss);
      growAbilities(p, -ovrLoss);  // 伤病导致能力下降
      p.chronicInjuries++;
      log('INJURY', `⚠️ 严重伤病: ${injury.name} | 严重度:${injury.severity} | 停赛${duration}周 | OVR-${ovrLoss} | 慢性伤病计数:${p.chronicInjuries}`, { injury, duration, ovrLoss });
    } else {
      log('INJURY', `伤病: ${injury.name} | 严重度:${injury.severity} | 停赛${duration}周`, { injury, duration });
    }
    
    p.injuryHistory.push({
      age: p.age, year: gameYear, name: injury.name,
      severity: injury.severity, weeks: duration
    });
    p.yearEvents.push({ type: 'injury', name: injury.name, duration });
  } else if (p.currentInjury) {
    p.currentInjury.weeksMissed--;
    if (p.currentInjury.weeksMissed <= 0) {
      log('RECOVERY', `✅ 伤病恢复: ${p.currentInjury.name}`, { injury: p.currentInjury.name });
      p.currentInjury = null;
      p.yearEvents.push({ type: 'recovery' });
    } else {
      log('INJURY', `伤病恢复中: ${p.currentInjury.name} 剩余${p.currentInjury.weeksMissed}周`);
    }
  }
  
  // === 赛季统计 ===
  // 不同阶段比赛场次不同
  let maxGames = 38;
  if (p.phase === 'highschool') maxGames = 25;
  else if (p.phase === 'university') maxGames = 30;
  else if (p.phase === 'pro') maxGames = p.league === 'NBA' ? 82 : 50;
  
  const gamesPlayed = p.currentInjury 
    ? Math.max(0, maxGames - Math.ceil(p.currentInjury.weeksMissed * maxGames / 40))
    : randInt(Math.floor(maxGames * 0.7), maxGames);
  
  // === 36分钟标准化数据系统 ===
  // 1. 应用联赛OVR上限
  applyLeagueCap(p);
  // 2. 由当前OVR+分项能力生成36分钟标准化数据
  p.stats36 = generateStats36(p.ovr, p.position, p.abilities);
  // 2b. 联赛特定修正 (CBA外援高使用率等)
  const leagueMod = getLeagueStatModifier(p.league, p.ovr, p.nationality);
  p.stats36.pts = +(p.stats36.pts * leagueMod.pts).toFixed(1);
  p.stats36.ast = +(p.stats36.ast * leagueMod.ast).toFixed(1);
  p.stats36.reb = +(p.stats36.reb * leagueMod.reb).toFixed(1);
  // 3. 根据OVR和耐力计算场均上场时间
  const staminaBonus = (p.abilities.stamina - 70) * 0.08;
  let minutes;
  if (p.ovr >= 90)      minutes = 30 + staminaBonus + rand(-1, 2);
  else if (p.ovr >= 85) minutes = 26 + staminaBonus + rand(-1, 2);
  else if (p.ovr >= 80) minutes = 22 + staminaBonus + rand(-2, 2);
  else if (p.ovr >= 75) minutes = 17 + staminaBonus + rand(-2, 3);
  else if (p.ovr >= 70) minutes = 12 + staminaBonus + rand(-2, 3);
  else                  minutes = 8 + staminaBonus + rand(-2, 3);
  minutes = clamp(minutes, 5, 36);
  // 4. 由36分钟数据换算赛季总数据: 总计 = 36分钟数据 × (上场时间/36) × 场次
  const minRatio = minutes / 36;
  p.yearStats.gp = gamesPlayed;
  p.yearStats.pts = Math.round(p.stats36.pts * minRatio * gamesPlayed);
  p.yearStats.reb = Math.round(p.stats36.reb * minRatio * gamesPlayed);
  p.yearStats.ast = Math.round(p.stats36.ast * minRatio * gamesPlayed);
  p.yearStats.min = +minutes.toFixed(1);  // 记录场均上场时间

  // 记录最近3年出场数 (用于续约判定)
  p.recentGames.push(gamesPlayed);
  if (p.recentGames.length > 3) p.recentGames.shift();
  
  // 记录OVR和数据历史 (时间线展示)
  if (!p._ovrLog) p._ovrLog = [];
  p._ovrLog.push({
    age: p.age,
    ovr: p.ovr,
    teamName: p.teamName,
    teamLogo: p.teamLogo,
    teamLogoCls: p.teamLogoCls,
    stats: { ...p.yearStats }
  });
  if (p._ovrLog.length > 15) p._ovrLog.shift();
  
  // 每年都记录生涯条目(按年份记录,即使同队也每年显示)
  const phaseEvent = p.phase === 'highschool' ? '高中联赛' :
                     p.phase === 'university' ? '大学联赛' :
                     p.phase === 'pro' ? '职业联赛' : '生涯';
  // 检查是否已有该年龄的生涯条目(避免和转会/选秀重复)
  const existingIdx = p.career.findIndex(c => c.age === p.age);
  if (existingIdx >= 0) {
    // 更新已有条目,补充OVR和数据,保留原有事件标签(如转会/选秀)
    p.career[existingIdx].ovr = p.ovr;
    p.career[existingIdx].stats = { ...p.yearStats };
    // 如果已有条目是加入/联赛类事件,更新队伍信息
    const existingEvent = p.career[existingIdx].event;
    if (existingEvent === '加入' || existingEvent === '高中联赛' || existingEvent === '大学联赛' || existingEvent === '职业联赛') {
      p.career[existingIdx].teamName = p.teamName;
      p.career[existingIdx].teamLogo = p.teamLogo;
      p.career[existingIdx].teamLogoCls = p.teamLogoCls;
      p.career[existingIdx].team = p.teamName;
    }
  } else {
    p.career.push({
      age: p.age,
      event: phaseEvent,
      team: p.teamName,
      teamName: p.teamName,
      teamLogo: p.teamLogo,
      teamLogoCls: p.teamLogoCls,
      league: p.league,
      ovr: p.ovr,
      stats: { ...p.yearStats }
    });
  }
  
  p.stats.gp += p.yearStats.gp;
  p.stats.pts += p.yearStats.pts;
  p.stats.reb += p.yearStats.reb;
  p.stats.ast += p.yearStats.ast;
  
  p.stats.ppg = (p.stats.pts / Math.max(1, p.stats.gp)).toFixed(1);
  p.stats.rpg = (p.stats.reb / Math.max(1, p.stats.gp)).toFixed(1);
  p.stats.apg = (p.stats.ast / Math.max(1, p.stats.gp)).toFixed(1);
  
  log('STATS', `赛季数据: ${gamesPlayed}场 | ${minutes.toFixed(0)}分钟 | 36min: ${p.stats36.pts}分 ${p.stats36.reb}板 ${p.stats36.ast}助 ${p.stats36.stl}断 ${p.stats36.blk}帽 | 命中率:${p.stats36.fg}% 三分:${p.stats36.tp}% 罚球:${p.stats36.ftp}%`);
  
  // 名气和关系变化
  const perfScore = (p.yearStats.pts / Math.max(1, p.yearStats.gp)) * 0.5;
  p.fame = clamp(p.fame + perfScore + randInt(-2, 4), 0, 100);
  p.relation = clamp(p.relation + randInt(-2, 3), 0, 100);
  
  // 薪水和财富
  if (p.phase === 'pro' && p.salary > 0) {
    p.wealth += p.salary;
    if (perfScore > 20) p.wealth += Math.round(p.salary * 0.1);
  }
  
  // 更新生涯峰值
  if (p.ovr > p.peakOvr) p.peakOvr = p.ovr;
  if (p.salary > p.peakSalary) p.peakSalary = p.salary;
  if (p.wealth > p.peakWealth) p.peakWealth = p.wealth;
  
  // 联赛奖项模拟 (仅职业阶段) - 概率大幅降低
  if (p.phase === 'pro' && p.teamName) {
    // 按联赛梯队调整奖项名称和概率
    const isNBA = p.league === 'NBA';
    const isEuroLeague = p.league === 'EuroLeague';
    const isCBA = p.league === 'CBA';
    const isTop3 = isNBA || isEuroLeague || isCBA;
    
    // 总冠军概率 (大幅降低)
    const winProb = isNBA 
      ? (p.ovr >= 90 ? 0.15 : p.ovr >= 85 ? 0.08 : p.ovr >= 80 ? 0.03 : 0.005)
      : isEuroLeague
      ? (p.ovr >= 88 ? 0.12 : p.ovr >= 82 ? 0.06 : p.ovr >= 75 ? 0.03 : 0.005)
      : isCBA
      ? (p.ovr >= 85 ? 0.15 : p.ovr >= 78 ? 0.07 : p.ovr >= 70 ? 0.03 : 0.008)
      : (p.ovr >= 82 ? 0.10 : p.ovr >= 75 ? 0.05 : p.ovr >= 68 ? 0.02 : 0.008);
    
    // 总冠军
    if (Math.random() < winProb) {
      const champName = isNBA ? 'NBA总冠军(奥布莱恩杯)' 
        : isEuroLeague ? '欧冠EL总冠军' 
        : isCBA ? 'CBA总冠军(至尊鼎)' 
        : `${p.league}总冠军`;
      
      p.leagueAwards.push({ year: p.age, type: 'champion', league: p.league, team: p.teamName, icon: '🏆', label: champName });
      p.championshipYears.push(p.age);
      p.yearAwards.push({ icon: '🏆', result: `随${p.teamName}夺得${champName}！` });
      p.honors.push(champName);
      p.wealth += isNBA ? 3000000 : isEuroLeague ? 1000000 : isCBA ? 500000 : 300000;
      log('AWARD', `🏆 ${champName}! ${p.teamName}`);
      
      // FMVP (总决赛MVP): 含金量最高个人荣誉,概率很低
      const fmvpProb = p.ovr >= 90 ? 0.25 : p.ovr >= 85 ? 0.15 : p.ovr >= 80 ? 0.05 : 0.02;
      if (Math.random() < fmvpProb) {
        const fmvpLabel = isNBA ? 'NBA总决赛FMVP' : isEuroLeague ? '欧冠四强赛MVP(Final Four MVP)' : isCBA ? 'CBA总决赛FMVP' : `${p.league}FMVP`;
        p.leagueAwards.push({ year: p.age, type: 'fmvp', league: p.league, team: p.teamName, icon: '👑', label: fmvpLabel });
        p.honors.push(fmvpLabel);
        p.fame = clamp(p.fame + 10, 0, 100);
        p.wealth += isNBA ? 1500000 : 500000;
        log('AWARD', `👑 ${fmvpLabel}!`);
      }
    }
    
    // 常规赛MVP: 非常稀有
    const mvpProb = isNBA ? (p.ovr >= 92 ? 0.04 : p.ovr >= 88 ? 0.02 : 0.01)
      : (p.ovr >= 88 ? 0.03 : p.ovr >= 85 ? 0.015 : 0.005);
    if (mvpProb > 0 && Math.random() < mvpProb) {
      const mvpLabel = isEuroLeague ? '欧冠常规赛MVP' : `${p.league}常规赛MVP`;
      p.leagueAwards.push({ year: p.age, type: 'mvp', league: p.league, team: p.teamName, icon: '⭐', label: mvpLabel });
      p.honors.push(mvpLabel);
      p.fame = clamp(p.fame + 8, 0, 100);
      log('AWARD', `⭐ ${mvpLabel}!`);
    }
    
    // DPOY 最佳防守球员: 稀有
    if (p.ovr >= 82) {
      const posBonus = (p.position === 'C' || p.position === 'PF') ? 0.03 : 0.015;
      const dpoyProb = isNBA ? posBonus * 0.5 : posBonus;
      if (Math.random() < dpoyProb) {
        const dpoyLabel = `${p.league}最佳防守球员(DPOY)`;
        p.leagueAwards.push({ year: p.age, type: 'dpoy', league: p.league, team: p.teamName, icon: '🛡️', label: dpoyLabel });
        p.honors.push(dpoyLabel);
        p.fame = clamp(p.fame + 5, 0, 100);
        log('AWARD', `🛡️ ${dpoyLabel}!`);
      }
    }
    
    // 最佳阵容一阵: OVR>=85,概率较低
    if (p.ovr >= 85 && Math.random() < 0.08) {
      const allNbaLabel = isNBA ? 'NBA最佳阵容一阵' : `${p.league}最佳阵容一阵`;
      p.leagueAwards.push({ year: p.age, type: 'allnba', league: p.league, team: p.teamName, icon: '🥇', label: allNbaLabel });
      p.honors.push(allNbaLabel);
      log('AWARD', `🥇 ${allNbaLabel}!`);
    } else if (p.ovr >= 80 && Math.random() < 0.06) {
      const allNba2Label = isNBA ? 'NBA最佳阵容二阵' : `${p.league}最佳阵容二阵`;
      p.leagueAwards.push({ year: p.age, type: 'allnba2', league: p.league, team: p.teamName, icon: '🥈', label: allNba2Label });
      p.honors.push(allNba2Label);
      log('AWARD', `🥈 ${allNba2Label}!`);
    }
    
    // 最佳防守阵容: 稀有
    if (p.ovr >= 80 && (p.position === 'C' || p.position === 'PF' || p.position === 'SF') && Math.random() < 0.05) {
      const defLabel = isNBA ? 'NBA最佳防守一阵' : `${p.league}最佳防守一阵`;
      p.leagueAwards.push({ year: p.age, type: 'alldef', league: p.league, team: p.teamName, icon: '🔒', label: defLabel });
      p.honors.push(defLabel);
      log('AWARD', `🔒 ${defLabel}!`);
    }
    
    // 单项数据王: 稀有
    if (p.ovr >= 82 && Math.random() < 0.06) {
      const statTypes = [
        { key: 'pts', label: '得分王', icon: '🏀' },
        { key: 'ast', label: '助攻王', icon: '🅿️' },
        { key: 'reb', label: '篮板王', icon: '📋' },
        { key: 'stl', label: '抢断王', icon: '⚡' },
        { key: 'blk', label: '盖帽王', icon: '🚫' }
      ];
      const statType = pick(statTypes);
      const statLabel = `${p.league}${statType.label}`;
      p.leagueAwards.push({ year: p.age, type: 'stat_leader', league: p.league, team: p.teamName, icon: statType.icon, label: statLabel, stat: statType.key });
      p.honors.push(statLabel);
      p.fame = clamp(p.fame + 3, 0, 100);
      log('AWARD', `${statType.icon} ${statLabel}!`);
    }
    
    // 全明星: 相对常见但仍需实力
    if (p.ovr >= 78 && Math.random() < 0.20) {
      const isStarter = p.ovr >= 85 && Math.random() < 0.30;
      const allStarLabel = isNBA ? (isStarter ? 'NBA全明星首发' : 'NBA全明星') : `${p.league}全明星`;
      p.leagueAwards.push({ year: p.age, type: 'allstar', league: p.league, team: p.teamName, icon: '✨', label: allStarLabel, starter: isStarter });
      p.honors.push(allStarLabel);
      p.fame = clamp(p.fame + 2, 0, 100);
      
      // 全明星MVP: 非常稀有
      if (isStarter && Math.random() < 0.03) {
        const asMvpLabel = isNBA ? 'NBA全明星MVP' : `${p.league}全明星MVP`;
        p.leagueAwards.push({ year: p.age, type: 'as_mvp', league: p.league, team: p.teamName, icon: '🌟', label: asMvpLabel });
        p.honors.push(asMvpLabel);
        p.fame = clamp(p.fame + 4, 0, 100);
        log('AWARD', `🌟 ${asMvpLabel}!`);
      }
    }
    
    // 最快进步球员 MIP: 年轻球员
    if (p.age <= 25 && p.ovr >= 78 && Math.random() < 0.02) {
      const mipLabel = `${p.league}最快进步球员(MIP)`;
      p.leagueAwards.push({ year: p.age, type: 'mip', league: p.league, team: p.teamName, icon: '📈', label: mipLabel });
      p.honors.push(mipLabel);
      log('AWARD', `📈 ${mipLabel}!`);
    }
    
    // 最佳第六人 SMOY
    if (p.ovr >= 75 && p.ovr < 85 && Math.random() < 0.015) {
      const smoyLabel = isNBA ? 'NBA最佳第六人(SMOY)' : `${p.league}最佳第六人`;
      p.leagueAwards.push({ year: p.age, type: 'smoy', league: p.league, team: p.teamName, icon: '🔌', label: smoyLabel });
      p.honors.push(smoyLabel);
      log('AWARD', `🔌 ${smoyLabel}!`);
    }
    
    // 最佳新秀阵容
    if (p.age <= 22 && p.ovr >= 70 && Math.random() < 0.10) {
      const rookieLabel = isNBA ? 'NBA最佳新秀一阵' : `${p.league}最佳新秀`;
      p.leagueAwards.push({ year: p.age, type: 'allrookie', league: p.league, team: p.teamName, icon: '🌱', label: rookieLabel });
      p.honors.push(rookieLabel);
      log('AWARD', `🌱 ${rookieLabel}!`);
    }
  }
  
  // 疲劳与伤病修正逐年衰减 (避免永久累积)
  p.fatigue = clamp(p.fatigue - 12, 0, 100);
  p.injuryChanceMod = p.injuryChanceMod * 0.5;

  // 国家队赛事
  checkNationalTeam(p);

  // 阶段转换
  checkPhaseTransition(p);

  // 退役检查 (在故事事件之前: 退役年不生成故事事件,避免孤立)
  checkRetirement(p);

  // 生涯随机事件 (仅未退役时生成;退役年跳过,否则玩家既看不到也做不了选择)
  if (!p.retired) {
    p._pendingStoryEvent = getStoryEvent(p);
    log('STORY', `📌 触发事件: ${p._pendingStoryEvent.icon} ${p._pendingStoryEvent.title}`);
  }

  // 退役时生成结局称号 (基于生涯数据,不随机)
  if (p.retired && !p.careerTitle) {
    p.careerTitle = generateCareerTitle(p);
    log('TITLE', `🏷️ 结局称号: ${p.careerTitle} | 生涯:${p.stats.gp}场 ${p.stats.pts}分 ${p.honors.length}荣誉`);
  }
}

function getAgeModifier(age) {
  // 30岁前上升期, 30岁后下降期 (受潜力值约束, 成长速度适中)
  if (age <= 18) return randInt(1, 3);      // 高中: 成长期
  if (age <= 22) return randInt(1, 3);      // 大学: 继续成长
  if (age <= 25) return randInt(0, 2);      // 职业早期: 稳步提升
  if (age <= 28) return randInt(-1, 1);     // 巅峰期: 微幅波动
  if (age <= 30) return randInt(-1, 1);     // 30岁: 开始波动
  if (age <= 33) return randInt(-2, 0);     // 下降初期
  if (age <= 36) return randInt(-3, -1);    // 下降中期
  if (age <= 40) return randInt(-4, -2);    // 末期
  return randInt(-5, -3);                    // 40+: 急剧下降
}

function checkNationalTeam(p) {
  const country = COUNTRIES.find(c => c.code === p.nationality);
  if (!country) return;

  if (p.phase !== 'pro') return;
  // 国家队门槛: 68+可入选 (FIBA分级: 68-77轮换, 78-85主力, 86+核心)
  if (p.ovr < 68) {
    log('NATIONAL', `未达国家队标准: OVR=${p.ovr} < 68`);
    return;
  }

  const continentalCupMap = {
    'FIBA Asia': 'asiaCup',
    'FIBA Americas': 'ameriCup',
    'FIBA Europe': 'euroBasket',
    'FIBA Africa': 'afroBasket',
    'FIBA Oceania': 'asiaCup'
  };

  // 国家队参赛统计
  let natGP = 0, natPts = 0, natReb = 0, natAst = 0;

  for (const [key, comp] of Object.entries(COMPETITIONS)) {
    if (!comp.years.includes(gameYear)) continue;

    if (comp.type === 'continental') {
      const allowedKey = continentalCupMap[country.confederation];
      if (key !== allowedKey) {
        log('NATIONAL', `${country.name}不参加${comp.name}`);
        continue;
      }
    }

    // 确定赛事修正类型
    let tourneyType = comp.type;
    if (comp.type === 'world') {
      tourneyType = key === 'olympics' ? 'olympics' : 'world';
    } else if (comp.type === 'continental') {
      if (key === 'asiaCup') tourneyType = 'continental_asia';
      else if (key === 'euroBasket') tourneyType = 'continental_europe';
      else if (key === 'ameriCup') tourneyType = 'continental_americas';
      else if (key === 'afroBasket') tourneyType = 'continental_africa';
      else tourneyType = 'continental_default';
    }
    const mod = TOURNEY_MODIFIERS[tourneyType] || TOURNEY_MODIFIERS.continental_default;

    log('NATIONAL', `${country.name}球员符合${comp.name}参赛条件: OVR=${p.ovr} | ${mod.intensity}强度`);

    // 国家队成绩计算: 国家实力 + 球员贡献 + 随机因素
    const countryStrength = country.thresholdVal;
    const strengthBonus = (countryStrength - 70) * 2;
    const playerContribution = (p.ovr - 68) * 2;
    const randomFactor = randInt(-10, 15);
    const totalScore = strengthBonus + playerContribution + randomFactor;

    // 比赛场次: FIBA赛事通常5-8场
    const natGames = key === 'olympics' ? randInt(6, 8) : randInt(5, 8);

    // 使用FIBA数据表生成场均数据
    const fibaStats = generateFibaStats(p.ovr, p.position, p.abilities, tourneyType);
    const natPtsPerGame = fibaStats.pts;
    natGP += natGames;
    natPts += Math.round(natPtsPerGame * natGames);
    natReb += Math.round(fibaStats.reb * natGames);
    natAst += Math.round(fibaStats.ast * natGames);

    log('NATIONAL', `FIBA数据: ${natPtsPerGame}分 ${fibaStats.reb}板 ${fibaStats.ast}助 ${fibaStats.stl}断 ${fibaStats.blk}帽 | 三分${fibaStats.tp}% 罚球${fibaStats.ftp}%`);

    // 晋级轮次判定
    let roundReached, roundLabel;
    if (comp.type === 'world') {
      if (totalScore >= 35) { roundReached = 6; roundLabel = '🏆 冠军'; }
      else if (totalScore >= 28) { roundReached = 5; roundLabel = '🥈 亚军/决赛'; }
      else if (totalScore >= 22) { roundReached = 4; roundLabel = '🥉 四强'; }
      else if (totalScore >= 16) { roundReached = 3; roundLabel = '八强'; }
      else if (totalScore >= 10) { roundReached = 2; roundLabel = '十六强'; }
      else { roundReached = 1; roundLabel = '三十二强'; }
    } else {
      if (totalScore >= 25) { roundReached = 5; roundLabel = '🏆 冠军'; }
      else if (totalScore >= 18) { roundReached = 4; roundLabel = '🥈 决赛'; }
      else if (totalScore >= 12) { roundReached = 3; roundLabel = '四强'; }
      else if (totalScore >= 6) { roundReached = 2; roundLabel = '八强'; }
      else { roundReached = 1; roundLabel = '十六强'; }
    }

    // 记录国际大赛成绩
    const intlResult = {
      year: p.age,
      competition: comp.name,
      competitionType: comp.type,
      tourneyType: tourneyType,
      round: roundLabel,
      roundLevel: roundReached,
      country: country.name,
      flag: country.flag,
      gp: natGames,
      pts: Math.round(natPtsPerGame * natGames),
      avgPts: natPtsPerGame,
      avgReb: fibaStats.reb,
      avgAst: fibaStats.ast,
      avgStl: fibaStats.stl,
      avgBlk: fibaStats.blk,
      tp: fibaStats.tp,
      ftp: fibaStats.ftp
    };
    p.internationalResults.push(intlResult);

    p.yearAwards.push({
      type: 'national',
      competition: comp.name,
      result: `${roundLabel} (${natGames}场 ${natPtsPerGame}分 ${fibaStats.reb}板 ${fibaStats.ast}助)`,
      icon: roundReached >= 5 ? '🏆' : roundReached >= 3 ? '🥉' : '🌍'
    });

    // === 国际大赛生涯成长浮动 (贴合真实球员大赛进化) ===
    let ovrBoost = 0;
    if (roundReached >= 5) {
      // 冠军/决赛: 大幅成长
      if (p.age <= 22) ovrBoost = randInt(4, 5);       // 18-22岁: +4~5
      else if (p.age <= 29) ovrBoost = randInt(3, 4);  // 23-29岁巅峰: +3~4
      else if (p.age <= 32) ovrBoost = randInt(1, 2);  // 30-32岁: 小幅
      else ovrBoost = 0;                                // 33岁+: 不增长
    } else if (roundReached >= 3) {
      // 四强/奖牌
      if (p.age <= 22) ovrBoost = randInt(3, 4);
      else if (p.age <= 29) ovrBoost = randInt(2, 3);
      else if (p.age <= 32) ovrBoost = randInt(0, 1);
      else ovrBoost = 0;
    } else if (roundReached >= 2) {
      // 晋级淘汰赛
      if (p.age <= 22) ovrBoost = randInt(2, 3);
      else if (p.age <= 29) ovrBoost = randInt(0, 1);
      else ovrBoost = 0;
    }

    if (ovrBoost > 0) {
      p.ovr = clamp(p.ovr + ovrBoost, 40, 99);
      growAbilities(p, ovrBoost);
      log('NATIONAL', `📈 国际大赛成长: OVR+${ovrBoost} (${p.age}岁) | 新OVR=${p.ovr}`);
    }

    // 巅峰期MVP级别单届表现 → 额外一次性+3~4 (冠军+高数据)
    if (p.age >= 23 && p.age <= 29 && roundReached >= 5 && natPtsPerGame >= 20) {
      const mvpBoost = randInt(3, 4);
      p.ovr = clamp(p.ovr + mvpBoost, 40, 99);
      growAbilities(p, mvpBoost);
      log('NATIONAL', `🌟 MVP级表现! 大赛${comp.name}场均${natPtsPerGame}分 → OVR+${mvpBoost}`);
    }

    // 下滑期(32岁+): 速度弹跳抢断盖帽逐年下降, 靠经验维持传球投射
    if (p.age >= 32) {
      const declineAb = ['dunk', 'lateral', 'stl', 'blk', 'stamina'];
      for (const abKey of declineAb) {
        p.abilities[abKey] = clamp(p.abilities[abKey] - randInt(1, 2), 25, 99);
      }
      // 经验维持传球和投射
      p.abilities.pass = clamp(p.abilities.pass + randInt(0, 1), 25, 99);
      p.abilities.mid = clamp(p.abilities.mid + randInt(0, 1), 25, 99);
      log('NATIONAL', `📉 32岁+下滑: 身体属性下降, 经验维持传球/投射`);
    }

    // 荣誉和奖励
    if (roundReached >= 5) {
      let honor;
      if (key === 'olympics') honor = '奥运会金牌';
      else if (key === 'fibaWorldCup') honor = 'FIBA世界杯冠军';
      else if (key === 'asiaCup') honor = '亚洲杯冠军';
      else if (key === 'euroBasket') honor = '欧锦赛冠军';
      else if (key === 'ameriCup') honor = '美洲杯冠军';
      else if (key === 'afroBasket') honor = '非洲杯冠军';
      else honor = comp.name + '冠军';
      
      p.honors.push(honor);
      p.fame = clamp(p.fame + 10, 0, 100);
      p.wealth += 500000;
      log('NATIONAL', `🏆 ${comp.name}夺冠! | 名气+10`);
    } else if (roundReached >= 3) {
      let honor;
      if (key === 'olympics') honor = '奥运会奖牌';
      else if (key === 'fibaWorldCup') honor = 'FIBA世界杯奖牌';
      else honor = comp.name + '奖牌';
      
      p.honors.push(honor);
      p.fame = clamp(p.fame + 5, 0, 100);
      p.wealth += 200000;
      log('NATIONAL', `🥈 ${comp.name}获奖牌`);
    } else {
      log('NATIONAL', `${comp.name}: ${roundLabel}`);
    }
  }
}

function checkPhaseTransition(p) {
  // 高中: 16-18岁 (3年: 高一/高二/高三), 18岁毕业
  if (p.phase === 'highschool' && p.age >= 18 && p.hsYear >= 2) {
    p.phase = 'university';
    p.uniYear = 0;
    const universityChoices = pickN(UNIVERSITIES[p.nationality] || UNIVERSITIES.USA, 3);
    p.universityChoices = universityChoices;
    const hsEntry = {
      age: p.age, event: '高中毕业', team: p.teamName, teamName: p.teamName,
      teamLogo: p.teamLogo, teamLogoCls: p.teamLogoCls, league: p.league,
      ovr: p.ovr, stats: { ...p.yearStats }
    };
    const hsIdx = p.career.findIndex(c => c.age === p.age);
    if (hsIdx >= 0) p.career[hsIdx] = hsEntry; else p.career.push(hsEntry);
    p.hsGradYear = gameYear;
    log('PHASE', `🎓 高中毕业 → 进入大学阶段 | 高中: ${p.teamName} | 最终OVR: ${p.ovr} | 毕业年份:${p.hsGradYear}`);
  }

  // 大学: 4年制,毕业后若未参选选秀则进入自由球员市场
  // 已参选的球员 phase 在 declareDraft 中已设为 'pro',不会进入此分支
  if (p.phase === 'university' && p.uniYear >= 4) {
    const uniEntry = {
      age: p.age, event: '大学毕业', team: p.teamName, teamName: p.teamName,
      teamLogo: p.teamLogo, teamLogoCls: p.teamLogoCls, league: p.league,
      ovr: p.ovr, stats: { ...p.yearStats }
    };
    const uniIdx = p.career.findIndex(c => c.age === p.age);
    if (uniIdx >= 0) p.career[uniIdx] = uniEntry; else p.career.push(uniEntry);
    log('PHASE', `🎓 大学毕业 | ${p.teamName} | 最终OVR: ${p.ovr} | 学制4年`);

    // 未参加过任何选秀 → 作为自由球员寻求职业合同
    if (p.draftsParticipated.length === 0) {
      tryFreeAgentSigning(p);
    }
  }
}

// === 自由球员签约机制 ===
// 大学毕业后未选秀/落选,按数据和能力值评估是否有职业联赛球队愿意签约
// 签约概率基于 OVR + 潜力 + 大学数据;无人签约则退役
function tryFreeAgentSigning(p) {
  // 综合市场价值: OVR为主,潜力与大学数据为辅
  const dataBonus = p.stats36 ? (p.stats36.pts + p.stats36.reb + p.stats36.ast) / 200 : 0;
  const marketValue = p.ovr + dataBonus + (p.potential >= 85 ? 2 : 0);

  // 签约概率分层 (OVR越高越容易获合同)
  let signProb;
  if (p.ovr >= 78) signProb = 0.90;
  else if (p.ovr >= 72) signProb = 0.70;
  else if (p.ovr >= 68) signProb = 0.50;
  else if (p.ovr >= 62) signProb = 0.30;
  else signProb = 0.10;
  // 潜力加成: 年轻高潜力球员更受青睐
  if (p.potential >= 85) signProb = Math.min(0.95, signProb + 0.10);

  log('FREE_AGENT', `=== 大学毕业 → 自由球员市场 === OVR:${p.ovr} 潜力:${p.potential} 市场价值:${marketValue.toFixed(1)} 签约概率:${Math.round(signProb*100)}%`);

  if (Math.random() > signProb) {
    // 无人愿意签约 → 退役
    p.retired = true;
    p.retirementReason = '大学毕业未获职业合同，生涯结束';
    log('FREE_AGENT', `❌ 无人签约 → 被迫退役 | OVR:${p.ovr} 签约概率:${Math.round(signProb*100)}%`);
    return false;
  }

  // 有人签约: 按OVR筛选可签约的联赛档次
  // T0(NBA/EuroLeague/ACB): OVR 80+ | T1(CBA/Serie A/Turkish/Greek/Adriatic): OVR 72+ | T2(其他): 无门槛
  const T0_LEAGUES = ['NBA', 'EuroLeague', 'ACB'];
  const T1_LEAGUES = ['CBA', 'Serie A', 'Turkish League', 'Greek League', 'Adriatic'];

  const candidates = [];
  for (const region in PRO_TEAMS) {
    for (const team of PRO_TEAMS[region]) {
      const lg = team.league;
      // 按OVR限制可签约联赛档次 (与 getTransferChoices 一致)
      if (p.ovr < 80 && T0_LEAGUES.includes(lg)) continue;
      if (p.ovr < 72 && T1_LEAGUES.includes(lg)) continue;
      candidates.push({ team, region });
    }
  }
  if (candidates.length === 0) {
    // 极端情况: 无可签约球队 → 退役
    p.retired = true;
    p.retirementReason = '大学毕业未获职业合同，生涯结束';
    log('FREE_AGENT', `❌ 无可签约联赛 → 被迫退役 | OVR:${p.ovr}`);
    return false;
  }

  const signed = pick(candidates);
  const draftTeam = signed.team;

  p.phase = 'pro';
  p.salary = calcSalary(p.ovr, draftTeam.league);
  p.teamName = draftTeam.name;
  p.teamLogo = draftTeam.logo;
  p.teamLogoCls = draftTeam.cls;
  p.league = draftTeam.league;
  p.team = draftTeam;
  p.recentGames = [];
  p.noOfferYears = 0;

  const faEntry = {
    age: p.age, event: '大学毕业·自由签约', team: draftTeam.name, teamName: draftTeam.name,
    teamLogo: draftTeam.logo, teamLogoCls: draftTeam.cls, league: draftTeam.league,
    draftPick: '自由球员', ovr: p.ovr, stats: { ...p.yearStats }
  };
  const faIdx = p.career.findIndex(c => c.age === p.age);
  if (faIdx >= 0) p.career[faIdx] = faEntry; else p.career.push(faEntry);

  log('FREE_AGENT', `✅ 自由签约: ${draftTeam.name} (${draftTeam.league}) | 起薪:${formatSalary(p.salary)}`);
  p.fame = clamp(p.fame + 2, 0, 100);
  return true;
}

// === 选秀参选资格检查 ===
// 规则: 年满19岁 且 高中毕业满1年, 22岁后不可参选
function checkDraftEligibility(p) {
  // 必须高中毕业后才能参选
  if (!p.hsGradYear) {
    return { eligible: false, reason: '需先完成高中学业' };
  }
  if (p.age < 19) {
    return { eligible: false, reason: `未满19岁(${p.age}岁),不符合参选年龄` };
  }
  if (p.age > 22) {
    return { eligible: false, reason: `已满${p.age}岁,超出选秀年龄限制(22岁)` };
  }
  const yearsSinceHS = gameYear - p.hsGradYear;
  if (yearsSinceHS < 1) {
    return { eligible: false, reason: `高中毕业未满1年(仅${yearsSinceHS}年)` };
  }
  return { eligible: true, reason: `年满19岁+高中毕业${yearsSinceHS}年,符合参选条件` };
}

// === 获取可参加的选秀地区列表 ===
function getAvailableDrafts(p) {
  const drafts = [];
  // 球员国籍对应地区优先显示
  const allRegions = Object.keys(PRO_TEAMS);
  // 将球员国籍排在第一位
  const sortedRegions = p.nationality && PRO_TEAMS[p.nationality]
    ? [p.nationality, ...allRegions.filter(r => r !== p.nationality)]
    : allRegions;
  for (const code of sortedRegions) {
    // 已参加过的地区不能再参加
    if (p.draftsParticipated.includes(code)) continue;
    const teams = PRO_TEAMS[code];
    const country = COUNTRIES.find(c => c.code === code);
    const leagueName = country ? country.proName : teams[0].league;
    drafts.push({
      region: code,
      leagueName: leagueName,
      teamCount: teams.length,
      league: teams[0].league
    });
  }
  return drafts;
}

// === 选秀行情评估 ===
// 基于OVR+潜力+年龄综合评估选秀顺位区间
function evaluateDraftStock(p) {
  const ageBonus = p.age <= 19 ? -3 : p.age <= 20 ? -1 : p.age >= 23 ? 2 : 0;
  const potBonus = p.potential >= 88 ? -2 : p.potential >= 82 ? -1 : 0;
  const intlBonus = p.nationality !== 'USA' ? -1 : 0;
  const totalBonus = ageBonus + potBonus + intlBonus;

  let stock, range;
  if (p.ovr >= 88) {
    stock = '状元热门';
    range = `1-5顺位`;
  } else if (p.ovr >= 82) {
    stock = '乐透秀';
    range = `6-14顺位`;
  } else if (p.ovr >= 75) {
    stock = '首轮中后段';
    range = `15-30顺位`;
  } else if (p.ovr >= 68) {
    stock = '次轮秀';
    range = `31-60顺位`;
  } else if (p.ovr >= 62) {
    stock = '可能落选';
    range = `边缘选秀/落选`;
  } else {
    stock = '大概率落选';
    range = `落选→自由球员`;
  }
  return { stock, range, bonus: totalBonus };
}

function checkRetirement(p) {
  // 1. 年龄硬上限: 45岁强制退役
  if (p.age >= 45) {
    p.retired = true;
    p.retirementReason = '年龄太大（45岁），身体无法承受职业联赛强度';
    log('RETIRE', `🏁 强制退役: 年龄达到45岁上限`);
    return;
  }

  // 2. 连续出场不足: 最近3年出场率<30%, 俱乐部不续约
  if (p.phase === 'pro' && p.recentGames.length >= 3) {
    const maxGames = p.league === 'NBA' ? 82 : 50;
    const avgGames = p.recentGames.reduce((a, b) => a + b, 0) / p.recentGames.length;
    const playRate = avgGames / maxGames;
    if (playRate < 0.3) {
      p.retired = true;
      p.retirementReason = `连续3年平均出场率仅${Math.round(playRate * 100)}%，俱乐部拒绝续约`;
      log('RETIRE', `🏁 出场不足退役: 最近3年平均${avgGames.toFixed(0)}场/年, 出场率${Math.round(playRate * 100)}% < 30%`);
      return;
    }
  }

  // 3. 严重伤病导致退役: 赛季报销 + OVR大幅下降
  if (p.phase === 'pro' && p.currentInjury && p.currentInjury.severity >= 3 && p.currentInjury.weeksMissed >= 10) {
    p.retired = true;
    p.retirementReason = `严重伤病（${p.currentInjury.name}）无法恢复，被迫退役`;
    log('RETIRE', `🏁 伤病退役: ${p.currentInjury.name} | 严重度:${p.currentInjury.severity} | 停赛${p.currentInjury.weeksMissed}周`);
    return;
  }

  // 4. 无人报价退役: 没有俱乐部愿意续约 → 强制退役
  if (p.phase === 'pro' && p.age >= 22) {
    const transferChoices = getTransferChoices();
    if (transferChoices.length === 0) {
      p.noOfferYears++;
      if (p.noOfferYears >= 2) {
        p.retired = true;
        p.retirementReason = `连续${p.noOfferYears}年无俱乐部愿意续约，被迫退役`;
        log('RETIRE', `🏁 无队续约退役: 连续${p.noOfferYears}年无转会报价`);
        return;
      }
    } else {
      p.noOfferYears = 0;  // 有报价则重置
    }
  }

  // 5. 自然退役: 40岁以上逐渐增加退役概率 (中位数40岁)
  if (p.phase === 'pro' && p.age >= 40) {
    const retireProb = p.age >= 44 ? 0.8 :
                      p.age >= 42 ? 0.5 :
                      p.age >= 40 ? 0.25 : 0.1;
    if (Math.random() < retireProb) {
      p.retired = true;
      p.retirementReason = `年龄偏大（${p.age}岁），状态下滑选择退役`;
      log('RETIRE', `🏁 自然退役: 年龄${p.age}`);
      return;
    }
  }

  // 6. 慢性伤病过多: 35岁+ 且慢性伤病>=3
  if (p.phase === 'pro' && p.age >= 35 && p.chronicInjuries >= 3) {
    if (Math.random() < 0.4) {
      p.retired = true;
      p.retirementReason = `累积伤病过多（${p.chronicInjuries}次严重伤病），身体不堪重负`;
      log('RETIRE', `🏁 伤病累积退役: 慢性伤病=${p.chronicInjuries}`);
      return;
    }
  }
}

// === 结局称号生成 (基于生涯数据,不随机) ===
function generateCareerTitle(p) {
  const totalGames = p.stats.gp;
  const totalPts = p.stats.pts;
  const ppg = parseFloat(p.stats.ppg) || 0;
  const honors = p.honors;
  // 巅峰OVR: 从历史记录中取最高值(潜力值现在是成长速度,不是上限)
  const peakOVR = Math.max(p.ovr, ...(p._ovrLog || []).map(l => l.ovr));
  const retireOVR = p.ovr;
  const careerYears = p.age - 16;
  const injuries = p.injuryHistory.length;
  const draftPick = p.draftPick;
  const wealth = p.wealth;

  // 检查各类荣誉
  const hasOlympicGold = honors.some(h => h.includes('奥运') && h.includes('金牌'));
  const hasWorldCup = honors.some(h => h.includes('世界杯') && h.includes('冠军'));
  const hasNationalGold = hasOlympicGold || hasWorldCup;
  const honorCount = honors.length;
  
  // 联赛硬荣誉
  const hasNBAChampion = honors.some(h => h.includes('NBA') && h.includes('总冠军'));
  const hasFMVP = honors.some(h => h.includes('FMVP') || h.includes('四强赛MVP'));
  const hasMVP = honors.some(h => h.includes('常规赛MVP') || h.includes('欧冠常规赛MVP'));
  const hasDPOY = honors.some(h => h.includes('DPOY') || h.includes('防守球员'));
  const championCount = honors.filter(h => h.includes('总冠军') || h.includes('金牌')).length;
  
  // 按优先级判定称号 (高→低)
  // 1. 传奇巨星: 奥运金牌 + NBA总冠军+FMVP + 长期生涯
  if (hasNationalGold && hasNBAChampion && hasFMVP && careerYears >= 15) {
    return '传奇巨星';
  }
  
  // 2. 名人堂球员: 多项硬荣誉 + 生涯出色
  const hardHonorCount = [hasNBAChampion, hasFMVP, hasMVP, hasDPOY, hasNationalGold].filter(Boolean).length;
  if (hardHonorCount >= 3 && totalPts >= 12000 && careerYears >= 12) {
    return '名人堂球员';
  }
  
  // 3. 冠军功臣: 有重大冠军荣誉
  if (championCount >= 2 || hasNBAChampion) {
    return '冠军功臣';
  }
  
  // 4. 全明星球员: 高巅峰 + 高得分 + 有全明星或最佳阵容
  const hasAllStar = honors.some(h => h.includes('全明星') || h.includes('最佳阵容'));
  if (peakOVR >= 85 && ppg >= 18 && totalGames >= 500 && hasAllStar) {
    return '全明星球员';
  }

  // 5. 铁人: 超长生涯 + 出场多
  if (careerYears >= 18 && totalGames >= 900) {
    return '赛场铁人';
  }

  // 6. 得分机器: 高场均得分
  if (ppg >= 22 && totalPts >= 10000) {
    return '得分机器';
  }

  // 7. 逆袭之星: 落选或低顺位但成功
  if ((!draftPick || (draftPick.overall > 45)) && totalPts >= 8000 && peakOVR >= 80) {
    return '逆袭之星';
  }

  // 8. 悲情天才: 高潜力但伤病多
  if (peakOVR >= 82 && injuries >= 5 && careerYears < 14) {
    return '悲情天才';
  }

  // 9. 角色球员: 中等生涯
  if (totalGames >= 400 && ppg >= 8) {
    return '可靠角色球员';
  }

  // 10. 匆匆过客: 短暂生涯
  if (careerYears <= 6 || totalGames < 200) {
    return '匆匆过客';
  }

  // 11. 平凡生涯
  return '平凡球员';
}

function chooseDecision(choice) {
  const p = state;
  
  // Apply immediate effects
  if (choice.title && choice.title.includes('刻苦训练')) {
    p.ovr = clamp(p.ovr + randInt(1, 3), 40, 99);
    p.relation = clamp(p.relation + randInt(1, 2), 0, 100);
  } else if (choice.title && choice.title.includes('加练提升')) {
    p.ovr = clamp(p.ovr + randInt(1, 2), 40, 99);
  } else if (choice.title && choice.title.includes('请求续约')) {
    // 续约: 按当前联赛梯队+OVR重新计算薪资,有涨薪
    const baseSalary = calcSalary(p.ovr, p.league);
    const renewalBonus = 1.0 + Math.random() * 0.3;  // 续约涨薪0~30%
    p.salary = Math.round(baseSalary * renewalBonus);
    p.relation = clamp(p.relation + 3, 0, 100);
  }

  if (choice.type === 'stay') {
    advanceYear();
  } else if (choice.type === 'transfer') {
    if (choice.team) {
      p.teamName = choice.team.name;
      p.teamLogo = choice.team.logo;
      p.teamLogoCls = choice.team.cls;
      p.league = choice.team.league || choice.team.conf || (p.phase === 'highschool' ? COUNTRIES.find(c => c.code === p.nationality).youthName : COUNTRIES.find(c => c.code === p.nationality).universityName);
      p.team = choice.team;
      if (choice.salary) p.salary = choice.salary;
      const phaseLabel = p.phase === 'pro' ? '转会' : '转学';
      const transferEntry = {
        age: p.age, event: phaseLabel, team: choice.team.name, teamName: choice.team.name,
        teamLogo: choice.team.logo, teamLogoCls: choice.team.cls, league: p.league,
        ovr: p.ovr, stats: { ...p.yearStats }
      };
      const tIdx = p.career.findIndex(c => c.age === p.age);
      if (tIdx >= 0) p.career[tIdx] = transferEntry; else p.career.push(transferEntry);
    }
    advanceYear();
  } else if (choice.type === 'draft') {
    declareDraft(choice.region);
    p._showDraftResult = true;
    render();
    return;
  } else if (choice.type === 'retire') {
    p.retired = true;
    p.retirementReason = '主动退役，结束职业生涯';
    // 主动退役也需生成结局称号 (advanceYear 不会被调用)
    if (!p.careerTitle) {
      p.careerTitle = generateCareerTitle(p);
      log('TITLE', `🏷️ 结局称号: ${p.careerTitle} | 生涯:${p.stats.gp}场 ${p.stats.pts}分 ${p.honors.length}荣誉`);
    }
  }

  render();
}

function declareDraft(draftRegion) {
  const p = state;
  const country = COUNTRIES.find(c => c.code === p.nationality);

  // === 参选资格检查 ===
  const eligibility = checkDraftEligibility(p);
  if (!eligibility.eligible) {
    log('DRAFT', `❌ 参选资格不符: ${eligibility.reason}`);
    return false;
  }

  // 默认选秀地区: 球员国籍对应地区
  const region = draftRegion || p.nationality;
  // 检查是否已参加过该地区选秀
  if (p.draftsParticipated.includes(region)) {
    log('DRAFT', `❌ 已参加过${region}地区选秀,不能重复参加`);
    return false;
  }
  // 记录已参加的选秀地区
  p.draftsParticipated.push(region);

  // 获取该地区的球队池
  const regionTeams = PRO_TEAMS[region] || PRO_TEAMS.USA;
  const regionCountry = COUNTRIES.find(c => c.code === region);
  const regionLeagueName = regionCountry ? regionCountry.proName : regionTeams[0].league;

  p.phase = 'pro';
  p.recentGames = [];
  p.noOfferYears = 0;

  log('DRAFT', `=== ${regionLeagueName}选秀开始 === 球员:${p.name} | 国籍:${country.name} | 年龄:${p.age} | OVR:${p.ovr} | 潜力:${p.potential} | 资格:${eligibility.reason}`);

  // === 选秀行情评估 ===
  const stock = evaluateDraftStock(p);
  log('DRAFT', `选秀行情: ${stock.stock} (${stock.range}) | 修正:年龄${p.age <= 19 ? '+3年轻' : p.age >= 23 ? '-2大龄' : '0'} 潜力${p.potential >= 88 ? '+2' : '0'} 国际${p.nationality !== region ? '+1' : '0'}`);

  // === 选秀顺位确定 ===
  let draftPosition;
  let drafted = true;

  if (p.ovr >= 88) {
    const basePick = clamp(1 + Math.floor((90 - p.ovr) / 2) + stock.bonus, 1, 14);
    const lotteryVariance = randInt(-2, 3);
    draftPosition = clamp(basePick + lotteryVariance, 1, 14);
    log('DRAFT', `乐透抽签: 基础顺位${basePick} + 抽签波动${lotteryVariance} → 第${draftPosition}顺位`);
  } else if (p.ovr >= 82) {
    draftPosition = clamp(randInt(6, 14) + stock.bonus, 1, 14);
    log('DRAFT', `乐透区评估: OVR=${p.ovr} → 第${draftPosition}顺位`);
  } else if (p.ovr >= 75) {
    draftPosition = clamp(randInt(15, 30) + stock.bonus, 15, 30);
    log('DRAFT', `首轮评估: OVR=${p.ovr} → 第${draftPosition}顺位`);
  } else if (p.ovr >= 68) {
    draftPosition = clamp(randInt(31, 60) + stock.bonus, 31, 60);
    log('DRAFT', `次轮评估: OVR=${p.ovr} → 第${draftPosition}顺位`);
  } else {
    const undraftedProb = p.ovr >= 62 ? 0.5 : 0.8;
    if (Math.random() < undraftedProb) {
      drafted = false;
      log('DRAFT', `落选评估: OVR=${p.ovr} < 68, 落选概率${Math.round(undraftedProb*100)}% → 落选`);
    } else {
      draftPosition = randInt(50, 60);
      log('DRAFT', `边缘入选: OVR=${p.ovr} 勉强入选 → 第${draftPosition}顺位`);
    }
  }

  // === 落选处理 ===
  if (!drafted) {
    p.draftPick = null;
    log('DRAFT', `❌ ${regionLeagueName}落选 → 进入自由球员市场`);

    // 落选秀可签约该地区联赛球队(双向合同)
    if (p.ovr >= 65 && Math.random() < 0.3) {
      const draftTeam = pick(regionTeams);
      p.salary = draftTeam.league === 'NBA' ? randInt(500000, 600000) : calcSalary(p.ovr, draftTeam.league);
      p.teamName = draftTeam.name;
      p.teamLogo = draftTeam.logo;
      p.teamLogoCls = draftTeam.cls;
      p.league = draftTeam.league;
      p.team = draftTeam;
      const faEntry = {
        age: p.age, event: `${regionLeagueName}落选·双向合同`, team: draftTeam.name, teamName: draftTeam.name,
        teamLogo: draftTeam.logo, teamLogoCls: draftTeam.cls, league: draftTeam.league,
        draftPick: '落选(双向合同)', ovr: p.ovr, stats: { ...p.yearStats }
      };
      const faIdx = p.career.findIndex(c => c.age === p.age);
      if (faIdx >= 0) p.career[faIdx] = faEntry; else p.career.push(faEntry);
      log('DRAFT', `✅ 落选后签约${regionLeagueName}双向合同: ${draftTeam.name} | 起薪${formatSalary(p.salary)}`);
      p.fame = clamp(p.fame + 1, 0, 100);
      return true;
    }

    // 落选后签约其他联赛
    if (p.ovr >= 60) {
      const homeTeams = (p.nationality !== region) ? (PRO_TEAMS[p.nationality] || regionTeams) : regionTeams;
      if (homeTeams && homeTeams.length > 0) {
        const draftTeam = pick(homeTeams);
        p.salary = calcSalary(p.ovr, draftTeam.league);
        p.teamName = draftTeam.name;
        p.teamLogo = draftTeam.logo;
        p.teamLogoCls = draftTeam.cls;
        p.league = draftTeam.league;
        p.team = draftTeam;
        const homeEntry = {
          age: p.age, event: `${regionLeagueName}落选·签约其他联赛`, team: draftTeam.name, teamName: draftTeam.name,
          teamLogo: draftTeam.logo, teamLogoCls: draftTeam.cls, league: draftTeam.league,
          draftPick: `${regionLeagueName}落选`, ovr: p.ovr, stats: { ...p.yearStats }
        };
        const homeIdx = p.career.findIndex(c => c.age === p.age);
        if (homeIdx >= 0) p.career[homeIdx] = homeEntry; else p.career.push(homeEntry);
        log('DRAFT', `✅ 落选后签约: ${draftTeam.name} | 起薪${formatSalary(p.salary)}`);
        p.fame = clamp(p.fame + 2, 0, 100);
        return true;
      }
    }

    // 自由球员
    p.salary = calcSalary(p.ovr, 'CEBL');  // 自由球员按最低梯队计算
    p.teamName = '自由球员';
    p.teamLogo = 'FA';
    p.teamLogoCls = 'logo-steel';
    p.league = '自由联赛';
    p.team = { name: '自由球员', logo: 'FA', cls: 'logo-steel', league: '自由联赛' };
    const faEntry2 = {
      age: p.age, event: `${regionLeagueName}落选自由球员`, team: '自由球员', teamName: '自由球员',
      teamLogo: 'FA', teamLogoCls: 'logo-steel', league: '自由联赛',
      draftPick: `${regionLeagueName}落选`, ovr: p.ovr, stats: { ...p.yearStats }
    };
    const faIdx2 = p.career.findIndex(c => c.age === p.age);
    if (faIdx2 >= 0) p.career[faIdx2] = faEntry2; else p.career.push(faEntry2);
    log('DRAFT', `❌ 落选→自由球员 | OVR=${p.ovr} | 起薪${formatSalary(p.salary)}`);
    return true;
  }

  // === 被选中处理 ===
  const round = draftPosition <= 30 ? 1 : 2;
  const pickNum = draftPosition <= 30 ? draftPosition : draftPosition - 30;

  // 选秀球队: 从该地区的球队池中随机选取
  const draftTeam = pick(regionTeams);

  p.draftPick = {
    round: round,
    pick: pickNum,
    overall: draftPosition,
    team: draftTeam.name,
    logo: draftTeam.logo,
    cls: draftTeam.cls,
    league: draftTeam.league,
    region: region,
    regionLeague: regionLeagueName
  };

  // 薪资: NBA按顺位,其他联赛按OVR+联赛梯队
  const draftSalary = calcDraftSalary(draftPosition, draftTeam.league);
  p.salary = draftSalary != null ? draftSalary : calcSalary(p.ovr, draftTeam.league);
  p.teamName = draftTeam.name;
  p.teamLogo = draftTeam.logo;
  p.teamLogoCls = draftTeam.cls;
  p.league = draftTeam.league;
  p.team = draftTeam;

  const pickLabel = draftPosition <= 14 ? '乐透秀' : round === 1 ? '首轮秀' : '次轮秀';
  const draftEntry = {
    age: p.age, event: `${regionLeagueName} ${pickLabel}`,
    team: draftTeam.name, teamName: draftTeam.name, teamLogo: draftTeam.logo, teamLogoCls: draftTeam.cls,
    league: draftTeam.league,
    draftPick: `${regionLeagueName} 第${round}轮第${pickNum}顺位 (总第${draftPosition}顺位)`,
    ovr: p.ovr,
    stats: { ...p.yearStats }
  };
  const existingIdx = p.career.findIndex(c => c.age === p.age);
  if (existingIdx >= 0) p.career[existingIdx] = draftEntry; else p.career.push(draftEntry);

  log('DRAFT', `📋 选秀结果: ${regionLeagueName} ${pickLabel} | 第${round}轮第${pickNum}顺位(总第${draftPosition}) | 球队:${draftTeam.name}(${draftTeam.league}) | 起薪:${formatSalary(p.salary)} | OVR:${p.ovr}`, { round, pickNum, overall: draftPosition, team: draftTeam.name, salary: p.salary });

  const fameBoost = draftPosition <= 14 ? 15 : draftPosition <= 30 ? 8 : 3;
  p.fame = clamp(p.fame + fameBoost, 0, 100);
  return true;
}

function getTransferChoices() {
  const p = state;
  const country = COUNTRIES.find(c => c.code === p.nationality);

  // 球队按实力排序: 数组顺序即实力排序(前面的强)
  // 程序化赋予strength: 球队池中越靠前实力越强
  const getTeamStrength = (team, pool) => {
    const idx = pool.indexOf(team);
    return Math.round(90 - (idx / pool.length) * 30);  // 90→60分布
  };

  // 跨联赛转会: 从多个不同联赛中提供合同选择
  // 收集所有联赛的球队,按联赛分组
  const leagueTeams = {};
  for (const region in PRO_TEAMS) {
    for (const team of PRO_TEAMS[region]) {
      const lg = team.league;
      if (!leagueTeams[lg]) leagueTeams[lg] = [];
      // 排除当前球队
      if (team.name !== p.teamName) {
        leagueTeams[lg].push({ team, region, strength: getTeamStrength(team, PRO_TEAMS[region]) });
      }
    }
  }

  // 根据OVR决定可获得报价的联赛档次
  // T0(NBA/EuroLeague/ACB): OVR 80+ | T1(CBA/Serie A/Turkish/Greek/Adriatic): OVR 72+ | T2(其他): OVR 60+
  const T0_LEAGUES = ['NBA', 'EuroLeague', 'ACB'];
  const T1_LEAGUES = ['CBA', 'Serie A', 'Turkish League', 'Greek League', 'Adriatic'];
  const leagueTier = (lg) => {
    if (T0_LEAGUES.includes(lg)) return 0;
    if (T1_LEAGUES.includes(lg)) return 1;
    return 2;
  };
  const maxTier = p.ovr >= 80 ? 0 : p.ovr >= 72 ? 1 : 2;
  // 可选联赛: 只能获得与自身档次相当或更低的联赛报价 (tier值越大=联赛越低级)
  const availableLeagues = Object.keys(leagueTeams).filter(lg => leagueTier(lg) >= maxTier);
  // 确保当前联赛在选项中 (但仅当OVR满足该联赛档次时)
  if (p.league && !availableLeagues.includes(p.league) && leagueTeams[p.league] && leagueTier(p.league) >= maxTier) {
    availableLeagues.push(p.league);
  }
  if (availableLeagues.length === 0) return [];

  // 按tier分组,优先选高 tier(低数字)的联赛
  const byTier = { 0: [], 1: [], 2: [] };
  availableLeagues.forEach(lg => byTier[leagueTier(lg)].push(lg));

  // 从不同联赛中各选1支球队,提供2-3个跨联赛报价
  const numOffers = p.ovr >= 85 ? 3 : 2;
  const selectedLeagues = [];
  // 第1个报价: 优先选最好的联赛档次
  const bestTier = Math.min(...Object.keys(byTier).filter(k => byTier[k].length > 0).map(Number));
  if (byTier[bestTier].length > 0) {
    selectedLeagues.push(pickN(byTier[bestTier], 1)[0]);
  }
  // 后续报价: 从其他档次或同档次不同联赛中选
  for (let i = 1; i < numOffers; i++) {
    const remaining = availableLeagues.filter(lg => !selectedLeagues.includes(lg));
    if (remaining.length === 0) break;
    // 50%概率选同档次, 50%选更低档次(如果有)
    const sameTier = remaining.filter(lg => leagueTier(lg) === bestTier);
    const lowerTier = remaining.filter(lg => leagueTier(lg) > bestTier);
    const pool = (sameTier.length > 0 && (lowerTier.length === 0 || Math.random() < 0.5)) ? sameTier : lowerTier;
    if (pool.length > 0) selectedLeagues.push(pickN(pool, 1)[0]);
  }

  const offers = [];
  for (const lg of selectedLeagues) {
    const pool = leagueTeams[lg];
    if (!pool || pool.length === 0) continue;
    // 按实力排序,根据OVR选合适档位的球队
    const sorted = [...pool].sort((a, b) => b.strength - a.strength);
    const tierIdx = p.ovr >= 85 ? 0 : p.ovr >= 78 ? Math.floor(sorted.length * 0.2) : Math.floor(sorted.length * 0.4);
    const candidate = sorted[Math.min(tierIdx + Math.floor(Math.random() * 2), sorted.length - 1)];
    if (candidate) offers.push(candidate);
  }

  return offers.map(({team, strength}) => {
    // 薪资: 按目标联赛梯队+球员OVR计算,强队有加成
    const baseSalary = calcSalary(p.ovr, team.league);
    const strengthBonus = 0.8 + (strength / 100) * 0.5;  // 强队薪资加成0.8x~1.3x
    const newSalary = Math.round(baseSalary * strengthBonus);
    return {
      type: 'transfer',
      title: `加盟 ${team.name}`,
      desc: `${team.league} · 实力${strength} · 年薪 ${formatSalary(newSalary)}`,
      team: team,
      salary: newSalary,
      tag: '转会'
    };
  });
}

function getYearChoices() {
  const p = state;
  const choices = [];
  
  if (p.phase === 'highschool') {
    // High school choices
    choices.push({
      type: 'stay',
      title: `留在 ${p.teamName}`,
      desc: '继续为当前球队效力',
      tag: '稳定'
    });
    
    // Transfer to another high school
    const hsChoices = pickN(HIGH_SCHOOLS[p.nationality] || HIGH_SCHOOLS.USA, 2);
    hsChoices.forEach(hs => {
      choices.push({
        type: 'transfer',
        title: `转学至 ${hs.name}`,
        desc: COUNTRIES.find(c => c.code === p.nationality).youthName,
        team: hs,
        salary: 0,
        tag: '转学'
      });
    });
    
    // Work hard option
    choices.push({
      type: 'stay',
      title: '刻苦训练',
      desc: '每天加练，提升能力值',
      tag: '训练'
    });
    
    return choices.slice(0, 3);
  }
  
  if (p.phase === 'university') {
    // University choices
    choices.push({
      type: 'stay',
      title: `留在 ${p.teamName}`,
      desc: '继续为当前学校效力',
      tag: '稳定'
    });
    
    // Transfer to another university
    const uniChoices = pickN(UNIVERSITIES[p.nationality] || UNIVERSITIES.USA, 2);
    uniChoices.forEach(uni => {
      choices.push({
        type: 'transfer',
        title: `转学至 ${uni.name}`,
        desc: uni.conf,
        team: uni,
        salary: 0,
        tag: '转学'
      });
    });
    
    // Draft option: 19岁以上可参选,不限阶段
    const eligibility = checkDraftEligibility(p);
    if (eligibility.eligible) {
      const availableDrafts = getAvailableDrafts(p);
      if (availableDrafts.length > 0) {
        const stock = evaluateDraftStock(p);
        // 显示前2个可选地区选秀
        availableDrafts.slice(0, 2).forEach(d => {
          choices.push({
            type: 'draft',
            region: d.region,
            title: `参加${d.leagueName}选秀`,
            desc: `选秀行情：${stock.stock} (${stock.range})`,
            tag: '选秀'
          });
        });
      }
    } else if (p.age < 19) {
      choices.push({
        type: 'stay',
        title: '加练提升',
        desc: `${eligibility.reason}`,
        tag: '训练'
      });
    } else {
      choices.push({
        type: 'stay',
        title: '加练提升',
        desc: '每天额外训练，提升能力值',
        tag: '训练'
      });
    }
    
    return choices.slice(0, 4);
  }
  
  // Professional phase
  choices.push({
    type: 'stay',
    title: `留在 ${p.teamName}`,
    desc: `继续效力当前球队`,
    tag: '稳定'
  });
  
  // Transfer offers
  const transferChoices = getTransferChoices();
  choices.push(...transferChoices.slice(0, 1));
  
  // Draft option for pro players aged 19-22 (can still enter drafts)
  const eligibility = checkDraftEligibility(p);
  if (eligibility.eligible) {
    const availableDrafts = getAvailableDrafts(p);
    if (availableDrafts.length > 0) {
      const stock = evaluateDraftStock(p);
      choices.push({
        type: 'draft',
        region: availableDrafts[0].region,
        title: `参加${availableDrafts[0].leagueName}选秀`,
        desc: `选秀行情：${stock.stock} (${stock.range})`,
        tag: '选秀'
      });
    }
  }
  
  // Negotiate
  choices.push({
    type: 'stay',
    title: '请求续约',
    desc: '与球队商谈新合同',
    tag: '合同'
  });
  
  // Retirement option
  if (p.age >= 40 || (p.phase === 'pro' && p.ovr < 60)) {
    choices.push({
      type: 'retire',
      title: '考虑退役',
      desc: '结束职业生涯，开始新篇章',
      tag: '退役'
    });
  }
  
  return choices.slice(0, 4);
}

function formatSalary(amount) {
  if (amount >= 100000000) return (amount / 100000000).toFixed(1) + '亿';
  if (amount >= 10000000) return (amount / 10000000).toFixed(1) + '千万';
  if (amount >= 10000) return (amount / 10000).toFixed(0) + '万';
  return amount + '元';
}

// 默认薪资表(未知联赛使用第四梯队)
const DEFAULT_SALARY_TIER = {
  superstar:  [400000, 650000],
  allstar:    [180000, 350000],
  starter:    [80000, 160000],
  rotation:   [40000, 80000],
  minimum:    [20000, 40000],

// 按OVR获取薪资档位key
function getSalaryTierKey(ovr) {
  if (ovr >= 92) return 'superstar';
  if (ovr >= 85) return 'allstar';
  if (ovr >= 78) return 'starter';
  if (ovr >= 70) return 'rotation';
  if (ovr >= 65) return 'minimum';
  return 'rookie';
}

// 按联赛和OVR计算薪资
function calcSalary(ovr, league) {
  const tier = LEAGUE_SALARY_TIERS[league] || DEFAULT_SALARY_TIER;
  const tierKey = getSalaryTierKey(ovr);
  const range = tier[tierKey] || tier.rookie;
  return randInt(range[0], range[1]);
}

// 按选秀顺位和联赛计算新秀薪资(NBA有特殊顺位薪资表)
function calcDraftSalary(draftPosition, league) {
  if (league === 'NBA') {
    // NBA新秀合同: 基于顺位的固定工资表
    if (draftPosition <= 1) return randInt(10000000, 12000000);   // 状元
    if (draftPosition <= 5) return randInt(7000000, 10000000);    // 前5
    if (draftPosition <= 14) return randInt(3500000, 7000000);    // 乐透
    if (draftPosition <= 30) return randInt(2100000, 3500000);    // 首轮
    return randInt(500000, 1100000);                              // 次轮
  }
  // 其他联赛: 用calcSalary按OVR计算(选秀后OVR已经确定)
  return null; // null表示用OVR计算
}

// ============= 生涯随机事件 =============
// 按球员生涯阶段挑选随机事件 (避免短期重复)
function getStoryEvent(p) {
  let stage;
  if (p.phase !== 'pro') {
    stage = 'youth'; // 高中/大学阶段: 仅使用通用场外事件
  } else if (p.proYears <= 3) {
    stage = 'rookie';
  } else if (p.proYears <= 7) {
    stage = 'growth';
  } else if (p.proYears <= 12) {
    stage = 'peak';
  } else {
    stage = 'late';
  }

  // 非职业阶段只用场外事件; 职业阶段 60%阶段事件 + 40%场外事件
  let pool;
  if (stage === 'youth') {
    pool = STORY_EVENTS.offcourt;
  } else {
    pool = Math.random() < 0.6 ? STORY_EVENTS[stage] : STORY_EVENTS.offcourt;
  }

  // 避免最近5次重复
  const recent = (p._storyEventHistory || []).slice(-5);
  let available = pool.filter(e => !recent.includes(e.id));
  if (available.length === 0) available = pool;

  const evt = pick(available);
  p._storyEventHistory = p._storyEventHistory || [];
  p._storyEventHistory.push(evt.id);
  if (p._storyEventHistory.length > 20) p._storyEventHistory.shift();
  return evt;
}

// 应用玩家选择的event效果 (支持概率性结果 chance+success+fail)
function applyStoryEffects(choice, p) {
  let eff = choice.effects || {};
  let outcomeLabel = '';

  // 概率性结果: 先判定成功/失败, 再用对应效果集
  if (eff.chance != null) {
    const ok = Math.random() < eff.chance;
    eff = ok ? (eff.success || {}) : (eff.fail || {});
    outcomeLabel = ok ? ' ✅成功' : ' ❌失败';
  }

  if (eff.ovr) {
    p.ovr = clamp(p.ovr + eff.ovr, 40, 99);
    growAbilities(p, eff.ovr);  // 事件OVR变化同步分项能力
  }
  if (eff.fame) p.fame = clamp(p.fame + eff.fame, 0, 100);
  if (eff.relation) p.relation = clamp(p.relation + eff.relation, 0, 100);
  if (eff.wealth) p.wealth += eff.wealth;
  if (eff.salary && p.salary > 0) p.salary = Math.round(p.salary * eff.salary);
  if (eff.injuryChanceMod) p.injuryChanceMod += eff.injuryChanceMod;
  if (eff.fatigue) p.fatigue = clamp(p.fatigue + eff.fatigue, 0, 100);

  // 更新生涯峰值
  if (p.ovr > p.peakOvr) p.peakOvr = p.ovr;
  if (p.salary > p.peakSalary) p.peakSalary = p.salary;
  if (p.wealth > p.peakWealth) p.peakWealth = p.wealth;

  log('STORY', `✅ 选择: ${choice.title}${outcomeLabel} | OVR:${p.ovr} 名气:${Math.round(p.fame)} 关系:${Math.round(p.relation)} 疲劳:${Math.round(p.fatigue)}`);
  p.yearEvents.push({ type: 'story', icon: '', title: choice.title, outcome: outcomeLabel.trim() });
}

function bindStoryEventEvents() {
  const p = state;
  const evt = p._pendingStoryEvent;
  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      applyStoryEffects(evt.choices[idx], p);
      p._pendingStoryEvent = null;
      render();
    });
  });
}

// ============= RENDERING =============
function render() {
  const app = document.getElementById('app');

  if (!state) {
    app.innerHTML = renderSetupScreen();
    bindSetupEvents();
    return;
  }
  
  if (state.retired) {
    app.innerHTML = renderRetirementScreen();
    bindRetirementEvents();
    return;
  }
  
  // Check for phase-specific choices
  if (state.phase === 'highschool' && state.highSchoolChoices) {
    app.innerHTML = renderHighSchoolChoice();
    bindHighSchoolEvents();
    return;
  }
  
  if (state.phase === 'university' && state.universityChoices) {
    app.innerHTML = renderUniversityChoice();
    bindUniversityEvents();
    return;
  }
  
  // Draft result screen
  if (state._showDraftResult) {
    app.innerHTML = renderDraftResultScreen();
    bindDraftResultEvents();
    return;
  }

  // Story event screen (yearly random event)
  if (state._pendingStoryEvent) {
    app.innerHTML = renderStoryEventScreen();
    bindStoryEventEvents();
    return;
  }

  // Main game screen
  app.innerHTML = renderGameScreen();
  bindGameEvents();
}

function bindSetupEvents() {
  let selectedCountry = null;
  let selectedPosition = 'SF';
  let selectedNumber = 23;
  
  // 步骤切换
  function goStep(n) {
    document.querySelectorAll('.setup-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.step-dots .dot').forEach((d, idx) => {
      d.classList.toggle('active', idx + 1 <= n);
    });
    const target = document.getElementById('step-mode');
    if (n === 1) document.getElementById('step-mode').classList.add('active');
    if (n === 2) document.getElementById('step-country').classList.add('active');
    if (n === 3) document.getElementById('step-pos-num').classList.add('active');
  }
  document.querySelectorAll('.step-next').forEach(b => {
    b.addEventListener('click', () => {
      if (b.disabled) return;
      goStep(parseInt(b.dataset.next));
    });
  });
  document.querySelectorAll('.step-back').forEach(b => {
    b.addEventListener('click', () => goStep(parseInt(b.dataset.prev)));
  });
  
  // 模式选择
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
    });
  });
  
  // 国籍选择 (点击后自动跳转下一页)
  document.querySelectorAll('.step-country-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.step-country-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedCountry = btn.dataset.code;
      setTimeout(() => goStep(3), 200);
    });
  });
  
  // 球场位置选择
  document.querySelectorAll('.pos-dot').forEach(g => {
    g.addEventListener('click', () => {
      const pos = g.getAttribute('data-pos');
      selectedPosition = pos;
      document.querySelectorAll('.pos-dot').forEach(dot => {
        dot.classList.toggle('active', dot.getAttribute('data-pos') === pos);
      });
    });
  });
  // 默认高亮SF
  const defaultDot = document.querySelector('.pos-dot[data-pos="SF"]');
  if (defaultDot) defaultDot.classList.add('active');
  
  // 号码选择: 输入框
  const numInput = document.getElementById('playerNumber');
  function syncNumber(val) {
    let n = parseInt(val);
    if (isNaN(n)) n = 23;
    n = Math.min(99, Math.max(0, n));
    selectedNumber = n;
    const disp = n === 0 ? '00' : String(n);
    numInput.value = n === 0 ? 0 : n;
    const jn = document.getElementById('jerseyNumber');
    if (jn) jn.textContent = disp;
  }
  numInput.addEventListener('input', e => syncNumber(e.target.value));
  document.getElementById('numMinus').addEventListener('click', () => syncNumber(selectedNumber - 1));
  document.getElementById('numPlus').addEventListener('click', () => syncNumber(selectedNumber + 1));
  document.querySelectorAll('.num-chip').forEach(chip => {
    chip.addEventListener('click', () => syncNumber(parseInt(chip.dataset.num)));
  });
  syncNumber(23);
  
  // 姓名实时同步到球衣
  const nameInput = document.getElementById('playerName');
  nameInput.addEventListener('input', () => {
    const jname = document.getElementById('jerseyName');
    if (jname) jname.textContent = (nameInput.value || 'ANONYMOUS').slice(0, 10).toUpperCase();
  });
  
  // 开始按钮
  document.getElementById('startBtn').addEventListener('click', () => {
    if (!selectedCountry) {
      showToast('请先选择国籍');
      goStep(2);
      return;
    }
    const position = POSITIONS.find(p => p.code === selectedPosition);
    const name = document.getElementById('playerName').value || '匿名球员';
    const rawNum = parseInt(document.getElementById('playerNumber').value);
    const number = isNaN(rawNum) ? 23 : rawNum;  // 0号是合法号码,不能用 || 短路
    startGame(selectedCountry, position, name, number);
  });
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

function bindDraftResultEvents() {
  const advance = () => {
    state._showDraftResult = false;
    advanceYear();
    render();
  };
  // Click anywhere to continue
  document.querySelector('.screen.active').addEventListener('click', advance);
}

function renderRetirementScreen() {
  const p = state;
  const country = COUNTRIES.find(c => c.code === p.nationality);
  
  // 按球队分组统计赛季数 (同一球队取首个有logo的条目作为队徽)
  const teamSeasons = {};
  p.career.forEach(c => {
    if (c.team && c.team !== '') {
      if (!teamSeasons[c.team]) {
        teamSeasons[c.team] = { team: c.team, league: c.league || '未知联赛', logo: '', logoCls: 'logo-steel', seasons: [], ovr: c.ovr || 60 };
      }
      // 优先采用有logo的条目 (有些条目如"加入"未带logo)
      if (c.teamLogo && !teamSeasons[c.team].logo) {
        teamSeasons[c.team].logo = c.teamLogo;
        teamSeasons[c.team].logoCls = c.teamLogoCls || 'logo-steel';
      }
      if (c.ovr && c.ovr > (teamSeasons[c.team].ovr || 0)) teamSeasons[c.team].ovr = c.ovr;
      teamSeasons[c.team].seasons.push(c.age);
    }
  });
  
  const uniqueTeams = Object.values(teamSeasons);
  
  // 联赛奖项按类型分组
  const awardGroups = {
    champion: p.leagueAwards.filter(a => a.type === 'champion'),
    fmvp: p.leagueAwards.filter(a => a.type === 'fmvp'),
    mvp: p.leagueAwards.filter(a => a.type === 'mvp'),
    dpoy: p.leagueAwards.filter(a => a.type === 'dpoy'),
    allnba: p.leagueAwards.filter(a => a.type === 'allnba' || a.type === 'allnba2'),
    alldef: p.leagueAwards.filter(a => a.type === 'alldef'),
    stat_leader: p.leagueAwards.filter(a => a.type === 'stat_leader'),
    allstar: p.leagueAwards.filter(a => a.type === 'allstar'),
    as_mvp: p.leagueAwards.filter(a => a.type === 'as_mvp'),
    mip: p.leagueAwards.filter(a => a.type === 'mip'),
