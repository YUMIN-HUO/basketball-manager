// ============= 模拟测试数据系统 =============
// 通过 console.runSimTests() 调用，测试不同场景下的游戏逻辑
// 测试覆盖: 青训体系、选秀逻辑、伤病系统、退役判定

const SIM_TESTS = {
  results: [],
  pass: 0,
  fail: 0,

  reset() { this.results = []; this.pass = 0; this.fail = 0; },

  assert(cond, name, detail) {
    if (cond) { this.pass++; this.results.push(`  ✅ ${name}`); }
    else { this.fail++; this.results.push(`  ❌ ${name} ${detail||''}`); }
  },

  // ===== 测试1: 高中联赛青训体系 (16→18岁, 3年) =====
  testHighSchoolSystem() {
    this.results.push('\n📋 测试1: 高中联赛青训体系');
    const natCodes = ['CHN', 'USA', 'ESP', 'SRB'];
    const pos = POSITIONS[0];

    natCodes.forEach(code => {
      const country = COUNTRIES.find(c => c.code === code);
      const hs = HIGH_SCHOOLS[code];
      this.assert(hs && hs.length >= 3, `${country.name}高中联赛数据≥3支`, `(实际${hs?hs.length:0})`);

      // 模拟创建球员
      const savedState = state;
      const savedYear = gameYear;
      state = createPlayer(code, pos, `测试_${code}`, 23);
      const startOvr = state.ovr;

      // 检查初始状态
      this.assert(state.phase === 'highschool', `${code}初始阶段=highschool`, `(实际${state.phase})`);
      this.assert(state.age === 16, `${code}初始年龄=16`, `(实际${state.age})`);
      this.assert(state.hsYear === 0, `${code}高中年份=0(高一)`, `(实际${state.hsYear})`);

      // 选择高中
      chooseHighSchool(0);
      this.assert(state.teamName !== '', `${code}已分配高中球队`, `(球队=${state.teamName})`);
      this.assert(state.league === country.youthName, `${code}联赛=${country.youthName}`, `(实际${state.league})`);

      // 模拟推进3年高中 (16→18)
      let prevOvr = state.ovr;
      for (let i = 0; i < 3; i++) {
        advanceYear();
        // 高中阶段OVR应整体上升 (16-18岁成长期, 允许随机事件导致的波动)
        if (state.phase === 'highschool' || state.phase === 'university') {
          this.assert(state.ovr >= prevOvr - 3, `${code}第${i+1}年OVR未大幅下降`, `(${prevOvr}→${state.ovr})`);
        }
        prevOvr = state.ovr;
      }

      // 3年后应进入大学
      this.assert(state.phase === 'university' || state.phase === 'pro',
        `${code}3年后进入大学/职业`, `(阶段=${state.phase}, 年龄=${state.age})`);
      this.assert(state.age === 19, `${code}3年后年龄=19`, `(实际${state.age})`);

      // 恢复状态
      state = savedState;
      gameYear = savedYear;
    });
  },

  // ===== 测试2: 选秀逻辑 (不同OVR/年龄/潜力组合) =====
  testDraftLogic() {
    this.results.push('\n📋 测试2: 选秀逻辑 (NBA规则)');
    const scenarios = [
      { ovr: 92, potential: 95, age: 19, desc: '状元级(高OVR+年轻+高潜力)' },
      { ovr: 88, potential: 90, age: 19, desc: '乐透秀(高OVR+年轻)' },
      { ovr: 85, potential: 88, age: 20, desc: '乐透秀(高OVR)' },
      { ovr: 82, potential: 85, age: 21, desc: '乐透末段' },
      { ovr: 78, potential: 82, age: 20, desc: '首轮中段' },
      { ovr: 75, potential: 80, age: 20, desc: '首轮末段' },
      { ovr: 70, potential: 75, age: 21, desc: '次轮秀' },
      { ovr: 68, potential: 72, age: 22, desc: '次轮末段' },
      { ovr: 65, potential: 70, age: 22, desc: '边缘(可能落选)' },
      { ovr: 60, potential: 65, age: 22, desc: '低OVR(高概率落选)' },
      { ovr: 55, potential: 60, age: 22, desc: '极低OVR(落选→自由球员)' },
    ];

    const draftResults = [];
    scenarios.forEach(s => {
      const savedState = state;
      const savedYear = gameYear;
      clearLog();

      // 构造测试球员
      state = createPlayer('USA', POSITIONS[0], `选秀测试_${s.ovr}`, 1);
      state.ovr = s.ovr;
      state.potential = s.potential;
      state.age = s.age;
      state.phase = 'university';
      state.hsGradYear = gameYear - 2;  // 模拟高中毕业2年

      declareDraft();

      const result = {
        scenario: s.desc,
        ovr: s.ovr, potential: s.potential, age: s.age,
        draftPick: state.draftPick,
        salary: state.salary,
        team: state.teamName,
        league: state.league
      };
      draftResults.push(result);

      // 验证选秀结果符合预期 (基于新OVR阈值)
      if (s.ovr >= 88) {
        this.assert(state.draftPick && state.draftPick.overall <= 14,
          `OVR${s.ovr}应进乐透(≤14顺位)`, `(实际=${state.draftPick?state.draftPick.overall:'落选'})`);
      } else if (s.ovr >= 82) {
        this.assert(state.draftPick && state.draftPick.overall <= 14,
          `OVR${s.ovr}应进乐透区(≤14顺位)`, `(实际=${state.draftPick?state.draftPick.overall:'落选'})`);
      } else if (s.ovr >= 75) {
        this.assert(state.draftPick && state.draftPick.overall <= 30,
          `OVR${s.ovr}应进首轮(≤30顺位)`, `(实际=${state.draftPick?state.draftPick.overall:'落选'})`);
      } else if (s.ovr >= 68) {
        this.assert(state.draftPick && state.draftPick.overall <= 60,
          `OVR${s.ovr}应被选中(≤60顺位)`, `(实际=${state.draftPick?state.draftPick.overall:'落选'})`);
      } else {
        // OVR<68可能落选,两种结果都合理
        this.assert(true, `OVR${s.ovr}选秀结果: ${state.draftPick?'第'+state.draftPick.overall+'顺位':'落选'}`);
      }

      // 验证薪资符合新秀合同
      if (state.draftPick) {
        const dp = state.draftPick.overall;
        if (dp <= 5) {
          this.assert(state.salary >= 2500000 && state.salary <= 4000000,
            `前5顺位薪资250-400万`, `(实际=${state.salary})`);
        } else if (dp <= 14) {
          this.assert(state.salary >= 1500000 && state.salary <= 2500000,
            `乐透秀薪资150-250万`, `(实际=${state.salary})`);
        } else if (dp <= 30) {
          this.assert(state.salary >= 800000 && state.salary <= 1500000,
            `首轮秀薪资80-150万`, `(实际=${state.salary})`);
        } else {
          this.assert(state.salary >= 100000 && state.salary <= 500000,
            `次轮秀薪资10-50万`, `(实际=${state.salary})`);
        }
      }

      // 验证阶段转换
      this.assert(state.phase === 'pro', `选秀后阶段=pro`, `(实际=${state.phase})`);

      state = savedState;
      gameYear = savedYear;
    });

    // 输出选秀结果汇总
    this.results.push('\n  📊 选秀结果汇总:');
    draftResults.forEach(r => {
      const pick = r.draftPick ? `第${r.draftPick.overall}顺位` : '落选';
      this.results.push(`    ${r.scenario}: ${pick} → ${r.team}(${r.league}) 薪资${formatSalary(r.salary)}`);
    });
  },

  // ===== 测试3: 伤病系统 (不同严重度场景) =====
  testInjurySystem() {
    this.results.push('\n📋 测试3: 伤病系统');
    const savedState = state;
    const savedYear = gameYear;

    // 测试每种伤病类型
    INJURIES.forEach(injury => {
      clearLog();
      state = createPlayer('USA', POSITIONS[0], `伤病测试_${injury.name}`, 1);
      state.age = 25;
      state.phase = 'pro';
      state.ovr = 80;

      // 手动触发伤病
      const duration = randInt(injury.recovery[0], injury.recovery[1]);
      state.currentInjury = { ...injury, weeksMissed: duration, yearMissed: duration > 8 };
      const prevOvr = state.ovr;
      const prevChronic = state.chronicInjuries;

      if (injury.severity >= 2) {
        const ovrLoss = randInt(1, 3);
        state.ovr = Math.max(40, state.ovr - ovrLoss);
        state.chronicInjuries++;
      }

      state.injuryHistory.push({
        age: state.age, year: gameYear, name: injury.name,
        severity: injury.severity, weeks: duration
      });

      // 验证伤病记录
      this.assert(state.injuryHistory.length === 1, `${injury.name}已记录到病史`);
      this.assert(state.currentInjury.name === injury.name, `${injury.name}当前伤病已设置`);

      // 验证严重伤病影响
      if (injury.severity >= 2) {
        this.assert(state.ovr < prevOvr, `${injury.name}(严重度${injury.severity})导致OVR下降`, `(${prevOvr}→${state.ovr})`);
        this.assert(state.chronicInjuries === prevChronic + 1, `${injury.name}慢性伤病计数+1`, `(=${state.chronicInjuries})`);
      }

      // 验证恢复时间在合理范围
      this.assert(duration >= injury.recovery[0] && duration <= injury.recovery[1],
        `${injury.name}恢复时间${injury.recovery[0]}-${injury.recovery[1]}周`, `(实际=${duration})`);

      // 模拟恢复过程
      const weeksToRecover = duration;
      for (let w = 0; w < weeksToRecover; w++) {
        if (state.currentInjury) state.currentInjury.weeksMissed--;
        if (state.currentInjury && state.currentInjury.weeksMissed <= 0) {
          state.currentInjury = null;
        }
      }
      this.assert(state.currentInjury === null, `${injury.name}恢复后currentInjury=null`);
    });

    // 测试年龄对伤病概率的影响
    this.results.push('\n  📊 年龄-伤病概率测试:');
    [20, 25, 30, 33, 36, 40].forEach(age => {
      const baseChance = 0.12;
      const ageMod = age > 30 ? (age - 30) * 0.02 : 0;
      const totalChance = baseChance + ageMod;
      this.results.push(`    ${age}岁: 伤病概率=${(totalChance*100).toFixed(1)}% (基础12%+年龄修正${(ageMod*100).toFixed(0)}%)`);
    });

    state = savedState;
    gameYear = savedYear;
  },

  // ===== 测试4: 退役判定 (多条件) =====
  testRetirement() {
    this.results.push('\n📋 测试4: 退役判定');
    const savedState = state;
    const savedYear = gameYear;

    // 场景1: 年龄42强制退役
    clearLog();
    state = createPlayer('USA', POSITIONS[0], '退役测试_年龄', 1);
    state.age = 42;
    state.phase = 'pro';
    state.ovr = 75;
    checkRetirement(state);
    this.assert(state.retired === true, '42岁强制退役', `(retired=${state.retired})`);
    this.assert(state.retirementReason.includes('42'), '退役原因含"42岁"');

    // 场景2: OVR<60被迫退役 (30岁以下)
    clearLog();
    state = createPlayer('USA', POSITIONS[0], '退役测试_低OVR', 1);
    state.age = 28;
    state.phase = 'pro';
    state.ovr = 55;
    checkRetirement(state);
    this.assert(state.retired === true, 'OVR<60被迫退役', `(OVR=${state.ovr}, retired=${state.retired})`);
    this.assert(state.retirementReason.includes('能力值'), '退役原因含"能力值"');

    // 场景3: 严重伤病退役
    clearLog();
    state = createPlayer('USA', POSITIONS[0], '退役测试_伤病', 1);
    state.age = 32;
    state.phase = 'pro';
    state.ovr = 70;
    state.currentInjury = { name: '十字韧带撕裂', severity: 3, weeksMissed: 10, recovery: [4,10] };
    checkRetirement(state);
    this.assert(state.retired === true, '严重伤病(severity≥3,≥10周)退役', `(retired=${state.retired})`);

    // 场景4: 38岁+OVR<70 自然退役 (概率性,运行多次)
    let retireCount = 0;
    const trials = 20;
    for (let i = 0; i < trials; i++) {
      state = createPlayer('USA', POSITIONS[0], '退役测试_自然', 1);
      state.age = 38;
      state.phase = 'pro';
      state.ovr = 65;
      state.currentInjury = null;
      checkRetirement(state);
      if (state.retired) retireCount++;
    }
    this.assert(retireCount > 0 && retireCount < trials,
      `38岁+OVR65有概率退役(~50%)`, `(20次中${retireCount}次退役)`);

    // 场景5: 正常球员不应过早退役
    clearLog();
    state = createPlayer('USA', POSITIONS[0], '退役测试_正常', 1);
    state.age = 28;
    state.phase = 'pro';
    state.ovr = 80;
    state.currentInjury = null;
    state.chronicInjuries = 0;
    state.recentGames = [70, 75, 68];  // 正常出场
    checkRetirement(state);
    this.assert(state.retired === false, '28岁OVR80不应退役', `(retired=${state.retired})`);

    // 场景6: 连续出场不足退役
    clearLog();
    state = createPlayer('USA', POSITIONS[0], '退役测试_出场不足', 1);
    state.age = 32;
    state.phase = 'pro';
    state.ovr = 72;
    state.league = 'NBA';
    state.recentGames = [15, 20, 10];  // NBA平均15场/年,出场率~18%
    checkRetirement(state);
    this.assert(state.retired === true, '连续3年出场率<30%应退役', `(出场率=${(state.recentGames.reduce((a,b)=>a+b,0)/3/82*100).toFixed(0)}%, retired=${state.retired})`);
    this.assert(state.retirementReason.includes('出场率'), '退役原因含"出场率"');

    // 场景7: 称号生成测试 (传奇巨星)
    clearLog();
    state = createPlayer('USA', POSITIONS[0], '称号测试_传奇', 1);
    state.age = 36;
    state.stats = { gp: 1200, pts: 18000, reb: 4000, ast: 5000, ppg: '15.0', rpg: '3.3', apg: '4.2' };
    state.honors = ['奥运会金牌', 'FIBA世界杯冠军'];
    state.potential = 92;
    const title1 = generateCareerTitle(state);
    this.assert(title1 === '传奇巨星', '传奇巨星称号(金牌+15年+18000分)', `(实际=${title1})`);

    // 场景8: 称号生成测试 (逆袭之星)
    clearLog();
    state = createPlayer('USA', POSITIONS[0], '称号测试_逆袭', 1);
    state.age = 32;
    state.stats = { gp: 600, pts: 9000, reb: 2000, ast: 1500, ppg: '15.0', rpg: '3.3', apg: '2.5' };
    state.honors = [];
    state.potential = 82;
    state.draftPick = { overall: 55 };  // 次轮末
    const title2 = generateCareerTitle(state);
    this.assert(title2 === '逆袭之星', '逆袭之星称号(低顺位+9000分+潜力82)', `(实际=${title2})`);

    // 场景9: 称号生成测试 (匆匆过客)
    clearLog();
    state = createPlayer('USA', POSITIONS[0], '称号测试_过客', 1);
    state.age = 21;
    state.stats = { gp: 80, pts: 500, reb: 100, ast: 80, ppg: '6.3', rpg: '1.3', apg: '1.0' };
    state.honors = [];
    state.potential = 65;
    state.draftPick = null;
    const title3 = generateCareerTitle(state);
    this.assert(title3 === '匆匆过客', '匆匆过客称号(5年生涯+80场)', `(实际=${title3})`);

    state = savedState;
    gameYear = savedYear;
  },

  // ===== 测试5: 完整生涯模拟 (16岁→退役) =====
  testFullCareer() {
    this.results.push('\n📋 测试5: 完整生涯模拟');
    const careers = [];
    const testConfigs = [
      { nat: 'USA', pos: POSITIONS[0], name: '天才后卫', desc: '美国PG' },
      { nat: 'CHN', pos: POSITIONS[4], name: '中国大个子', desc: '中国C' },
      { nat: 'ESP', pos: POSITIONS[2], name: '西班牙前锋', desc: '西班牙SF' },
      { nat: 'SRB', pos: POSITIONS[1], name: '塞尔维亚射手', desc: '塞尔维亚SG' },
    ];

    testConfigs.forEach(cfg => {
      const savedState = state;
      const savedYear = gameYear;
      clearLog();

      state = createPlayer(cfg.nat, cfg.pos, cfg.name, randInt(1, 55));
      const startOvr = state.ovr;
      chooseHighSchool(0);

      // 大学选择
      if (state.phase === 'highschool' && state.highSchoolChoices === null) {
        // 推进到大学
        while (state.phase === 'highschool' && !state.retired) advanceYear();
        if (state.universityChoices) chooseUniversity(0);
      }

      // 大学阶段: 19岁后选择参选或留守
      let draftAge = null;
      while (state.phase === 'university' && !state.retired) {
        if (state.age >= 19 && !state.draftDeclared && state.ovr >= 80) {
          // 高OVR球员提前参选
          declareDraft();
          draftAge = state.age;
          break;
        } else if (state.age >= 22) {
          // 22岁强制参选
          declareDraft();
          draftAge = state.age;
          break;
        }
        advanceYear();
        // advanceYear内部可能触发自动选秀(checkPhaseTransition)
        if (state.phase === 'pro' && draftAge === null) {
          draftAge = state.age;
        }
      }

      // 职业阶段: 推进到退役
      let proYears = 0;
      while (!state.retired && state.age < 45) {
        advanceYear();
        proYears++;
        if (proYears > 30) break; // 安全阀
      }

      const career = {
        name: cfg.name,
        desc: cfg.desc,
        startOvr: startOvr,
        peakOvr: state.ovr,
        finalOvr: state.ovr,
        draftAge: draftAge,
        draftPick: state.draftPick,
        retired: state.retired,
        retirementReason: state.retirementReason,
        retireAge: state.age,
        totalGames: state.stats.gp,
        totalPts: state.stats.pts,
        totalReb: state.stats.reb,
        totalAst: state.stats.ast,
        ppg: state.stats.ppg,
        honors: state.honors,
        injuries: state.injuryHistory.length,
        chronicInjuries: state.chronicInjuries,
        wealth: state.wealth,
        fame: state.fame,
        proYears: proYears,
        careerTitle: state.careerTitle
      };
      careers.push(career);

      // 验证生涯完整性
      this.assert(state.retired === true, `${cfg.name}已退役`, `(age=${state.age})`);
      this.assert(state.age >= 22 && state.age <= 45, `${cfg.name}退役年龄22-45岁`, `(实际=${state.age})`);
      this.assert(state.stats.gp > 0, `${cfg.name}有比赛记录`, `(GP=${state.stats.gp})`);
      this.assert(state.career.length >= 3, `${cfg.name}生涯事件≥3`, `(事件数=${state.career.length})`);
      this.assert(state.careerTitle && state.careerTitle.length > 0, `${cfg.name}有结局称号`, `(称号=${state.careerTitle})`);

      state = savedState;
      gameYear = savedYear;
    });

    // 输出生涯汇总
    this.results.push('\n  📊 生涯模拟汇总:');
    careers.forEach(c => {
      const pick = c.draftPick ? `第${c.draftPick.overall}顺位` : '落选';
      this.results.push(`    ${c.name}(${c.desc}): ${c.startOvr}→${c.peakOvr}OVR | ${c.draftAge}岁参选${pick} | ${c.retireAge}岁退役(${c.retirementReason||''}) | ${c.totalGames}场 ${c.totalPts}分 | ${c.injuries}次伤病 | ${c.honors.length}荣誉 | 称号:${c.careerTitle}`);
    });
  },

  // ===== 运行所有测试 =====
  runAll() {
    this.reset();
    console.log('🏀 ===== 篮球生涯模拟器 · 逻辑测试开始 =====');
    const t0 = Date.now();

    this.testHighSchoolSystem();
    this.testDraftLogic();
    this.testInjurySystem();
    this.testRetirement();
    this.testFullCareer();

    const elapsed = Date.now() - t0;
    this.results.push(`\n⏱️ 测试耗时: ${elapsed}ms`);

    const report = this.results.join('\n');
    console.log('%c' + report, 'color: #ff6b35');
    console.log(`%c📊 结果: ${this.pass} 通过 / ${this.fail} 失败`, `color: ${this.fail===0?'#22c55e':'#ef4444'}; font-weight: bold`);

    // 同时返回到日志系统
    log('TEST', `模拟测试完成: ${this.pass}通过/${this.fail}失败 (${elapsed}ms)`);

    return { report, pass: this.pass, fail: this.fail, elapsed };
  }
};
