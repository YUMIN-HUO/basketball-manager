<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>篮球生涯模拟器 · 从青训到传奇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0e17;
    --card: #131a2b;
    --card2: #1a2238;
    --accent: #ff6b35;
    --accent2: #f7931e;
    --gold: #ffd700;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --text: #e8eaf0;
    --text-dim: #8b92a8;
    --border: #2a3350;
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    background: linear-gradient(180deg, #0a0e17 0%, #0f1424 50%, #0a0e17 100%);
  }
  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 12px;
    min-height: 100vh;
  }
  .screen { display: none; animation: fadeIn .3s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 5px rgba(255,107,53,0.3); }
    50% { box-shadow: 0 0 20px rgba(255,107,53,0.6); }
  }
  h1, h2, h3 { font-weight: 700; }
  .btn {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text);
    font-size: 15px; font-weight: 500;
    cursor: pointer; transition: all .2s ease;
    text-align: left; font-family: inherit;
  }
  .btn:hover { background: var(--card2); border-color: var(--accent); }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: white;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: 0.4; pointer-events: none; }
  .btn-sm { padding: 10px 12px; font-size: 13px; }
  .btn-block { margin-bottom: 8px; }

  .header {
    text-align: center; padding: 20px 0 16px;
  }
  .header h1 {
    font-size: 24px;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p { color: var(--text-dim); font-size: 13px; margin-top: 6px; }

  .setup-section { margin-bottom: 20px; }
  .setup-title {
    font-size: 18px; font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .setup-title .step {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent); color: white; font-size: 12px;
  }
  .country-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  }
  .country-btn {
    flex-direction: column; align-items: flex-start; gap: 4px;
  }
  .country-btn .flag { font-size: 24px; }
  .country-btn .c-name { font-weight: 600; }
  .country-btn .c-info { font-size: 12px; color: var(--text-dim); }
  .country-btn.selected {
    background: linear-gradient(135deg, rgba(255,107,53,0.2), rgba(247,147,30,0.1));
    border-color: var(--accent);
  }

  .input-row { display: flex; gap: 10px; }
  .input-row input {
    flex: 1; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 15px;
    font-family: inherit; outline: none;
  }
  .input-row input:focus { border-color: var(--accent); }
  .pos-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pos-btn {
    flex-direction: column; align-items: center; gap: 4px;
    padding: 12px 6px; font-size: 12px;
  }
  .pos-btn .pos-code { font-weight: 700; font-size: 16px; color: var(--accent); }

  /* Player Card */
  .player-card {
    background: linear-gradient(145deg, var(--card), var(--card2));
    border-radius: 16px; padding: 16px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .player-main {
    display: flex; align-items: center; gap: 14px;
  }
  .ovr-badge {
    width: 68px; height: 68px; border-radius: 14px;
    background: linear-gradient(145deg, #1a1f35, #0f1424);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border: 2px solid var(--accent);
    flex-shrink: 0;
  }
  .ovr-badge .ovr {
    font-size: 28px; font-weight: 800; color: var(--accent);
    line-height: 1;
  }
  .ovr-badge .ovr-label {
    font-size: 10px; color: var(--text-dim); margin-top: 2px;
  }
  .player-info { flex: 1; min-width: 0; }
  .player-name {
    font-size: 18px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .player-meta {
    font-size: 13px; color: var(--text-dim); margin-top: 3px;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .player-meta span { display: inline-flex; align-items: center; gap: 3px; }
  .team-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px; padding: 8px 10px;
    background: rgba(255,255,255,0.03); border-radius: 8px;
  }
  .team-logo {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: white;
    flex-shrink: 0; position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .team-logo svg { width: 100%; height: 100%; border-radius: 50%; }
  .team-name { font-size: 14px; font-weight: 600; }
  .team-league { font-size: 11px; color: var(--text-dim); }

  /* Stat bars */
  .stat-bars { display: flex; gap: 12px; margin-top: 12px; }
  .stat-bar { flex: 1; }
  .stat-bar .bar-label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--text-dim); margin-bottom: 4px;
  }
  .bar-fill {
    height: 6px; background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden;
  }
  .bar-inner {
    height: 100%; border-radius: 3px;
    transition: width .5s ease;
  }
  .bar-green { background: linear-gradient(90deg, #22c55e, #16a34a); }
  .bar-blue { background: linear-gradient(90deg, #3b82f6, #2563eb); }
  .bar-gold { background: linear-gradient(90deg, #f59e0b, #d97706); }

  /* Stats grid */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; margin-top: 12px;
  }
  .stat-item {
    text-align: center; padding: 8px 4px;
    background: rgba(255,255,255,0.03); border-radius: 8px;
  }
  .stat-value { font-size: 16px; font-weight: 700; color: var(--text); }
  .stat-label { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  /* Decision card */
  .event-card {
    background: linear-gradient(145deg, var(--card), var(--card2));
    border-radius: 16px; padding: 16px;
    border: 1px solid var(--border); margin-bottom: 16px;
  }
  .event-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; margin-bottom: 12px;
  }
  .event-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .event-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 14px; }
  .choice-btn {
    flex-direction: column; align-items: flex-start; gap: 6px;
    margin-bottom: 10px;
  }
  .choice-btn .choice-title { font-weight: 600; font-size: 14px; }
  .choice-btn .choice-desc { font-size: 12px; color: var(--text-dim); }
  .choice-btn .choice-tag {
    display: inline-block; padding: 2px 6px; border-radius: 4px;
    background: rgba(255,107,53,0.15); color: var(--accent);
    font-size: 11px; font-weight: 600;
  }

  /* Timeline */
  .timeline-title {
    font-size: 14px; font-weight: 600; margin-bottom: 8px;
    color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .timeline-item {
    display: flex; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-age {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent); color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .timeline-content { flex: 1; min-width: 0; }
  .timeline-main { font-size: 13px; font-weight: 500; }
  .timeline-sub { font-size: 11px; color: var(--text-dim); }

  /* Honor */
  .honor-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .honor-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 6px;
    background: rgba(255,215,0,0.1); color: var(--gold);
    font-size: 11px; font-weight: 600;
    border: 1px solid rgba(255,215,0,0.2);
  }

  /* Retirement */
  .retire-card {
    background: linear-gradient(145deg, var(--card), var(--card2));
    border-radius: 16px; padding: 20px;
    border: 1px solid var(--border); text-align: center;
  }
  .retire-title {
    font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .retire-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 20px; }
  .career-stats {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-bottom: 16px;
  }
  .career-stat {
    padding: 12px; background: rgba(255,255,255,0.03);
    border-radius: 10px;
  }
  .career-stat .val {
    font-size: 22px; font-weight: 800;
    color: var(--accent);
  }
  .career-stat .lbl {
    font-size: 11px; color: var(--text-dim); margin-top: 2px;
  }

  .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mode-btn {
    flex-direction: column; align-items: center; gap: 4px;
    padding: 14px 8px; text-align: center;
  }
  .mode-btn .mode-name { font-weight: 700; font-size: 13px; }
  .mode-btn .mode-desc { font-size: 10px; color: var(--text-dim); }
  .mode-btn.active {
    background: linear-gradient(135deg, rgba(255,107,53,0.3), rgba(247,147,30,0.2));
    border-color: var(--accent);
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px;
    z-index: 100; display: flex; align-items: center; gap: 8px;
    animation: slideUp .3s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .hidden { display: none !important; }

  /* Scroll hint */
  .scroll-hint {
    text-align: center; color: var(--text-dim);
    font-size: 11px; padding: 8px 0;
  }

  /* Logo colors */
  .logo-athletic { background: linear-gradient(135deg, #c8102e, #7a0a1c); }
  .logo-classic { background: linear-gradient(135deg, #1e3a5f, #0f1f33); }
  .logo-modern { background: linear-gradient(135deg, #3d2b1f, #1a0f08); }
  .logo-bright { background: linear-gradient(135deg, #ff6b35, #c44a1a); }
  .logo-navy { background: linear-gradient(135deg, #0f1b3d, #1a2d5a); }
  .logo-red { background: linear-gradient(135deg, #d32f2f, #8b0000); }
  .logo-green { background: linear-gradient(135deg, #2e7d32, #1b5e20); }
  .logo-blue { background: linear-gradient(135deg, #1565c0, #0d47a1); }
  .logo-purple { background: linear-gradient(135deg, #6a1b9a, #4a148c); }
  .logo-orange { background: linear-gradient(135deg, #e65100, #bf360c); }
  .logo-gold { background: linear-gradient(135deg, #b8860b, #8b6508); }
  .logo-teal { background: linear-gradient(135deg, #00695c, #004d40); }
  .logo-crimson { background: linear-gradient(135deg, #8b0000, #5a0000); }
  .logo-royal { background: linear-gradient(135deg, #1a237e, #0d1442); }
  .logo-sunset { background: linear-gradient(135deg, #ff6f00, #c43e00); }
  .logo-forest { background: linear-gradient(135deg, #1b5e20, #0d3311); }
  .logo-steel { background: linear-gradient(135deg, #455a64, #263238); }
  .logo-maroon { background: linear-gradient(135deg, #5d1a1a, #3d0f0f); }
  .logo-emerald { background: linear-gradient(135deg, #00695c, #004d40); }
  .logo-silver { background: linear-gradient(135deg, #546e7a, #37474f); }
  .logo-black { background: linear-gradient(135deg, #212121, #000000); }

  .competition-banner {
    padding: 10px 14px; border-radius: 10px;
    background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,107,53,0.1));
    border: 1px solid rgba(255,215,0,0.3);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .competition-banner .cb-icon { font-size: 20px; }
  .competition-banner .cb-text { font-size: 13px; font-weight: 600; }

  .draft-card {
    background: linear-gradient(145deg, var(--card), var(--card2));
    border-radius: 16px; padding: 16px;
    border: 1px solid var(--border);
  }
  .draft-pick {
    display: flex; align-items: center; gap: 12px;
    padding: 10px; background: rgba(255,255,255,0.03);
    border-radius: 10px; margin-bottom: 8px;
  }
  .draft-pick .pick-num {
    font-size: 13px; font-weight: 700; color: var(--accent);
    background: rgba(255,107,53,0.1); padding: 4px 8px; border-radius: 6px;
    flex-shrink: 0;
  }
  .draft-pick .pick-team { flex: 1; min-width: 0; }
  .draft-pick .pick-team-name { font-weight: 600; font-size: 14px; }
  .draft-pick .pick-team-league { font-size: 11px; color: var(--text-dim); }

  .injured-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(239,68,68,0.15); color: var(--red);
    font-size: 11px; font-weight: 600;
  }

  .legend-chip {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 7px; border-radius: 5px;
    background: rgba(255,215,0,0.15);
    border: 1px solid rgba(255,215,0,0.3);
    font-size: 11px; font-weight: 600; color: var(--gold);
  }

  @media (max-width: 380px) {
    .country-grid { grid-template-columns: 1fr; }
    .pos-grid { grid-template-columns: repeat(3, 1fr); }
    .mode-grid { grid-template-columns: 1fr; }
  }

  /* ========== 新界面样式 ========== */

  /* 顶部：球员信息卡 (足一把风格) */
  .player-card {
    background: linear-gradient(180deg, #131828 0%, #101526 100%);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 14px 14px 12px;
    margin-bottom: 10px;
  }
  .pc-top { display: flex; gap: 12px; align-items: flex-start; }
  .pc-top .ovr-badge {
    width: 84px; height: 84px; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 2px 14px rgba(255,107,53,0.18) inset, 0 4px 14px rgba(0,0,0,0.4);
    border: 1.5px solid rgba(255,107,53,0.35);
    margin: 0; flex-shrink: 0;
  }
  .ovr-badge .ovr {
    font-size: 34px; font-weight: 900; line-height: 1;
    background: linear-gradient(180deg, #ffd09e 0%, #ff7043 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .ovr-badge .ovr-label { font-size: 10px; letter-spacing: 2px; color: #b8a98a; margin-top: 2px; }
  .pc-player { flex: 1; min-width: 0; }
  .pc-name-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  .pc-flag { font-size: 18px; line-height: 1; }
  .pc-name { font-size: 19px; font-weight: 800; color: #fff; }
  .pc-number { font-size: 14px; font-weight: 700; color: var(--accent); padding: 1px 7px; border-radius: 5px; background: rgba(255,107,53,0.15); }
  .pc-pos { font-size: 12px; font-weight: 800; color: #b9c2d8; background: rgba(255,255,255,0.06); padding: 1px 7px; border-radius: 5px; }
  .pc-team-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .pc-team-logo { width: 22px; height: 22px; }
  .pc-team-name { font-size: 14px; font-weight: 700; color: #fff; }
  .pc-league { font-size: 11px; color: var(--text-dim); margin-left: 2px; }
  .pc-meta-row { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-dim); }
  .pc-meta-row span { font-weight: 600; }

  /* 四项数据 */
  .pc-four-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin: 12px 0 10px;
  }
  .pc-stat {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 4px; border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
  }
  .pcs-icon { font-size: 14px; }
  .pcs-val { font-size: 20px; font-weight: 900; color: #fff; line-height: 1; }
  .pcs-lab { font-size: 10.5px; color: var(--text-dim); font-weight: 600; }

  /* 关系/清白/名气/财富条 */
  .pc-bars { display: flex; flex-direction: column; gap: 6px; }
  .pc-bar { display: grid; grid-template-columns: 44px 1fr 34px; align-items: center; gap: 8px; }
  .pc-bar-wealth { grid-template-columns: 58px 1fr; }
  .pcb-lab { font-size: 11px; font-weight: 700; color: var(--text-dim); }
  .pcb-track {
    height: 7px; background: rgba(255,255,255,0.06);
    border-radius: 10px; overflow: hidden;
  }
  .pcb-fill { height: 100%; border-radius: 10px; transition: width .3s; }
  .pcb-fill.pcb-blue { background: linear-gradient(90deg, #2e6cd6, #5d90ff); }
  .pcb-fill.pcb-green { background: linear-gradient(90deg, #22a06b, #4ecfa0); }
  .pcb-fill.pcb-gold { background: linear-gradient(90deg, #c28a2e, #ffd26a); }
  .pcb-val { font-size: 11px; font-weight: 800; color: #fff; text-align: right; }
  .pcb-wealth {
    font-size: 12px; font-weight: 800; color: #ffce74;
    background: rgba(255,206,116,0.1);
    padding: 3px 9px; border-radius: 6px; text-align: right;
  }

  /* 重开入口 */
  .pc-restart-row { margin-top: 10px; }
  .pc-restart {
    width: 100%; display: flex; align-items: center; gap: 6px;
    justify-content: flex-start; font-size: 12px;
    padding: 8px 12px; border-radius: 10px;
    background: linear-gradient(180deg, rgba(34,195,107,0.18), rgba(34,195,107,0.04));
    border: 1px solid rgba(34,195,107,0.25); color: #81e4b5;
    font-weight: 700;
  }
  .pc-restart .pcr-icon { font-size: 13px; }
  .pc-restart:hover { filter: brightness(1.1); }

  /* 中间区域(横幅/荣誉/时间线) */
  .middle-section {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 10px;
  }
  .middle-section:empty { margin: 0; }

  /* 生涯时间线表格 */
  .career-timeline {
    background: linear-gradient(180deg, #131828, #101526);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 8px;
  }
  .ct-header-row, .ct-row {
    display: grid; align-items: center;
    grid-template-columns: 56px 1fr 50px 42px 42px 42px;
    gap: 6px; padding: 7px 6px;
  }
  .ct-header-row {
    border-bottom: 1px solid rgba(255,255,255,0.07);
    font-size: 10.5px; color: var(--text-dim); font-weight: 700;
    text-align: center; margin-bottom: 4px;
  }
  .ct-row {
    border-radius: 8px; font-size: 12px;
  }
  .ct-row:nth-child(even) { background: rgba(255,255,255,0.02); }
  .ct-age { text-align: center; font-weight: 800; color: #fff; font-size: 13px; }
  .ct-age-ovr {
    background: linear-gradient(135deg, #2155b8, #1a3c83);
    border-radius: 6px; padding: 4px 2px;
    box-shadow: 0 2px 6px rgba(33,85,184,0.3);

  .ct-team > span:last-child {

    font-size: 9.5px; font-weight: 800; color: #ff9e67;
    background: rgba(255,107,53,0.1);
    padding: 1px 6px; border-radius: 4px; margin-left: 4px;
    white-space: nowrap;
  }

  /* 事件卡片 — 放在最底部 */
  .event-card-bottom {
    margin-top: auto;
    background: linear-gradient(180deg, #141b30, #0f1428);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 14px 12px 12px;
    box-shadow: 0 -10px 28px rgba(0,0,0,0.45);
  }
  .ev-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .ev-icon {
    width: 30px; height: 30px; border-radius: 8px;
    background: rgba(255,107,53,0.15); color: #ff8c5e;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .ev-title { font-size: 16px; font-weight: 800; color: #fff; }
  .ev-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.55; margin: 2px 4px 10px; }
  .ev-choices { display: flex; flex-direction: column; gap: 8px; }

  /* 主屏幕三段流式布局: 顶栏卡 - 中间滚动 - 事件卡 固定 */
  .screen-flow {
    display: flex; flex-direction: column; min-height: calc(100vh - 32px);
    height: 100%;
  }
  .screen-flow > .middle-section {
    overflow-y: auto; flex: 1;
  }

  /* ========== 三步骤 开始界面 ========== */
  #screen-setup {
    display: flex; flex-direction: column; gap: 12px;
  }
  .setup-steps { display: flex; justify-content: center; padding: 4px 0 2px; }
  .step-dots { display: flex; align-items: center; gap: 6px; }
  .step-dots .dot {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.06); color: var(--text-dim);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800;
    border: 1.5px solid rgba(255,255,255,0.1);
    transition: all .25s;
  }
  .step-dots .dot.active {
    background: linear-gradient(135deg, #ff7043, #f7931e);
    color: #fff; border-color: rgba(255,156,100,0.5);
    box-shadow: 0 3px 14px rgba(255,112,67,0.35);
  }
  .step-line {
    display: inline-block; width: 46px; height: 2px;
    background: rgba(255,255,255,0.12);
    position: relative; top: -1px;
  }

  .setup-panel { display: none; animation: fadeSlide .28s ease; }
  .setup-panel.active { display: flex; flex-direction: column; gap: 14px; }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateX(16px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .setup-title-lg {
    font-size: 18px; font-weight: 800; color: #fff;
    padding-left: 10px; border-left: 4px solid var(--accent);
  }

  /* 步骤1 模式选择 */
  .step-mode-grid {
    grid-template-columns: repeat(3, 1fr);
  }
  .mode-btn {
    display: flex !important; flex-direction: column; align-items: center; gap: 6px;
    padding: 18px 10px;
  }
  .mode-ico { font-size: 26px; }
  .mode-name { font-size: 16px; font-weight: 900; }
  .mode-desc { font-size: 11px; color: var(--text-dim); line-height: 1.4; text-align: center; }

  .step-next, .step-back {
    width: 100%; display: flex; justify-content: center;
    padding: 12px 14px; font-weight: 800; font-size: 14px;
  }
  .step-next[disabled] {
    opacity: .45; cursor: not-allowed; filter: grayscale(.5);
  }
  .step-nav-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .step-back {
    background: rgba(255,255,255,0.05); color: var(--text-dim);
    border-color: rgba(255,255,255,0.12);
  }

  /* 步骤2 国籍选择 (国旗加大) */
  .step-country-grid {
    grid-template-columns: repeat(3, 1fr) !important;
  }
  @media (max-width: 400px) {
    .step-country-grid { grid-template-columns: repeat(2, 1fr) !important; }

  .step-country-btn {
    display: flex !important; flex-direction: column; align-items: center; gap: 4px;

  .step-country-btn .c-info { font-size: 10.5px; color: var(--text-dim); }

  /* 步骤3 球场+球衣 */
  .sub-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 800; color: #d9dfe9;

  .st-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: linear-gradient(135deg, #ff7043, #f7931e);
    box-shadow: 0 0 0 3px rgba(255,112,67,0.15);
  }
  .court-select-wrap {
    background: linear-gradient(180deg, #131828, #101526);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 12px;
  }
  .court-svg-wrap {
    width: 100%; border-radius: 10px; overflow: hidden;
    background: #1a1207;
  }
  .court-svg-wrap svg { display: block; width: 100%; height: auto; }
  /* 球场位置点样式 */
  .pos-dots .pos-dot { cursor: pointer; }
  .pd-bg {
    fill: rgba(255,255,255,0.06);
    stroke: rgba(255,255,255,0.3); stroke-width: 2;
    transition: all .2s;
  }
  .pd-txt {
    text-anchor: middle; font-size: 15px; font-weight: 900; fill: #fff;
    font-family: Impact, sans-serif;
  }
  .pd-name {
    text-anchor: middle; font-size: 9px; fill: rgba(255,255,255,0.85);
    font-weight: 600;
  }
  .pos-dot:hover .pd-bg {
    fill: rgba(255,107,53,0.25);
    stroke: rgba(255,107,53,0.65);
  }
  .pos-dot.active .pd-bg {
    fill: rgba(255,107,53,0.4);
    stroke: #ff7043; stroke-width: 3;
    filter: drop-shadow(0 0 8px rgba(255,112,67,0.6));
  }
  .pos-dot.active .pd-txt { fill: #fff; }
  .pos-dot.active .pd-name { fill: #ffe7c9; }

  .jersey-name-wrap {
    background: linear-gradient(180deg, #131828, #101526);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 12px;
  }
  .jersey-row {
    display: grid; grid-template-columns: 140px 1fr; gap: 14px; align-items: start;
  }

  .num-btn {

  }

// ============= LOGGING SYSTEM =============
const LOG_ENABLED = true;
const gameLog = [];

function log(category, message, data) {
  if (!LOG_ENABLED) return;
  const entry = {
    time: new Date().toISOString(),
    year: gameYear,
    category: category,
    message: message,
    data: data ? JSON.parse(JSON.stringify(data)) : null
  };
  gameLog.push(entry);
  console.log(`[${category}] ${gameYear}年 | ${message}`, data || '');
}

function getLog() { return gameLog; }
function clearLog() { gameLog.length = 0; }
function printLog() {
  gameLog.forEach(e => console.log(`[${e.category}] ${e.year}年 | ${e.message}`));
}

// ============= UTILITY =============
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
// 巅峰潜力值加权随机: 95-99(5%), 90-94(10%), 80-89(30%), 55-79(55%)
function rollPotential() {
  const r = Math.random();
  if (r < 0.05) return randInt(95, 99);
  if (r < 0.15) return randInt(90, 94);
  if (r < 0.45) return randInt(80, 89);
  return randInt(55, 79);
}
function pickN(arr, n) {
  const copy = [...arr]; const result = [];
  for (let i = 0; i < n && copy.length; i++) {
    const idx = Math.floor(Math.random() * copy.length);
    result.push(copy.splice(idx, 1)[0]);
  }
  return result;
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// 生成队徽HTML (真实图片优先,SVG兜底)
function getTeamBadge(logo, cls, teamName) {
  let imgUrl = null;
  // 1. NBA球队: 使用官方CDN
  if (teamName && NBA_LOGO_IDS[teamName]) {
    imgUrl = `https://cdn.nba.com/logos/nba/${NBA_LOGO_IDS[teamName]}/primary/L/logo.svg`;
  }
  // 2. 非NBA已知球队: 使用Wikipedia URL
  else if (teamName && TEAM_LOGO_URLS[teamName]) {
    imgUrl = TEAM_LOGO_URLS[teamName];
  }

  if (imgUrl) {
    return `<img src="${imgUrl}" alt="${teamName || logo}" data-logo="${logo}" data-cls="${cls}" onload="this.style.display='block'" style="width:100%;height:100%;object-fit:contain;display:block" onerror="replaceFallbackBadge(this)">`;
  }
  // 3. 无真实队徽: 生成SVG兜底
  return getFallbackBadge(logo, cls);
}

function replaceFallbackBadge(imgEl) {
  const logo = imgEl.dataset.logo || imgEl.alt || '';
  const cls = imgEl.dataset.cls || '';
  imgEl.outerHTML = getFallbackBadge(logo, cls);
}

function getFallbackBadge(logo, cls) {
  const colors = LOGO_COLORS[cls] || ['#444', '#222'];
  const c1 = colors[0], c2 = colors[1];
  let seed = 0;
  for (let i = 0; i < logo.length; i++) seed += logo.charCodeAt(i);
  const shortLogo = logo.length > 4 ? logo.substring(0, 4) : logo;
  return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="19" fill="${c2}"/>
    <circle cx="20" cy="20" r="16" fill="${c1}"/>
    <circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <text x="20" y="25" text-anchor="middle" font-size="11" font-weight="800" fill="white" font-family="Arial">${shortLogo}</text>
  </svg>`;
}

  if (honor.includes('MVP')) return SVG_ICONS.star;

  if (honor.includes('得分王') || honor.includes('助攻王') || honor.includes('篮板王')) return SVG_ICONS.target;

// === 按球队名查找球队数据 ===
function findTeamByName(name) {
  for (const code in PRO_TEAMS) {
    const team = PRO_TEAMS[code].find(t => t.name === name);
    if (team) return team;
  }
  return null;
}

// ============= GAME INITIALIZATION =============
// 真实篮球青训体系：
// 高中: 16-18岁 (3年: 高一/高二/高三)
// 大学: 18-22岁 (4年: 大一/大二/大三/大四)
// 选秀资格: 年满19岁 + 高中毕业至少1年 (NBA one-and-done规则)
// 国际球员可不读大学直接参加选秀 (需满19岁)
function createPlayer(nationality, position, name, number) {
  const country = COUNTRIES.find(c => c.code === nationality);
  const threshold = country.thresholdVal;
  const posBonus = { PG: 2, SG: 1, SF: 0, PF: -1, C: -2 }[position.code] || 0;

  // 初始OVR: 16岁新秀围绕各国thresholdVal分布 (中国约55, 美国约75)
  // 巅峰期(28-30岁)中位数达70: 通过潜力值控制成长上限
  const player = {
    name: name || '匿名球员',
    number: number || randInt(1, 55),
    nationality: nationality,
    nationalityFlag: country.flag,
    position: position.code,
    positionName: position.name,
    age: 16,
    ovr: randInt(threshold - 10, threshold + 5) + posBonus,
    // 潜力值(天赋): 加权随机分布,不受国籍影响
    // 95-99(5%), 90-94(10%), 80-89(30%), 55-79(55%)
    potential: rollPotential(),
    phase: 'highschool', // highschool -> university -> predraft -> pro -> retired
    hsYear: 0,   // 高中第几年 (0=高一, 1=高二, 2=高三)
    uniYear: 0,  // 大学第几年 (0=大一, 1=大二, 2=大三, 3=大四)
    team: null,
    teamName: '',
    teamLogo: '',
    teamLogoCls: '',
    league: '',
    salary: 0,
    wealth: 0,
    fame: 10,
    relation: 50,
    stats: {
      gp: 0, pts: 0, reb: 0, ast: 0,
      ppg: 0, rpg: 0, apg: 0
    },
    career: [],
    honors: [],
    injuries: [],
    injuryHistory: [],   // 完整伤病历史记录
    currentInjury: null,
    chronicInjuries: 0,  // 慢性伤病计数器 (影响长期OVR)
    yearStats: { gp: 0, pts: 0, reb: 0, ast: 0 },
    recentGames: [],     // 最近3年出场数 (用于续约判定)
    noOfferYears: 0,     // 连续无人报价年数
    draftPick: null,
    draftDeclared: false,
    retired: false,
    retirementReason: '',
    careerTitle: '',     // 结局称号 (基于生涯数据生成)
    yearEvents: [],
    yearAwards: []
  };
  
  // Pick initial high school
  const hs = pickN(HIGH_SCHOOLS[nationality] || HIGH_SCHOOLS.USA, 3);
  player.highSchoolChoices = hs;
  
  log('INIT', `创建球员: ${player.name} #${player.number} | ${country.name} ${position.code} | 初始OVR=${player.ovr} 潜力=${player.potential}`, { nationality, position: position.code, ovr: player.ovr });
  
  return player;
}

function startGame(nationality, position, name, number) {
  clearLog();
  state = createPlayer(nationality, position, name, number);
  gameYear = 2024;
  log('GAME_START', `游戏开始 | ${gameYear}年 | 球员: ${state.name}`);
  render();
}

// ============= GAME LOGIC =============
function advanceYear() {
  const p = state;
  if (p.retired) return;
  
  const prevOvr = p.ovr;
  p.age++;
  gameYear++;
  
  log('YEAR', `--- ${gameYear}年 | ${p.name} ${p.age}岁 | 阶段:${p.phase} | OVR:${p.ovr} ---`);
  
  // 高中年级递增
  if (p.phase === 'highschool') p.hsYear++;
  // 大学年级递增
  if (p.phase === 'university') p.uniYear++;
  
  // OVR变化: 受潜力值约束, 趋向潜力值而非无限增长
  // 30岁前上升, 30岁后下降 (随机性+年龄修正+慢性伤病影响)
  const ageMod = getAgeModifier(p.age);
  const chronicPenalty = p.chronicInjuries > 0 ? -randInt(0, p.chronicInjuries) : 0;
  const potDiff = p.potential - p.ovr;
  let change;
  if (p.age <= 30) {
    if (potDiff > 5) {
      // 远低于潜力: 快速成长 (ageMod全生效)
      change = randInt(1, 3) + ageMod + chronicPenalty;
    } else if (potDiff > 0) {
      // 接近潜力: 缓慢增长 (ageMod减半, 避免超过潜力太多)
      change = randInt(0, 1) + Math.floor(ageMod / 2) + chronicPenalty;
    } else {
      // 达到/超过潜力: 强制波动下降 (忽略ageMod, 防止继续增长)
      change = randInt(-3, 0) + chronicPenalty;
    }
  } else {
    // 30岁后: 下降期
    change = ageMod + chronicPenalty + randInt(-1, 1);
  }
  p.ovr = clamp(p.ovr + change, 40, 99);
  log('OVR', `OVR变化: ${prevOvr} → ${p.ovr} (年龄修正:${ageMod}, 慢性伤病:${chronicPenalty}, 潜力差:${potDiff}, 随机:${change - ageMod - chronicPenalty})`);
  
  // 潜力值: 25岁后逐年下降, 不低于当前OVR
  if (p.age > 25) {
    const potDrop = randInt(0, 2);
    p.potential = Math.max(p.potential - potDrop, p.ovr);
    if (potDrop > 0) log('POTENTIAL', `潜力下降 ${potDrop} → ${p.potential}`);
  }
  
  // === 伤病系统 ===
  // 概率基于年龄和打球强度 (年龄越大概率越高)
  const baseInjuryChance = 0.12;
  const ageInjuryMod = p.age > 30 ? (p.age - 30) * 0.02 : 0;
  const chronicMod = p.chronicInjuries * 0.03;
  const injuryChance = baseInjuryChance + ageInjuryMod + chronicMod;
  
  if (!p.currentInjury && Math.random() < injuryChance) {
    const injury = pick(INJURIES);
    const duration = randInt(injury.recovery[0], injury.recovery[1]);
    p.currentInjury = { ...injury, weeksMissed: duration, yearMissed: duration > 8 };
    
    // 严重伤病: OVR下降 + 慢性伤病计数
    if (injury.severity >= 2) {
      const ovrLoss = randInt(1, 3);
      p.ovr = Math.max(40, p.ovr - ovrLoss);
      p.chronicInjuries++;
      log('INJURY', `⚠️ 严重伤病: ${injury.name} | 严重度:${injury.severity} | 停赛${duration}周 | OVR-${ovrLoss} | 慢性伤病计数:${p.chronicInjuries}`, { injury, duration, ovrLoss });
    } else {
      log('INJURY', `伤病: ${injury.name} | 严重度:${injury.severity} | 停赛${duration}周`, { injury, duration });
    }
    
    p.injuryHistory.push({
      age: p.age, year: gameYear, name: injury.name,
      severity: injury.severity, weeks: duration
    });
    p.yearEvents.push({ type: 'injury', name: injury.name, duration });
  } else if (p.currentInjury) {
    p.currentInjury.weeksMissed--;
    if (p.currentInjury.weeksMissed <= 0) {
      log('RECOVERY', `✅ 伤病恢复: ${p.currentInjury.name}`, { injury: p.currentInjury.name });
      p.currentInjury = null;
      p.yearEvents.push({ type: 'recovery' });
    } else {
      log('INJURY', `伤病恢复中: ${p.currentInjury.name} 剩余${p.currentInjury.weeksMissed}周`);
    }
  }
  
  // === 赛季统计 ===
  // 不同阶段比赛场次不同
  let maxGames = 38;
  if (p.phase === 'highschool') maxGames = 25;
  else if (p.phase === 'university') maxGames = 30;
  else if (p.phase === 'pro') maxGames = p.league === 'NBA' ? 82 : 50;
  
  const gamesPlayed = p.currentInjury 
    ? Math.max(0, maxGames - Math.ceil(p.currentInjury.weeksMissed * maxGames / 40))
    : randInt(Math.floor(maxGames * 0.7), maxGames);
  
  // 位置影响数据分布
  const basePerf = p.ovr / 100;
  const perfMultiplier = rand(0.8, 1.2);
  const posStats = {
    PG: { pts: 22, reb: 4, ast: 8 },
    SG: { pts: 20, reb: 5, ast: 4 },
    SF: { pts: 18, reb: 7, ast: 4 },
    PF: { pts: 16, reb: 9, ast: 3 },
    C:  { pts: 15, reb: 11, ast: 2 }
  }[p.position] || { pts: 18, reb: 7, ast: 4 };
  
  p.yearStats.gp = gamesPlayed;
  p.yearStats.pts = Math.round(gamesPlayed * basePerf * posStats.pts * perfMultiplier);
  p.yearStats.reb = Math.round(gamesPlayed * basePerf * posStats.reb * perfMultiplier);
  p.yearStats.ast = Math.round(gamesPlayed * basePerf * posStats.ast * perfMultiplier);

  // 记录最近3年出场数 (用于续约判定)
  p.recentGames.push(gamesPlayed);
  if (p.recentGames.length > 3) p.recentGames.shift();
  
  // 记录OVR和数据历史 (时间线展示)
  if (!p._ovrLog) p._ovrLog = [];
  p._ovrLog.push({
    age: p.age,
    ovr: p.ovr,
    teamName: p.teamName,
    teamLogo: p.teamLogo,
    teamLogoCls: p.teamLogoCls,
    stats: { ...p.yearStats }
  });
  if (p._ovrLog.length > 10) p._ovrLog.shift();
  
  // 当前career项补充ovr/stats (用于时间线表格)
  if (p.career.length > 0) {
    const last = p.career[p.career.length - 1];
    if (last.age === p.age) {
      last.ovr = p.ovr;
      last.teamName = p.teamName;
      last.teamLogo = p.teamLogo;
      last.stats = { ...p.yearStats };
    }
  }
  
  p.stats.gp += p.yearStats.gp;
  p.stats.pts += p.yearStats.pts;
  p.stats.reb += p.yearStats.reb;
  p.stats.ast += p.yearStats.ast;
  
  p.stats.ppg = (p.stats.pts / Math.max(1, p.stats.gp)).toFixed(1);
  p.stats.rpg = (p.stats.reb / Math.max(1, p.stats.gp)).toFixed(1);
  p.stats.apg = (p.stats.ast / Math.max(1, p.stats.gp)).toFixed(1);
  
  log('STATS', `赛季数据: ${gamesPlayed}场 | ${Math.round(p.yearStats.pts/Math.max(1,gamesPlayed))}分 ${Math.round(p.yearStats.reb/Math.max(1,gamesPlayed))}板 ${Math.round(p.yearStats.ast/Math.max(1,gamesPlayed))}助`);
  
  // 名气和关系变化
  const perfScore = (p.yearStats.pts / Math.max(1, p.yearStats.gp)) * 0.5;
  p.fame = clamp(p.fame + perfScore + randInt(-2, 4), 0, 100);
  p.relation = clamp(p.relation + randInt(-2, 3), 0, 100);
  
  // 薪水和财富
  if (p.phase === 'pro' && p.salary > 0) {
    p.wealth += p.salary;
    if (perfScore > 20) p.wealth += Math.round(p.salary * 0.1);
  }
  
  // 随机事件
  if (Math.random() < 0.4) {
    const evt = pick(RANDOM_EVENTS);
    if (evt.effect.ovr) p.ovr = clamp(p.ovr + evt.effect.ovr, 40, 99);
    if (evt.effect.fame) p.fame = clamp(p.fame + evt.effect.fame, 0, 100);
    if (evt.effect.relation) p.relation = clamp(p.relation + evt.effect.relation, 0, 100);
    if (evt.effect.wealth) p.wealth += evt.effect.wealth * 10000;
    p.yearEvents.push({ ...evt });
    log('EVENT', `${evt.icon} ${evt.title}: ${evt.desc}`);
  }
  
  // 国家队赛事
  checkNationalTeam(p);
  
  // 阶段转换
  checkPhaseTransition(p);
  
  // 退役检查
  checkRetirement(p);

  // 退役时生成结局称号 (基于生涯数据,不随机)
  if (p.retired && !p.careerTitle) {
    p.careerTitle = generateCareerTitle(p);
    log('TITLE', `🏷️ 结局称号: ${p.careerTitle} | 生涯:${p.stats.gp}场 ${p.stats.pts}分 ${p.honors.length}荣誉`);
  }
}

function getAgeModifier(age) {
  // 30岁前上升期, 30岁后下降期 (受潜力值约束, 成长速度适中)
  if (age <= 18) return randInt(1, 3);      // 高中: 成长期
  if (age <= 22) return randInt(1, 3);      // 大学: 继续成长
  if (age <= 25) return randInt(0, 2);      // 职业早期: 稳步提升
  if (age <= 28) return randInt(-1, 1);     // 巅峰期: 微幅波动
  if (age <= 30) return randInt(-1, 1);     // 30岁: 开始波动
  if (age <= 33) return randInt(-2, 0);     // 下降初期
  if (age <= 36) return randInt(-3, -1);    // 下降中期
  if (age <= 40) return randInt(-4, -2);    // 末期
  return randInt(-5, -3);                    // 40+: 急剧下降
}

function checkNationalTeam(p) {
  const country = COUNTRIES.find(c => c.code === p.nationality);
  if (!country) return;

  // 国家队入选门槛: 职业球员 + OVR≥72 (国际中位数70, 国家队需高于中位数)
  // 非职业球员(高中/大学)不入选国家队
  if (p.phase !== 'pro') return;
  if (p.ovr < 72) {
    log('NATIONAL', `未达国家队标准: OVR=${p.ovr} < 72 (需≥72且为职业球员)`);
    return;
  }

  // 各国籍所属洲的赛事映射 (美国不能参加亚洲杯)
  // FIBA洲际组织: FIBA Asia, FIBA Americas, FIBA Europe, FIBA Africa, FIBA Oceania
  const continentalCupMap = {
    'FIBA Asia': 'asiaCup',
    'FIBA Americas': 'ameriCup',
    'FIBA Europe': 'euroBasket',
    'FIBA Africa': 'afroBasket',
    'FIBA Oceania': 'asiaCup'  // 澳洲参加亚洲赛事(现实:FIBA并入亚太大区)
  };

  for (const [key, comp] of Object.entries(COMPETITIONS)) {
    if (!comp.years.includes(gameYear)) continue;

    // 世界大赛(世界杯/奥运会): 所有国家都可参加
    // 洲际比赛: 只有所属洲的国家才能参加
    if (comp.type === 'continental') {
      const allowedKey = continentalCupMap[country.confederation];
      if (key !== allowedKey) {
        log('NATIONAL', `${country.name}不参加${comp.name} (所属:${country.confederation})`);
        continue;
      }
    }

    log('NATIONAL', `${country.name}球员符合${comp.name}参赛条件: OVR=${p.ovr}`);

    // 国家队实力匹配: 基于该国篮球实力阈值 + 球员OVR
    // 美国队夺冠概率最高, 亚洲/非洲队伍较难
    const countryStrength = country.thresholdVal;
    const strengthBonus = (countryStrength - 70) * 2;  // 阈值78的美国: +16; 阈值68的中国: -4
    const playerContribution = (p.ovr - 72) * 2;        // OVR越高贡献越大
    const randomFactor = randInt(-10, 15);
    const totalScore = strengthBonus + playerContribution + randomFactor;

    // 参赛资格: OVR≥72即可入选 (已检查)
    p.yearAwards.push({
      type: 'national',
      competition: comp.name,
      result: '参加了' + comp.name,
      icon: '🌍'
    });
    log('NATIONAL', `入选${comp.name}国家队 | 国家实力修正:${strengthBonus} 球员贡献:${playerContribution} 随机:${randomFactor} → 总分:${totalScore}`);

    // 夺冠判定: 综合国家实力+球员贡献
    // 强队(美国): totalScore常>20, 夺冠概率高
    // 弱队(亚洲): totalScore常<10, 夺冠概率低
    const winThreshold = comp.type === 'world' ? 15 : 10;
    if (totalScore >= winThreshold && (p.ovr >= 78 || Math.random() < 0.4)) {
      let honor;
      if (key === 'olympics') {
        honor = totalScore >= 30 ? '奥运会金牌' : totalScore >= 20 ? '奥运会奖牌' : '参与奥运会';
      } else if (key === 'fibaWorldCup') {
        honor = totalScore >= 30 ? 'FIBA世界杯冠军' : totalScore >= 20 ? 'FIBA世界杯奖牌' : '参与FIBA世界杯';
      } else if (key === 'asiaCup') {
        honor = totalScore >= 20 ? '亚洲杯冠军' : totalScore >= 12 ? '亚洲杯奖牌' : '参与亚洲杯';
      } else if (key === 'euroBasket') {
        honor = totalScore >= 25 ? '欧锦赛冠军' : totalScore >= 15 ? '欧锦赛奖牌' : '参与欧锦赛';
      } else if (key === 'ameriCup') {
        honor = totalScore >= 25 ? '美洲杯冠军' : totalScore >= 15 ? '美洲杯奖牌' : '参与美洲杯';
      } else if (key === 'afroBasket') {
        honor = totalScore >= 18 ? '非洲杯冠军' : totalScore >= 10 ? '非洲杯奖牌' : '参与非洲杯';
      } else {
        honor = '参与国际赛事';
      }

      if (honor.includes('冠军') || honor.includes('金牌')) {
        p.honors.push(honor);
        p.ovr = clamp(p.ovr + 2, 40, 99);
        p.fame = clamp(p.fame + 10, 0, 100);
        p.wealth += 500000;
        p.yearAwards[p.yearAwards.length - 1].result = '赢得' + comp.name + '冠军！';
        p.yearAwards[p.yearAwards.length - 1].icon = '🏆';
        log('NATIONAL', `🏆 ${comp.name}夺冠! 荣誉:${honor} | OVR+2 名气+10 奖金50万`);
      } else if (honor.includes('奖牌')) {
        p.honors.push(honor);
        p.fame = clamp(p.fame + 5, 0, 100);
        p.wealth += 200000;
        p.yearAwards[p.yearAwards.length - 1].result = '获得' + comp.name + '奖牌';
        p.yearAwards[p.yearAwards.length - 1].icon = '🥈';
        log('NATIONAL', `🥈 ${comp.name}获奖牌 | 名气+5 奖金20万`);
      }
    } else {
      log('NATIONAL', `${comp.name}: 未获奖 (总分${totalScore} < 阈值${winThreshold} 或 OVR不足)`);
    }
  }
}

function checkPhaseTransition(p) {
  // 高中: 16-18岁 (3年: 高一/高二/高三), 18岁毕业
  if (p.phase === 'highschool' && p.age >= 18 && p.hsYear >= 2) {
    p.phase = 'university';
    p.uniYear = 0;
    const universityChoices = pickN(UNIVERSITIES[p.nationality] || UNIVERSITIES.USA, 3);
    p.universityChoices = universityChoices;
    p.career.push({
      age: p.age, event: '高中毕业', team: p.teamName, league: p.league
    });
    p.hsGradYear = gameYear;  // 记录高中毕业年份,用于参选资格判定
    log('PHASE', `🎓 高中毕业 → 进入大学阶段 | 高中: ${p.teamName} | 最终OVR: ${p.ovr} | 毕业年份:${p.hsGradYear}`);
  }

  // 大学: 18-22岁 (4年), 大四毕业(22岁)自动参选
  // NBA规则: 年满19岁 + 高中毕业满1年 可参选 (one-and-done)
  // 22岁自动获得参选资格(国际球员规则: 22岁自动参选)
  if (p.phase === 'university' && p.age >= 22 && p.uniYear >= 3 && !p.draftDeclared) {
    log('PHASE', `🎓 大学毕业 → 自动参选 (22岁自动资格) | 大学: ${p.teamName} | OVR: ${p.ovr}`);
    declareDraft();
  }
}

// === NBA选秀参选资格检查 ===
// 规则1: 年满19岁 + 高中毕业至少满1年 (one-and-done)
// 规则2: 国际球员年满22岁自动获得参选资格
// 规则3: 未满19岁但符合特殊规定的可提前申请(需联盟批准)
function checkDraftEligibility(p) {
  const country = COUNTRIES.find(c => c.code === p.nationality);
  const isInternational = p.nationality !== 'USA';

  // 必须在大学阶段才能参选(高中毕业后)
  if (p.phase !== 'university') {
    return { eligible: false, reason: '需先完成高中学业' };
  }

  // 规则1: 年满19岁 + 高中毕业满1年
  const yearsSinceHS = p.hsGradYear ? gameYear - p.hsGradYear : 0;
  if (p.age < 19) {
    return { eligible: false, reason: `未满19岁(${p.age}岁),不符合参选年龄` };
  }
  if (yearsSinceHS < 1) {
    return { eligible: false, reason: `高中毕业未满1年(仅${yearsSinceHS}年)` };
  }

  // 规则2: 国际球员22岁自动资格; 美国球员19岁+高中毕业1年即可
  if (isInternational && p.age >= 22) {
    return { eligible: true, reason: '国际球员22岁自动参选资格', auto: true };
  }

  // 规则1满足: 19岁+高中毕业1年
  return { eligible: true, reason: `年满19岁+高中毕业${yearsSinceHS}年,符合参选条件` };
}

// === 选秀行情评估 ===
// 基于OVR+潜力+年龄综合评估选秀顺位区间
function evaluateDraftStock(p) {
  const ageBonus = p.age <= 19 ? -3 : p.age <= 20 ? -1 : p.age >= 23 ? 2 : 0;
  const potBonus = p.potential >= 88 ? -2 : p.potential >= 82 ? -1 : 0;
  const intlBonus = p.nationality !== 'USA' ? -1 : 0;
  const totalBonus = ageBonus + potBonus + intlBonus;

  let stock, range;
  if (p.ovr >= 88) {
    stock = '状元热门';
    range = `1-5顺位`;
  } else if (p.ovr >= 82) {
    stock = '乐透秀';
    range = `6-14顺位`;
  } else if (p.ovr >= 75) {
    stock = '首轮中后段';
    range = `15-30顺位`;
  } else if (p.ovr >= 68) {
    stock = '次轮秀';
    range = `31-60顺位`;
  } else if (p.ovr >= 62) {
    stock = '可能落选';
    range = `边缘选秀/落选`;
  } else {
    stock = '大概率落选';
    range = `落选→自由球员`;
  }
  return { stock, range, bonus: totalBonus };
}

function checkRetirement(p) {
  // 1. 年龄硬上限: 45岁强制退役
  if (p.age >= 45) {
    p.retired = true;
    p.retirementReason = '年龄太大（45岁），身体无法承受职业联赛强度';
    log('RETIRE', `🏁 强制退役: 年龄达到45岁上限`);
    return;
  }

  // 2. 连续出场不足: 最近3年出场率<30%, 俱乐部不续约
  if (p.phase === 'pro' && p.recentGames.length >= 3) {
    const maxGames = p.league === 'NBA' ? 82 : 50;
    const avgGames = p.recentGames.reduce((a, b) => a + b, 0) / p.recentGames.length;
    const playRate = avgGames / maxGames;
    if (playRate < 0.3) {
      p.retired = true;
      p.retirementReason = `连续3年平均出场率仅${Math.round(playRate * 100)}%，俱乐部拒绝续约`;
      log('RETIRE', `🏁 出场不足退役: 最近3年平均${avgGames.toFixed(0)}场/年, 出场率${Math.round(playRate * 100)}% < 30%`);
      return;
    }
  }

  // 3. 严重伤病导致退役: 赛季报销 + OVR大幅下降
  if (p.phase === 'pro' && p.currentInjury && p.currentInjury.severity >= 3 && p.currentInjury.weeksMissed >= 10) {
    p.retired = true;
    p.retirementReason = `严重伤病（${p.currentInjury.name}）无法恢复，被迫退役`;
    log('RETIRE', `🏁 伤病退役: ${p.currentInjury.name} | 严重度:${p.currentInjury.severity} | 停赛${p.currentInjury.weeksMissed}周`);
    return;
  }

  // 4. 无人报价退役: 没有俱乐部愿意续约 → 强制退役
  if (p.phase === 'pro' && p.age >= 22) {
    const transferChoices = getTransferChoices();
    if (transferChoices.length === 0) {
      p.noOfferYears++;
      if (p.noOfferYears >= 2) {
        p.retired = true;
        p.retirementReason = `连续${p.noOfferYears}年无俱乐部愿意续约，被迫退役`;
        log('RETIRE', `🏁 无队续约退役: 连续${p.noOfferYears}年无转会报价`);
        return;
      }
    } else {
      p.noOfferYears = 0;  // 有报价则重置
    }
  }

  // 5. 自然退役: 40岁以上逐渐增加退役概率 (中位数40岁)
  if (p.phase === 'pro' && p.age >= 40) {
    const retireProb = p.age >= 44 ? 0.8 :
                      p.age >= 42 ? 0.5 :
                      p.age >= 40 ? 0.25 : 0.1;
    if (Math.random() < retireProb) {
      p.retired = true;
      p.retirementReason = `年龄偏大（${p.age}岁），状态下滑选择退役`;
      log('RETIRE', `🏁 自然退役: 年龄${p.age}`);
      return;
    }
  }

  // 6. 慢性伤病过多: 35岁+ 且慢性伤病>=3
  if (p.phase === 'pro' && p.age >= 35 && p.chronicInjuries >= 3) {
    if (Math.random() < 0.4) {
      p.retired = true;
      p.retirementReason = `累积伤病过多（${p.chronicInjuries}次严重伤病），身体不堪重负`;
      log('RETIRE', `🏁 伤病累积退役: 慢性伤病=${p.chronicInjuries}`);
      return;
    }
  }
}

// === 结局称号生成 (基于生涯数据,不随机) ===
function generateCareerTitle(p) {
  const totalGames = p.stats.gp;
  const totalPts = p.stats.pts;
  const ppg = parseFloat(p.stats.ppg) || 0;
  const honors = p.honors;
  const peakOVR = p.potential;  // 潜力值≈巅峰OVR
  const retireOVR = p.ovr;
  const careerYears = p.age - 16;
  const injuries = p.injuryHistory.length;
  const draftPick = p.draftPick;
  const wealth = p.wealth;

  // 检查各类荣誉
  const hasOlympicGold = honors.some(h => h.includes('奥运') && h.includes('金牌'));
  const hasWorldCup = honors.some(h => h.includes('世界杯') && h.includes('冠军'));
  const hasNationalGold = hasOlympicGold || hasWorldCup;
  const honorCount = honors.length;

  // 按优先级判定称号 (高→低)
  // 1. 传奇巨星: 国家队金牌 + 长期生涯 + 高得分
  if (hasNationalGold && careerYears >= 15 && totalPts >= 15000) {
    return '传奇巨星';
  }

  // 2. 名人堂球员: 多项荣誉 + 生涯出色
  if (honorCount >= 4 && totalPts >= 12000 && careerYears >= 12) {
    return '名人堂球员';
  }

  // 3. 冠军功臣: 有重大冠军荣誉
  if (honors.some(h => h.includes('冠军') || h.includes('金牌'))) {
    return '冠军功臣';
  }

  // 4. 全明星球员: 高巅峰 + 高得分
  if (peakOVR >= 85 && ppg >= 18 && totalGames >= 500) {
    return '全明星球员';
  }

  // 5. 铁人: 超长生涯 + 出场多
  if (careerYears >= 18 && totalGames >= 900) {
    return '赛场铁人';
  }

  // 6. 得分机器: 高场均得分
  if (ppg >= 22 && totalPts >= 10000) {
    return '得分机器';
  }

  // 7. 逆袭之星: 落选或低顺位但成功
  if ((!draftPick || (draftPick.overall > 45)) && totalPts >= 8000 && peakOVR >= 80) {
    return '逆袭之星';
  }

  // 8. 悲情天才: 高潜力但伤病多
  if (peakOVR >= 82 && injuries >= 5 && careerYears < 14) {
    return '悲情天才';
  }

  // 9. 角色球员: 中等生涯
  if (totalGames >= 400 && ppg >= 8) {
    return '可靠角色球员';
  }

  // 10. 匆匆过客: 短暂生涯
  if (careerYears <= 6 || totalGames < 200) {
    return '匆匆过客';
  }

  // 11. 平凡生涯
  return '平凡球员';
}

function chooseHighSchool(index) {
  const p = state;
  const hs = p.highSchoolChoices[index];
  p.teamName = hs.name;
  p.teamLogo = hs.logo;
  p.teamLogoCls = hs.cls;
  p.league = COUNTRIES.find(c => c.code === p.nationality).youthName;
  p.team = hs;
  p.career.push({
    age: p.age, event: '加入', team: hs.name, league: p.league
  });
  p.phase = 'highschool';
  p.highSchoolChoices = null;
  render();
}

function chooseUniversity(index) {
  const p = state;
  const uni = p.universityChoices[index];
  p.teamName = uni.name;
  p.teamLogo = uni.logo;
  p.teamLogoCls = uni.cls;
  p.league = uni.conf;
  p.team = uni;
  p.career.push({

  });

}

function chooseDecision(choice) {
  const p = state;
  
  // Apply immediate effects
  if (choice.title && choice.title.includes('刻苦训练')) {
    p.ovr = clamp(p.ovr + randInt(1, 3), 40, 99);
    p.relation = clamp(p.relation + randInt(1, 2), 0, 100);
  } else if (choice.title && choice.title.includes('加练提升')) {
    p.ovr = clamp(p.ovr + randInt(1, 2), 40, 99);
  } else if (choice.title && choice.title.includes('商业活动')) {
    p.wealth += randInt(100000, 500000);
    p.fame = clamp(p.fame + randInt(1, 3), 0, 100);
  } else if (choice.title && choice.title.includes('请求续约')) {
    if (p.ovr >= 70) {
      p.salary = Math.round(p.salary * (1.1 + Math.random() * 0.3));
      p.relation = clamp(p.relation + 3, 0, 100);
    } else {
      p.relation = clamp(p.relation - 2, 0, 100);
    }
  } else if (choice.title && choice.title.includes('留守大学')) {
    // Small boost for staying
    p.ovr = clamp(p.ovr + 1, 40, 99);
  }
  
  if (choice.type === 'stay') {
    advanceYear();
  } else if (choice.type === 'transfer') {
    if (choice.team) {
      p.teamName = choice.team.name;
      p.teamLogo = choice.team.logo;
      p.teamLogoCls = choice.team.cls;
      p.league = choice.team.league || choice.team.conf || (p.phase === 'highschool' ? COUNTRIES.find(c => c.code === p.nationality).youthName : COUNTRIES.find(c => c.code === p.nationality).universityName);
      p.team = choice.team;
      if (choice.salary) p.salary = choice.salary;
      const phaseLabel = p.phase === 'pro' ? '转会' : '转学';
      p.career.push({
        age: p.age, event: phaseLabel, team: choice.team.name, league: p.league
      });
    }
    advanceYear();
  } else if (choice.type === 'draft') {
    declareDraft();
    return;
  } else if (choice.type === 'decline_draft') {
    advanceYear();
  } else if (choice.type === 'g_league') {
    p.phase = 'pro';
    p.salary = Math.round(p.salary * 0.3);
    advanceYear();
  } else if (choice.type === 'retire') {
    p.retired = true;
    p.retirementReason = '主动退役，结束职业生涯';
  }
  
  render();
}

function declareDraft() {
  const p = state;
  const country = COUNTRIES.find(c => c.code === p.nationality);

  // === 参选资格检查 (NBA规则) ===
  const eligibility = checkDraftEligibility(p);
  if (!eligibility.eligible) {
    log('DRAFT', `❌ 参选资格不符: ${eligibility.reason}`);
    return false;
  }

  p.draftDeclared = true;
  p.phase = 'pro';
  p.recentGames = [];  // 进入职业阶段,清空大学时期出场记录(避免误判出场不足)
  p.noOfferYears = 0;

  log('DRAFT', `=== 选秀开始 === 球员:${p.name} | 国籍:${country.name} | 年龄:${p.age} | OVR:${p.ovr} | 潜力:${p.potential} | 资格:${eligibility.reason}`);

  // === 选秀行情评估 ===
  const stock = evaluateDraftStock(p);
  log('DRAFT', `选秀行情: ${stock.stock} (${stock.range}) | 修正:年龄${p.age <= 19 ? '+3年轻' : p.age >= 23 ? '-2大龄' : '0'} 潜力${p.potential >= 88 ? '+2' : '0'} 国际${p.nationality !== 'USA' ? '+1' : '0'}`);

  // === 选秀顺位确定 (乐透抽签+战绩倒序) ===
  // 乐透区(1-14): 抽签概率与战绩负相关,但游戏简化为OVR越高顺位越靠前
  // 非乐透区(15-30): 按战绩倒序,游戏简化为OVR决定
  // 次轮(31-60): OVR+潜力综合
  let draftPosition;
  let drafted = true;

  if (p.ovr >= 88) {
    // 乐透区: 1-14顺位 (抽签机制: OVR越高顺位越靠前,但有随机波动)
    // 简化乐透抽签: 基础顺位 + 随机波动(模拟抽签概率)
    const basePick = clamp(1 + Math.floor((90 - p.ovr) / 2) + stock.bonus, 1, 14);
    const lotteryVariance = randInt(-2, 3);  // 抽签波动(模拟概率权重)
    draftPosition = clamp(basePick + lotteryVariance, 1, 14);
    log('DRAFT', `乐透抽签: 基础顺位${basePick} + 抽签波动${lotteryVariance} → 第${draftPosition}顺位`);
  } else if (p.ovr >= 82) {
    // 乐透末段/首轮初: 6-14顺位
    draftPosition = clamp(randInt(6, 14) + stock.bonus, 1, 14);
    log('DRAFT', `乐透区评估: OVR=${p.ovr} → 第${draftPosition}顺位`);
  } else if (p.ovr >= 75) {
    // 首轮中后段: 15-30顺位 (战绩倒序,简化为OVR决定)
    draftPosition = clamp(randInt(15, 30) + stock.bonus, 15, 30);
    log('DRAFT', `首轮评估: OVR=${p.ovr} → 第${draftPosition}顺位`);
  } else if (p.ovr >= 68) {
    // 次轮: 31-60顺位
    draftPosition = clamp(randInt(31, 60) + stock.bonus, 31, 60);
    log('DRAFT', `次轮评估: OVR=${p.ovr} → 第${draftPosition}顺位`);
  } else {
    // OVR < 68: 高概率落选
    // 落选概率: OVR越低概率越高 (62-67: 50%, <62: 80%)
    const undraftedProb = p.ovr >= 62 ? 0.5 : 0.8;
    if (Math.random() < undraftedProb) {
      drafted = false;
      log('DRAFT', `落选评估: OVR=${p.ovr} < 68, 落选概率${Math.round(undraftedProb*100)}% → 落选`);
    } else {
      draftPosition = randInt(50, 60);
      log('DRAFT', `边缘入选: OVR=${p.ovr} 勉强入选 → 第${draftPosition}顺位`);
    }
  }

  // === 落选处理: 自由球员签约 ===
  if (!drafted) {
    p.draftPick = null;
    log('DRAFT', `❌ NBA落选 → 进入自由球员市场`);

    // 落选秀可签约NBA球队(双向合同/Exhibit 10)或本国联赛
    // OVR≥65: 30%概率获NBA双向合同
    if (p.ovr >= 65 && Math.random() < 0.3) {
      const nbaTeams = PRO_TEAMS.USA;
      const draftTeam = pick(nbaTeams);
      p.salary = randInt(50000, 100000);  // 双向合同底薪
      p.teamName = draftTeam.name;
      p.teamLogo = draftTeam.logo;
      p.teamLogoCls = draftTeam.cls;
      p.league = draftTeam.league;
      p.team = draftTeam;
      p.career.push({
        age: p.age, event: '落选·NBA双向合同', team: draftTeam.name, league: draftTeam.league,
        draftPick: '落选(双向合同)'
      });
      log('DRAFT', `✅ 落选后签约NBA双向合同: ${draftTeam.name} | 起薪${formatSalary(p.salary)}`);
      p.fame = clamp(p.fame + 1, 0, 100);
      return true;
    }

    // OVR≥60: 签约本国联赛
    if (p.ovr >= 60 && p.nationality !== 'USA') {
      const homeTeams = PRO_TEAMS[p.nationality];
      if (homeTeams && homeTeams.length > 0) {
        const draftTeam = pick(homeTeams);
        p.salary = randInt(100000, 300000);
        p.teamName = draftTeam.name;
        p.teamLogo = draftTeam.logo;
        p.teamLogoCls = draftTeam.cls;
        p.league = draftTeam.league;
        p.team = draftTeam;
        p.career.push({
          age: p.age, event: 'NBA落选·签约本国联赛', team: draftTeam.name, league: draftTeam.league,
          draftPick: 'NBA落选'
        });
        log('DRAFT', `✅ 落选后签约${country.proName}: ${draftTeam.name} | 起薪${formatSalary(p.salary)}`);
        p.fame = clamp(p.fame + 2, 0, 100);
        return true;
      }
    }

    // OVR<60或无球队签约: 自由球员
    p.salary = 50000;
    p.teamName = '自由球员';
    p.teamLogo = 'FA';
    p.teamLogoCls = 'logo-steel';
    p.league = '自由联赛';
    p.team = { name: '自由球员', logo: 'FA', cls: 'logo-steel', league: '自由联赛' };
    p.career.push({
      age: p.age, event: '落选自由球员', team: '自由球员', league: '自由联赛',
      draftPick: '落选'
    });
    log('DRAFT', `❌ 落选→自由球员 | OVR=${p.ovr} | 起薪${formatSalary(p.salary)}`);
    return true;
  }

  // === 被选中处理 ===
  const round = draftPosition <= 30 ? 1 : 2;
  const pickNum = draftPosition <= 30 ? draftPosition : draftPosition - 30;

  // 选秀球队: NBA选秀所有球队都来自NBA联盟(30支)
  const proTeams = PRO_TEAMS.USA;
  const draftTeam = pick(proTeams);

  p.draftPick = {
    round: round,
    pick: pickNum,
    overall: draftPosition,
    team: draftTeam.name,
    logo: draftTeam.logo,
    cls: draftTeam.cls,
    league: draftTeam.league
  };

  // 薪资: 基于真实NBA新秀合同(2023版新秀工资表)
  // 乐透秀(前14): ~800万-1200万/4年 → 约200-300万/年
  // 首轮其他(15-30): ~200-400万/4年 → 约50-100万/年
  // 次轮: ~100-200万/年 (非保障)
  let baseSalary;
  if (draftPosition <= 5) {
    baseSalary = randInt(2500000, 4000000);  // 前5顺位(状元~底薪)
  } else if (draftPosition <= 14) {
    baseSalary = randInt(1500000, 2500000);  // 乐透区
  } else if (draftPosition <= 30) {
    baseSalary = randInt(800000, 1500000);   // 首轮其他
  } else {
    baseSalary = randInt(100000, 500000);     // 次轮(非保障)
  }
  p.salary = baseSalary;
  p.teamName = draftTeam.name;
  p.teamLogo = draftTeam.logo;
  p.teamLogoCls = draftTeam.cls;
  p.league = draftTeam.league;
  p.team = draftTeam;

  const pickLabel = draftPosition <= 14 ? '乐透秀' : round === 1 ? '首轮秀' : '次轮秀';
  p.career.push({
    age: p.age, event: pickLabel,
    team: draftTeam.name, league: draftTeam.league,
    draftPick: `第${round}轮第${pickNum}顺位 (总第${draftPosition}顺位)`
  });

  log('DRAFT', `📋 选秀结果: ${pickLabel} | 第${round}轮第${pickNum}顺位(总第${draftPosition}) | 球队:${draftTeam.name}(${draftTeam.league}) | 起薪:${formatSalary(p.salary)} | OVR:${p.ovr}`, { round, pickNum, overall: draftPosition, team: draftTeam.name, salary: p.salary });

  // 选秀后名气提升
  const fameBoost = draftPosition <= 14 ? 15 : draftPosition <= 30 ? 8 : 3;
  p.fame = clamp(p.fame + fameBoost, 0, 100);
  return true;
}

function getTransferChoices() {
  const p = state;
  const country = COUNTRIES.find(c => c.code === p.nationality);

  // 球队按实力排序: 数组顺序即实力排序(前面的强)
  // 程序化赋予strength: 球队池中越靠前实力越强
  const getTeamStrength = (team, pool) => {
    const idx = pool.indexOf(team);
    return Math.round(90 - (idx / pool.length) * 30);  // 90→60分布
  };

  // 球员所在联赛的球队池 (转会通常在同联赛内)
  // NBA球员在NBA内转会, 其他联赛同理
  let teamPool;
  if (p.league === 'NBA' || p.nationality === 'USA' || p.nationality === 'CAN') {
    teamPool = PRO_TEAMS.USA;
  } else {
    teamPool = PRO_TEAMS[p.nationality] || PRO_TEAMS.USA;
  }

  // 排除当前球队 (避免"转会到原队"的bug)
  const availableTeams = teamPool.filter(t => t.name !== p.teamName);
  if (availableTeams.length === 0) return [];

  // 按实力排序(强队在前)
  const sortedTeams = availableTeams.map(t => ({
    team: t,
    strength: getTeamStrength(t, teamPool)
  })).sort((a, b) => b.strength - a.strength);

  // OVR越高, 强队越愿意接收; OVR低, 只能去弱队
  // 匹配逻辑: 球员OVR决定能去的球队实力上限
  const playerTier = p.ovr >= 85 ? 0 : p.ovr >= 78 ? 1 : p.ovr >= 72 ? 2 : 3;
  const numOffers = p.ovr >= 85 ? 3 : p.ovr >= 75 ? 2 : 1;

  // 高OVR: 从强队中选; 低OVR: 从中下游球队选
  const startIdx = playerTier === 0 ? 0 :
                   playerTier === 1 ? Math.floor(sortedTeams.length * 0.2) :
                   playerTier === 2 ? Math.floor(sortedTeams.length * 0.4) :
                   Math.floor(sortedTeams.length * 0.6);
  const endIdx = Math.min(startIdx + numOffers + 2, sortedTeams.length);
  const candidates = sortedTeams.slice(startIdx, endIdx);

  // 随机选2-3支, 按实力排序展示
  const offers = pickN(candidates, Math.min(2, candidates.length));

  return offers.map(({team, strength}) => {
    // 薪资基于球队实力和球员OVR
    const salaryMultiplier = 0.6 + (strength / 100) * 0.8;  // 强队薪资高
    const newSalary = Math.round(p.salary * salaryMultiplier * (0.9 + Math.random() * 0.3));
    return {
      type: 'transfer',
      title: `加盟 ${team.name}`,
      desc: `${team.league} · 实力${strength} · 年薪 ${formatSalary(newSalary)}`,
      team: team,
      salary: newSalary,
      tag: '转会'
    };
  });
}

function getYearChoices() {
  const p = state;
  const choices = [];
  
  if (p.phase === 'highschool') {
    // High school choices
    choices.push({
      type: 'stay',
      title: `留在 ${p.teamName}`,
      desc: '继续为当前球队效力',
      tag: '稳定'
    });
    
    // Transfer to another high school
    const hsChoices = pickN(HIGH_SCHOOLS[p.nationality] || HIGH_SCHOOLS.USA, 2);
    hsChoices.forEach(hs => {
      choices.push({
        type: 'transfer',
        title: `转学至 ${hs.name}`,
        desc: COUNTRIES.find(c => c.code === p.nationality).youthName,
        team: hs,
        salary: 0,
        tag: '转学'
      });
    });
    
    // Work hard option
    choices.push({
      type: 'stay',
      title: '刻苦训练',
      desc: '每天加练，提升能力值',
      tag: '训练'
    });
    
    return choices.slice(0, 3);
  }
  
  if (p.phase === 'university') {
    // University choices
    choices.push({
      type: 'stay',
      title: `留在 ${p.teamName}`,
      desc: '继续为当前学校效力',
      tag: '稳定'
    });
    
    // Transfer to another university
    const uniChoices = pickN(UNIVERSITIES[p.nationality] || UNIVERSITIES.USA, 2);
    uniChoices.forEach(uni => {
      choices.push({
        type: 'transfer',
        title: `转学至 ${uni.name}`,
        desc: uni.conf,
        team: uni,
        salary: 0,
        tag: '转学'
      });
    });
    
    // Draft option: NBA参选资格检查
    // 规则: 年满19岁 + 高中毕业满1年 (one-and-done)
    // 国际球员22岁自动获得参选资格
    const eligibility = checkDraftEligibility(p);
    if (eligibility.eligible && !p.draftDeclared) {
      const stock = evaluateDraftStock(p);
      choices.push({
        type: 'draft',
        title: '参加选秀',
        desc: `选秀行情：${stock.stock} (${stock.range})`,
        tag: '选秀'
      });
      choices.push({
        type: 'decline_draft',
        title: '留守大学',
        desc: '再打一年大学联赛，提升选秀排名',
        tag: '观望'
      });
    } else if (!eligibility.eligible && p.phase === 'university' && p.age < 22) {
      // 未达参选资格,显示原因
      choices.push({
        type: 'stay',
        title: '加练提升',
        desc: `${eligibility.reason}`,
        tag: '训练'
      });
    } else {
      choices.push({
        type: 'stay',
        title: '加练提升',
        desc: '每天额外训练，提升能力值',
        tag: '训练'
      });
    }
    
    return choices.slice(0, 4);
  }
  
  // Professional phase
  choices.push({
    type: 'stay',
    title: `留在 ${p.teamName}`,
    desc: `继续效力当前球队`,
    tag: '稳定'
  });
  
  // Transfer offers
  const transferChoices = getTransferChoices();
  choices.push(...transferChoices.slice(0, 2));
  
  // Negotiate
  choices.push({
    type: 'stay',
    title: '请求续约',
    desc: '与球队商谈新合同',
    tag: '合同'
  });
  
  // Retirement option
  if (p.age >= 40 || (p.phase === 'pro' && p.ovr < 60)) {
    choices.push({
      type: 'retire',
      title: '考虑退役',
      desc: '结束职业生涯，开始新篇章',
      tag: '退役'
    });
  }
  
  return choices.slice(0, 4);
}

function formatSalary(amount) {
  if (amount >= 10000000) return (amount / 10000000).toFixed(1) + '千万';
  if (amount >= 10000) return (amount / 10000).toFixed(0) + '万';
  return amount + '元';
}

function render() {
  const app = document.getElementById('app');
  
  if (!state) {
    app.innerHTML = renderSetupScreen();
    bindSetupEvents();
    return;
  }
  
  if (state.retired) {
    app.innerHTML = renderRetirementScreen();
    bindRetirementEvents();
    return;
  }
  
  // Check for phase-specific choices
  if (state.phase === 'highschool' && state.highSchoolChoices) {
    app.innerHTML = renderHighSchoolChoice();
    bindHighSchoolEvents();
    return;
  }
  
  if (state.phase === 'university' && state.universityChoices) {
    app.innerHTML = renderUniversityChoice();
    bindUniversityEvents();
    return;
  }
  
  // Main game screen
  app.innerHTML = renderGameScreen();
  bindGameEvents();
}

function bindSetupEvents() {
  let selectedCountry = null;
  let selectedPosition = 'SF';
  let selectedNumber = 23;
  
  // 步骤切换
  function goStep(n) {
    document.querySelectorAll('.setup-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.step-dots .dot').forEach((d, idx) => {
      d.classList.toggle('active', idx + 1 <= n);
    });
    const target = document.getElementById('step-mode');
    if (n === 1) document.getElementById('step-mode').classList.add('active');
    if (n === 2) document.getElementById('step-country').classList.add('active');
    if (n === 3) document.getElementById('step-pos-num').classList.add('active');
  }
  document.querySelectorAll('.step-next').forEach(b => {
    b.addEventListener('click', () => {
      if (b.disabled) return;
      goStep(parseInt(b.dataset.next));
    });
  });
  document.querySelectorAll('.step-back').forEach(b => {
    b.addEventListener('click', () => goStep(parseInt(b.dataset.prev)));
  });
  
  // 模式选择
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
    });
  });
  
  // 国籍选择 (国旗前)
  document.querySelectorAll('.step-country-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.step-country-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedCountry = btn.dataset.code;
      const next = document.querySelector('#step-country .step-next');
      if (next) next.disabled = false;
    });
  });
  
  // 球场位置选择
  document.querySelectorAll('.pos-dot').forEach(g => {
    g.addEventListener('click', () => {
      const pos = g.getAttribute('data-pos');
      selectedPosition = pos;
      document.querySelectorAll('.pos-dot').forEach(dot => {
        dot.classList.toggle('active', dot.getAttribute('data-pos') === pos);
      });
    });
  });
  // 默认高亮SF
  const defaultDot = document.querySelector('.pos-dot[data-pos="SF"]');
  if (defaultDot) defaultDot.classList.add('active');
  
  // 号码选择: 输入框
  const numInput = document.getElementById('playerNumber');
  function syncNumber(val) {
    let n = parseInt(val);
    if (isNaN(n)) n = 23;
    n = Math.min(99, Math.max(0, n));
    selectedNumber = n;
    const disp = n === 0 ? '00' : String(n);
    numInput.value = n === 0 ? 0 : n;
    const jn = document.getElementById('jerseyNumber');
    if (jn) jn.textContent = disp;
  }
  numInput.addEventListener('input', e => syncNumber(e.target.value));
  document.getElementById('numMinus').addEventListener('click', () => syncNumber(selectedNumber - 1));
  document.getElementById('numPlus').addEventListener('click', () => syncNumber(selectedNumber + 1));
  document.querySelectorAll('.num-chip').forEach(chip => {
    chip.addEventListener('click', () => syncNumber(parseInt(chip.dataset.num)));
  });
  syncNumber(23);
  
  // 姓名实时同步到球衣
  const nameInput = document.getElementById('playerName');
  nameInput.addEventListener('input', () => {
    const jname = document.getElementById('jerseyName');
    if (jname) jname.textContent = (nameInput.value || 'ANONYMOUS').slice(0, 10).toUpperCase();
  });
  
  // 开始按钮
  document.getElementById('startBtn').addEventListener('click', () => {
    if (!selectedCountry) {
      showToast('请先选择国籍');
      goStep(2);
      return;
    }
    const position = POSITIONS.find(p => p.code === selectedPosition);
    const name = document.getElementById('playerName').value || '匿名球员';
    const number = parseInt(document.getElementById('playerNumber').value) || 23;
    startGame(selectedCountry, position, name, number);
  });
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

  const recentCareer = p.career.slice(-7).reverse();
  const ovrHistory = (p._ovrLog || []).slice(-7).reverse();
  const timelineTable = `
    <div class="career-timeline">
      <div class="ct-header-row">

      </div>
      ${recentCareer.map((c, i) => {
        const teamDisp = c.teamName || c.team || '-';
        const ovrDisp = (ovrHistory[i] && ovrHistory[i].ovr) ? ovrHistory[i].ovr : '-';
        const statS = (ovrHistory[i] && ovrHistory[i].stats) ? ovrHistory[i].stats : (c.stats ? c.stats : null);
        const gp = statS ? statS.gp : (i === 0 ? p.yearStats.gp : '-');
        const pts = statS ? statS.pts : (i === 0 ? p.yearStats.pts : '-');
        const ast = statS ? statS.ast : (i === 0 ? p.yearStats.ast : '-');
        return `
        <div class="ct-row">
          <span class="ct-age ct-age-ovr">${c.age}</span>
          <span class="ct-team">
            ${c.teamLogo ? `<span class="team-logo ct-team-logo">${getTeamBadge(c.teamLogo, 'logo-navy', teamDisp)}</span>` : ''}

            ${c.event && c.event !== '加入' ? `<span class="ct-tag">${c.event}</span>` : ''}

          <span class="ct-ovr ct-ovr-val">${ovrDisp}</span>
          <span class="ct-col">${gp}</span>
          <span class="ct-col">${pts}</span>
          <span class="ct-col">${ast}</span>
        </div>`;
      }).join('')}
      <!-- 补上当前赛季 (若 career 未满) -->
      ${recentCareer.length < 3 ? `
        <div class="ct-row">
          <span class="ct-age ct-age-ovr">${p.age}</span>

          <span class="ct-col">${p.yearStats.gp}</span>
          <span class="ct-col">${p.yearStats.pts}</span>
          <span class="ct-col">${p.yearStats.ast}</span>
        </div>
      ` : ''}
    </div>
  `;
  
  // 横幅/状态条 (荣誉+伤病) 放在时间线上方
  const bannerHtml = [
    p.yearAwards.length > 0 ? `
      <div class="competition-banner">
        <span class="cb-icon">🏆</span>
        <span class="cb-text">${p.yearAwards.map(a => a.result).join(' · ')}</span>
      </div>` : '',
    p.currentInjury ? `
      <div class="competition-banner" style="background:linear-gradient(135deg, rgba(239,68,68,0.15), rgba(239,68,68,0.05));border-color:rgba(239,68,68,0.3);">

      </div>` : '',
    p.draftPick ? `
      <div class="draft-card">
        <div class="timeline-title">选秀记录</div>
        <div class="draft-pick">
          <div class="team-logo">${getTeamBadge(p.draftPick.logo, p.draftPick.cls, p.draftPick.team)}</div>
          <div class="pick-num">R${p.draftPick.round}·P${p.draftPick.pick}</div>

  ].filter(Boolean).join('');
  
  // 事件卡片放在最底部 (足一把样式)
  const evTitle = p.currentEventTitle || (p.phase + '阶段 · ' + gameYear + '赛季');
  const evIcon = p.currentEventIcon || '🔔';
  const eventCard = `
    <div class="event-card event-card-bottom">
      <div class="ev-head">
        <span class="ev-icon">${evIcon}</span>
        <span class="ev-title">${evTitle}</span>
      </div>
      <div class="ev-desc">${p.currentEventDesc || getPhaseDesc(p) + '  ·  年薪 ' + formatSalary(p.salary) + (p.phase === 'pro' ? '  ·  身价 ' + formatSalary(p.salary * 5) : '')}</div>

                <div class="choice-desc">${c.desc}</div>
              </div>

      </div>
    </div>
  `;
  
  return `
    <div class="screen active screen-flow">
      ${renderPlayerCard()}
      <div class="middle-section">
        ${bannerHtml}
        ${timelineTable}
      </div>
      ${eventCard}
    </div>
  `;
}
