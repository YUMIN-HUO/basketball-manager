<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>篮球生涯模拟器 · 从青训到传奇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0e17;
    --card: #131a2b;
    --card2: #1a2238;
    --accent: #ff6b35;
    --accent2: #f7931e;
    --gold: #ffd700;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --text: #e8eaf0;
    --text-dim: #8b92a8;
    --border: #2a3350;
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    background: linear-gradient(180deg, #0a0e17 0%, #0f1424 50%, #0a0e17 100%);
  }
  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 12px;
    min-height: 100vh;
  }
  .screen { display: none; animation: fadeIn .3s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 5px rgba(255,107,53,0.3); }
    50% { box-shadow: 0 0 20px rgba(255,107,53,0.6); }
  }
  h1, h2, h3 { font-weight: 700; }
  .btn {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text);
    font-size: 15px; font-weight: 500;
    cursor: pointer; transition: all .2s ease;
    text-align: left; font-family: inherit;
  }
  .btn:hover { background: var(--card2); border-color: var(--accent); }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: white;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: 0.4; pointer-events: none; }
  .btn-sm { padding: 10px 12px; font-size: 13px; }
  .btn-block { margin-bottom: 8px; }

  .header {
    text-align: center; padding: 20px 0 16px;
  }
  .header h1 {
    font-size: 24px;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p { color: var(--text-dim); font-size: 13px; margin-top: 6px; }

  .setup-section { margin-bottom: 20px; }
  .setup-title {
    font-size: 18px; font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .setup-title .step {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent); color: white; font-size: 12px;
  }
  .country-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  }
  .country-btn {
    flex-direction: column; align-items: flex-start; gap: 4px;
  }
  .country-btn .flag { font-size: 24px; }
  .country-btn .c-name { font-weight: 600; }
  .country-btn .c-info { font-size: 12px; color: var(--text-dim); }
  .country-btn.selected {
    background: linear-gradient(135deg, rgba(255,107,53,0.2), rgba(247,147,30,0.1));
    border-color: var(--accent);
  }

  .input-row { display: flex; gap: 10px; }
  .input-row input {
    flex: 1; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 15px;
    font-family: inherit; outline: none;
  }
  .input-row input:focus { border-color: var(--accent); }
  .pos-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pos-btn {
    flex-direction: column; align-items: center; gap: 4px;
    padding: 12px 6px; font-size: 12px;
  }
  .pos-btn .pos-code { font-weight: 700; font-size: 16px; color: var(--accent); }

  /* Player Card */
  .player-card {
    background: linear-gradient(145deg, var(--card), var(--card2));
    border-radius: 16px; padding: 16px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .player-main {
    display: flex; align-items: center; gap: 14px;
  }
  .ovr-badge {
    width: 68px; height: 68px; border-radius: 14px;
    background: linear-gradient(145deg, #1a1f35, #0f1424);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border: 2px solid var(--accent);
    flex-shrink: 0;
  }
  .ovr-badge .ovr {
    font-size: 28px; font-weight: 800; color: var(--accent);
    line-height: 1;
  }
  .ovr-badge .ovr-label {
    font-size: 10px; color: var(--text-dim); margin-top: 2px;
  }
  .player-info { flex: 1; min-width: 0; }
  .player-name {
    font-size: 18px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .player-meta {
    font-size: 13px; color: var(--text-dim); margin-top: 3px;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .player-meta span { display: inline-flex; align-items: center; gap: 3px; }
  .team-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px; padding: 8px 10px;
    background: rgba(255,255,255,0.03); border-radius: 8px;
  }
  .team-logo {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: white;
    flex-shrink: 0;
  }
  .team-name { font-size: 14px; font-weight: 600; }
  .team-league { font-size: 11px; color: var(--text-dim); }

  /* Stat bars */
  .stat-bars { display: flex; gap: 12px; margin-top: 12px; }
  .stat-bar { flex: 1; }
  .stat-bar .bar-label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--text-dim); margin-bottom: 4px;
  }
  .bar-fill {
    height: 6px; background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden;
  }
  .bar-inner {
    height: 100%; border-radius: 3px;
    transition: width .5s ease;
  }
  .bar-green { background: linear-gradient(90deg, #22c55e, #16a34a); }
  .bar-blue { background: linear-gradient(90deg, #3b82f6, #2563eb); }
  .bar-gold { background: linear-gradient(90deg, #f59e0b, #d97706); }

  /* Stats grid */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; margin-top: 12px;
  }
  .stat-item {
    text-align: center; padding: 8px 4px;
    background: rgba(255,255,255,0.03); border-radius: 8px;
  }
  .stat-value { font-size: 16px; font-weight: 700; color: var(--text); }
  .stat-label { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  /* Decision card */
  .event-card {
    background: linear-gradient(145deg, var(--card), var(--card2));
    border-radius: 16px; padding: 16px;
    border: 1px solid var(--border); margin-bottom: 16px;
  }
  .event-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; margin-bottom: 12px;
  }
  .event-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .event-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 14px; }
  .choice-btn {
    flex-direction: column; align-items: flex-start; gap: 6px;
    margin-bottom: 10px;
  }
  .choice-btn .choice-title { font-weight: 600; font-size: 14px; }
  .choice-btn .choice-desc { font-size: 12px; color: var(--text-dim); }
  .choice-btn .choice-tag {
    display: inline-block; padding: 2px 6px; border-radius: 4px;
    background: rgba(255,107,53,0.15); color: var(--accent);
    font-size: 11px; font-weight: 600;
  }

  /* Timeline */
  .timeline-title {
    font-size: 14px; font-weight: 600; margin-bottom: 8px;
    color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .timeline-item {
    display: flex; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-age {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent); color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .timeline-content { flex: 1; min-width: 0; }
  .timeline-main { font-size: 13px; font-weight: 500; }
  .timeline-sub { font-size: 11px; color: var(--text-dim); }

  /* Honor */
  .honor-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .honor-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 6px;
    background: rgba(255,215,0,0.1); color: var(--gold);
    font-size: 11px; font-weight: 600;
    border: 1px solid rgba(255,215,0,0.2);
  }

  /* Retirement */
  .retire-card {
    background: linear-gradient(145deg, var(--card), var(--card2));
    border-radius: 16px; padding: 20px;
    border: 1px solid var(--border); text-align: center;
  }
  .retire-title {
    font-size: 24px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .retire-sub { color: var(--text-dim); font-size: 14px; margin-bottom: 20px; }
  .career-stats {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-bottom: 16px;
  }
  .career-stat {
    padding: 12px; background: rgba(255,255,255,0.03);
    border-radius: 10px;
  }
  .career-stat .val {
    font-size: 22px; font-weight: 800;
    color: var(--accent);
  }
  .career-stat .lbl {
    font-size: 11px; color: var(--text-dim); margin-top: 2px;
  }

  .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mode-btn {
    flex-direction: column; align-items: center; gap: 4px;
    padding: 14px 8px; text-align: center;
  }
  .mode-btn .mode-name { font-weight: 700; font-size: 13px; }
  .mode-btn .mode-desc { font-size: 10px; color: var(--text-dim); }
  .mode-btn.active {
    background: linear-gradient(135deg, rgba(255,107,53,0.3), rgba(247,147,30,0.2));
    border-color: var(--accent);
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px;
    z-index: 100; display: flex; align-items: center; gap: 8px;
    animation: slideUp .3s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .hidden { display: none !important; }

  /* Scroll hint */
  .scroll-hint {
    text-align: center; color: var(--text-dim);
    font-size: 11px; padding: 8px 0;
  }

  /* Logo colors */
  .logo-athletic { background: linear-gradient(135deg, #c8102e, #7a0a1c); }
  .logo-classic { background: linear-gradient(135deg, #1e3a5f, #0f1f33); }
  .logo-modern { background: linear-gradient(135deg, #3d2b1f, #1a0f08); }
  .logo-bright { background: linear-gradient(135deg, #ff6b35, #c44a1a); }
  .logo-navy { background: linear-gradient(135deg, #0f1b3d, #1a2d5a); }
  .logo-red { background: linear-gradient(135deg, #d32f2f, #8b0000); }
  .logo-green { background: linear-gradient(135deg, #2e7d32, #1b5e20); }
  .logo-blue { background: linear-gradient(135deg, #1565c0, #0d47a1); }
  .logo-purple { background: linear-gradient(135deg, #6a1b9a, #4a148c); }
  .logo-orange { background: linear-gradient(135deg, #e65100, #bf360c); }
  .logo-gold { background: linear-gradient(135deg, #b8860b, #8b6508); }
  .logo-teal { background: linear-gradient(135deg, #00695c, #004d40); }
  .logo-crimson { background: linear-gradient(135deg, #8b0000, #5a0000); }
  .logo-royal { background: linear-gradient(135deg, #1a237e, #0d1442); }
  .logo-sunset { background: linear-gradient(135deg, #ff6f00, #c43e00); }
  .logo-forest { background: linear-gradient(135deg, #1b5e20, #0d3311); }
  .logo-steel { background: linear-gradient(135deg, #455a64, #263238); }
  .logo-maroon { background: linear-gradient(135deg, #5d1a1a, #3d0f0f); }
  .logo-emerald { background: linear-gradient(135deg, #00695c, #004d40); }
  .logo-silver { background: linear-gradient(135deg, #546e7a, #37474f); }

  .competition-banner {
    padding: 10px 14px; border-radius: 10px;
    background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,107,53,0.1));
    border: 1px solid rgba(255,215,0,0.3);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .competition-banner .cb-icon { font-size: 20px; }
  .competition-banner .cb-text { font-size: 13px; font-weight: 600; }

  .draft-card {
    background: linear-gradient(145deg, var(--card), var(--card2));
    border-radius: 16px; padding: 16px;
    border: 1px solid var(--border);
  }
  .draft-pick {
    display: flex; align-items: center; gap: 12px;
    padding: 10px; background: rgba(255,255,255,0.03);
    border-radius: 10px; margin-bottom: 8px;
  }
  .draft-pick .pick-num {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--accent); color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px;
  }
  .draft-pick .pick-team { flex: 1; min-width: 0; }
  .draft-pick .pick-team-name { font-weight: 600; font-size: 14px; }
  .draft-pick .pick-team-league { font-size: 11px; color: var(--text-dim); }

  .injured-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(239,68,68,0.15); color: var(--red);
    font-size: 11px; font-weight: 600;
  }

  .legend-chip {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 7px; border-radius: 5px;
    background: rgba(255,215,0,0.15);
    border: 1px solid rgba(255,215,0,0.3);
    font-size: 11px; font-weight: 600; color: var(--gold);
  }

  @media (max-width: 380px) {
    .country-grid { grid-template-columns: 1fr; }
    .pos-grid { grid-template-columns: repeat(3, 1fr); }
    .mode-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

  national: ['FIBA世界杯冠军', 'FIBA世界杯MVP', '奥运会金牌', '奥运会MVP', '洲际锦标赛冠军', '洲际锦标赛MVP', '亚洲杯冠军', '亚洲杯MVP']
};

// Competition schedule (year-based)
const COMPETITIONS = {
  // FIBA World Cup: every 4 years, offset from Olympics
  fibaWorldCup: { name: 'FIBA篮球世界杯', years: [2023, 2027, 2031, 2035], frequency: 4, type: 'world' },
  // Olympics: every 4 years
  olympics: { name: '奥运会篮球比赛', years: [2024, 2028, 2032, 2036], frequency: 4, type: 'world' },
  // FIBA Asia Cup: every 4 years
  asiaCup: { name: 'FIBA亚洲杯', years: [2025, 2029, 2033], frequency: 4, type: 'continental' },
  // EuroBasket: every 2 years
  euroBasket: { name: 'FIBA欧锦赛', years: [2025, 2027, 2029], frequency: 2, type: 'continental' },
  // AfroBasket: every 2 years
  afroBasket: { name: 'FIBA非洲杯', years: [2025, 2027, 2029], frequency: 2, type: 'continental' },
  // AmeriCup: every 4 years
  ameriCup: { name: 'FIBA美洲杯', years: [2024, 2028, 2032], frequency: 4, type: 'continental' }
};

// ============= LOGGING SYSTEM =============
const LOG_ENABLED = true;
const gameLog = [];

function log(category, message, data) {
  if (!LOG_ENABLED) return;
  const entry = {
    time: new Date().toISOString(),
    year: gameYear,
    category: category,
    message: message,
    data: data ? JSON.parse(JSON.stringify(data)) : null
  };
  gameLog.push(entry);
  console.log(`[${category}] ${gameYear}年 | ${message}`, data || '');
}

function getLog() { return gameLog; }
function clearLog() { gameLog.length = 0; }
function printLog() {
  gameLog.forEach(e => console.log(`[${e.category}] ${e.year}年 | ${e.message}`));
}

// ============= GAME STATE =============
let state = null;
let gameYear = 2024; // Starting year
let mode = 'standard'; // 'immerse' | 'standard' | 'speed'

function getDecisionsPerYear() {
  return mode === 'immerse' ? 1 : mode === 'standard' ? 2 : 3;
}

// ============= UTILITY =============
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pickN(arr, n) {
  const copy = [...arr]; const result = [];
  for (let i = 0; i < n && copy.length; i++) {
    const idx = Math.floor(Math.random() * copy.length);
    result.push(copy.splice(idx, 1)[0]);
  }
  return result;
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// ============= GAME INITIALIZATION =============
// 真实篮球青训体系：
// 高中: 16-18岁 (3年: 高一/高二/高三)
// 大学: 18-22岁 (4年: 大一/大二/大三/大四)
// 选秀资格: 年满19岁 + 高中毕业至少1年 (NBA one-and-done规则)
// 国际球员可不读大学直接参加选秀 (需满19岁)
function createPlayer(nationality, position, name, number) {
  const country = COUNTRIES.find(c => c.code === nationality);
  const threshold = country.thresholdVal;
  // 位置修正: 后卫线略高, 内线略低 (反映选秀市场偏好)
  const posBonus = { PG: 1, SG: 1, SF: 0, PF: -1, C: -1 }[position.code] || 0;

  // 国际中位数70: 各国围绕自身阈值±4分布, 16岁新秀偏低
  // 成长曲线会在30岁前追平到潜力值附近
  const player = {
    name: name || '匿名球员',
    number: number || randInt(1, 55),
    nationality: nationality,
    nationalityFlag: country.flag,
    position: position.code,
    positionName: position.name,
    age: 16,
    ovr: clamp(randInt(threshold - 5, threshold + 4) + posBonus, 45, 85),
    potential: clamp(randInt(threshold + 3, threshold + 18), 70, 95),
    phase: 'highschool', // highschool -> university -> predraft -> pro -> retired
    hsYear: 0,   // 高中第几年 (0=高一, 1=高二, 2=高三)
    uniYear: 0,  // 大学第几年 (0=大一, 1=大二, 2=大三, 3=大四)
    team: null,
    teamName: '',
    teamLogo: '',
    teamLogoCls: '',
    league: '',
    salary: 0,
    wealth: 0,
    fame: 10,
    relation: 50,
    stats: {
      gp: 0, pts: 0, reb: 0, ast: 0,
      ppg: 0, rpg: 0, apg: 0
    },
    career: [],
    honors: [],
    injuries: [],
    injuryHistory: [],   // 完整伤病历史记录
    currentInjury: null,
    chronicInjuries: 0,  // 慢性伤病计数器 (影响长期OVR)
    yearStats: { gp: 0, pts: 0, reb: 0, ast: 0 },
    draftPick: null,
    draftDeclared: false,
    retired: false,
    retirementReason: '',
    yearEvents: [],
    yearAwards: []
  };
  
  // Pick initial high school
  const hs = pickN(HIGH_SCHOOLS[nationality] || HIGH_SCHOOLS.USA, 3);
  player.highSchoolChoices = hs;
  
  log('INIT', `创建球员: ${player.name} #${player.number} | ${country.name} ${position.code} | 初始OVR=${player.ovr} 潜力=${player.potential}`, { nationality, position: position.code, ovr: player.ovr });
  
  return player;
}

function startGame(nationality, position, name, number) {
  clearLog();
  state = createPlayer(nationality, position, name, number);
  gameYear = 2024;
  log('GAME_START', `游戏开始 | ${gameYear}年 | 球员: ${state.name}`);
  render();
}

// ============= GAME LOGIC =============
function advanceYear() {
  const p = state;
  if (p.retired) return;
  
  const prevOvr = p.ovr;
  p.age++;
  gameYear++;
  
  log('YEAR', `--- ${gameYear}年 | ${p.name} ${p.age}岁 | 阶段:${p.phase} | OVR:${p.ovr} ---`);
  
  // 高中年级递增
  if (p.phase === 'highschool') p.hsYear++;
  // 大学年级递增
  if (p.phase === 'university') p.uniYear++;
  
  // OVR变化: 30岁前上升, 30岁后下降 (随机性+年龄修正+慢性伤病影响)
  const ageMod = getAgeModifier(p.age);
  const chronicPenalty = p.chronicInjuries > 0 ? -randInt(0, p.chronicInjuries) : 0;
  const change = randInt(-2, 3) + ageMod + chronicPenalty;
  p.ovr = clamp(p.ovr + change, 40, 99);
  log('OVR', `OVR变化: ${prevOvr} → ${p.ovr} (年龄修正:${ageMod}, 慢性伤病:${chronicPenalty}, 随机:${change - ageMod - chronicPenalty})`);
  
  // 潜力值: 25岁后逐年下降, 不低于当前OVR
  if (p.age > 25) {
    const potDrop = randInt(0, 2);
    p.potential = Math.max(p.potential - potDrop, p.ovr);
    if (potDrop > 0) log('POTENTIAL', `潜力下降 ${potDrop} → ${p.potential}`);
  }
  
  // === 伤病系统 ===
  // 概率基于年龄和打球强度 (年龄越大概率越高)
  const baseInjuryChance = 0.12;
  const ageInjuryMod = p.age > 30 ? (p.age - 30) * 0.02 : 0;
  const chronicMod = p.chronicInjuries * 0.03;
  const injuryChance = baseInjuryChance + ageInjuryMod + chronicMod;
  
  if (!p.currentInjury && Math.random() < injuryChance) {
    const injury = pick(INJURIES);
    const duration = randInt(injury.recovery[0], injury.recovery[1]);
    p.currentInjury = { ...injury, weeksMissed: duration, yearMissed: duration > 8 };
    
    // 严重伤病: OVR下降 + 慢性伤病计数
    if (injury.severity >= 2) {
      const ovrLoss = randInt(1, 3);
      p.ovr = Math.max(40, p.ovr - ovrLoss);
      p.chronicInjuries++;
      log('INJURY', `⚠️ 严重伤病: ${injury.name} | 严重度:${injury.severity} | 停赛${duration}周 | OVR-${ovrLoss} | 慢性伤病计数:${p.chronicInjuries}`, { injury, duration, ovrLoss });
    } else {
      log('INJURY', `伤病: ${injury.name} | 严重度:${injury.severity} | 停赛${duration}周`, { injury, duration });
    }
    
    p.injuryHistory.push({
      age: p.age, year: gameYear, name: injury.name,
      severity: injury.severity, weeks: duration
    });
    p.yearEvents.push({ type: 'injury', name: injury.name, duration });
  } else if (p.currentInjury) {
    p.currentInjury.weeksMissed--;
    if (p.currentInjury.weeksMissed <= 0) {
      log('RECOVERY', `✅ 伤病恢复: ${p.currentInjury.name}`, { injury: p.currentInjury.name });
      p.currentInjury = null;
      p.yearEvents.push({ type: 'recovery' });
    } else {
      log('INJURY', `伤病恢复中: ${p.currentInjury.name} 剩余${p.currentInjury.weeksMissed}周`);
    }
  }
  
  // === 赛季统计 ===
  // 不同阶段比赛场次不同
  let maxGames = 38;
  if (p.phase === 'highschool') maxGames = 25;
  else if (p.phase === 'university') maxGames = 30;
  else if (p.phase === 'pro') maxGames = p.league === 'NBA' ? 82 : 50;
  
  const gamesPlayed = p.currentInjury 
    ? Math.max(0, maxGames - Math.ceil(p.currentInjury.weeksMissed * maxGames / 40))
    : randInt(Math.floor(maxGames * 0.7), maxGames);
  
  // 位置影响数据分布
  const basePerf = p.ovr / 100;
  const perfMultiplier = rand(0.8, 1.2);
  const posStats = {
    PG: { pts: 22, reb: 4, ast: 8 },
    SG: { pts: 20, reb: 5, ast: 4 },
    SF: { pts: 18, reb: 7, ast: 4 },
    PF: { pts: 16, reb: 9, ast: 3 },
    C:  { pts: 15, reb: 11, ast: 2 }
  }[p.position] || { pts: 18, reb: 7, ast: 4 };
  
  p.yearStats.gp = gamesPlayed;
  p.yearStats.pts = Math.round(gamesPlayed * basePerf * posStats.pts * perfMultiplier);
  p.yearStats.reb = Math.round(gamesPlayed * basePerf * posStats.reb * perfMultiplier);
  p.yearStats.ast = Math.round(gamesPlayed * basePerf * posStats.ast * perfMultiplier);
  
  p.stats.gp += p.yearStats.gp;
  p.stats.pts += p.yearStats.pts;
  p.stats.reb += p.yearStats.reb;
  p.stats.ast += p.yearStats.ast;
  
  p.stats.ppg = (p.stats.pts / Math.max(1, p.stats.gp)).toFixed(1);
  p.stats.rpg = (p.stats.reb / Math.max(1, p.stats.gp)).toFixed(1);
  p.stats.apg = (p.stats.ast / Math.max(1, p.stats.gp)).toFixed(1);
  
  log('STATS', `赛季数据: ${gamesPlayed}场 | ${Math.round(p.yearStats.pts/Math.max(1,gamesPlayed))}分 ${Math.round(p.yearStats.reb/Math.max(1,gamesPlayed))}板 ${Math.round(p.yearStats.ast/Math.max(1,gamesPlayed))}助`);
  
  // 名气和关系变化
  const perfScore = (p.yearStats.pts / Math.max(1, p.yearStats.gp)) * 0.5;
  p.fame = clamp(p.fame + perfScore + randInt(-2, 4), 0, 100);
  p.relation = clamp(p.relation + randInt(-2, 3), 0, 100);
  
  // 薪水和财富
  if (p.phase === 'pro' && p.salary > 0) {
    p.wealth += p.salary;
    if (perfScore > 20) p.wealth += Math.round(p.salary * 0.1);
  }
  
  // 随机事件
  if (Math.random() < 0.4) {
    const evt = pick(RANDOM_EVENTS);
    if (evt.effect.ovr) p.ovr = clamp(p.ovr + evt.effect.ovr, 40, 99);
    if (evt.effect.fame) p.fame = clamp(p.fame + evt.effect.fame, 0, 100);
    if (evt.effect.relation) p.relation = clamp(p.relation + evt.effect.relation, 0, 100);
    if (evt.effect.wealth) p.wealth += evt.effect.wealth * 10000;
    p.yearEvents.push({ ...evt });
    log('EVENT', `${evt.icon} ${evt.title}: ${evt.desc}`);
  }
  
  // 国家队赛事
  checkNationalTeam(p);
  
  // 阶段转换
  checkPhaseTransition(p);
  
  // 退役检查
  checkRetirement(p);
}

function getAgeModifier(age) {
  // 30岁前上升期, 30岁后下降期 (有随机波动)
  if (age <= 18) return randInt(2, 4);      // 高中: 快速成长
  if (age <= 22) return randInt(2, 4);      // 大学: 继续成长
  if (age <= 25) return randInt(1, 3);      // 职业早期: 稳步提升
  if (age <= 28) return randInt(0, 2);      // 巅峰期: 缓慢提升
  if (age <= 30) return randInt(-1, 1);     // 30岁: 开始波动
  if (age <= 33) return randInt(-2, 0);     // 下降初期
  if (age <= 36) return randInt(-3, -1);    // 下降中期
  if (age <= 40) return randInt(-4, -2);    // 末期
  return randInt(-5, -3);                    // 40+: 急剧下降
}

function checkNationalTeam(p) {
  const country = COUNTRIES.find(c => c.code === p.nationality);
  if (!country) return;

  // 国家队入选门槛: 职业球员 + OVR≥72 (国际中位数70, 国家队需高于中位数)
  // 非职业球员(高中/大学)不入选国家队
  if (p.phase !== 'pro') return;
  if (p.ovr < 72) {
    log('NATIONAL', `未达国家队标准: OVR=${p.ovr} < 72 (需≥72且为职业球员)`);
    return;
  }

  // 各国籍所属洲的赛事映射 (美国不能参加亚洲杯)
  // FIBA洲际组织: FIBA Asia, FIBA Americas, FIBA Europe, FIBA Africa, FIBA Oceania
  const continentalCupMap = {
    'FIBA Asia': 'asiaCup',
    'FIBA Americas': 'ameriCup',
    'FIBA Europe': 'euroBasket',
    'FIBA Africa': 'afroBasket',
    'FIBA Oceania': 'asiaCup'  // 澳洲参加亚洲赛事(现实:FIBA并入亚太大区)
  };

  for (const [key, comp] of Object.entries(COMPETITIONS)) {
    if (!comp.years.includes(gameYear)) continue;

    // 世界大赛(世界杯/奥运会): 所有国家都可参加
    // 洲际比赛: 只有所属洲的国家才能参加
    if (comp.type === 'continental') {
      const allowedKey = continentalCupMap[country.confederation];
      if (key !== allowedKey) {
        log('NATIONAL', `${country.name}不参加${comp.name} (所属:${country.confederation})`);
        continue;
      }
    }

    log('NATIONAL', `${country.name}球员符合${comp.name}参赛条件: OVR=${p.ovr}`);

    // 国家队实力匹配: 基于该国篮球实力阈值 + 球员OVR
    // 美国队夺冠概率最高, 亚洲/非洲队伍较难
    const countryStrength = country.thresholdVal;
    const strengthBonus = (countryStrength - 70) * 2;  // 阈值78的美国: +16; 阈值68的中国: -4
    const playerContribution = (p.ovr - 72) * 2;        // OVR越高贡献越大
    const randomFactor = randInt(-10, 15);
    const totalScore = strengthBonus + playerContribution + randomFactor;

    // 参赛资格: OVR≥72即可入选 (已检查)
    p.yearAwards.push({
      type: 'national',
      competition: comp.name,
      result: '参加了' + comp.name,
      icon: '🌍'
    });
    log('NATIONAL', `入选${comp.name}国家队 | 国家实力修正:${strengthBonus} 球员贡献:${playerContribution} 随机:${randomFactor} → 总分:${totalScore}`);

    // 夺冠判定: 综合国家实力+球员贡献
    // 强队(美国): totalScore常>20, 夺冠概率高
    // 弱队(亚洲): totalScore常<10, 夺冠概率低
    const winThreshold = comp.type === 'world' ? 15 : 10;
    if (totalScore >= winThreshold && (p.ovr >= 78 || Math.random() < 0.4)) {
      let honor;
      if (key === 'olympics') {
        honor = totalScore >= 30 ? '奥运会金牌' : totalScore >= 20 ? '奥运会奖牌' : '参与奥运会';
      } else if (key === 'fibaWorldCup') {
        honor = totalScore >= 30 ? 'FIBA世界杯冠军' : totalScore >= 20 ? 'FIBA世界杯奖牌' : '参与FIBA世界杯';
      } else if (key === 'asiaCup') {
        honor = totalScore >= 20 ? '亚洲杯冠军' : totalScore >= 12 ? '亚洲杯奖牌' : '参与亚洲杯';
      } else if (key === 'euroBasket') {
        honor = totalScore >= 25 ? '欧锦赛冠军' : totalScore >= 15 ? '欧锦赛奖牌' : '参与欧锦赛';
      } else if (key === 'ameriCup') {
        honor = totalScore >= 25 ? '美洲杯冠军' : totalScore >= 15 ? '美洲杯奖牌' : '参与美洲杯';
      } else if (key === 'afroBasket') {
        honor = totalScore >= 18 ? '非洲杯冠军' : totalScore >= 10 ? '非洲杯奖牌' : '参与非洲杯';
      } else {
        honor = '参与国际赛事';
      }

      if (honor.includes('冠军') || honor.includes('金牌')) {
        p.honors.push(honor);
        p.ovr = clamp(p.ovr + 2, 40, 99);
        p.fame = clamp(p.fame + 10, 0, 100);
        p.wealth += 500000;
        p.yearAwards[p.yearAwards.length - 1].result = '赢得' + comp.name + '冠军！';
        p.yearAwards[p.yearAwards.length - 1].icon = '🏆';
        log('NATIONAL', `🏆 ${comp.name}夺冠! 荣誉:${honor} | OVR+2 名气+10 奖金50万`);
      } else if (honor.includes('奖牌')) {
        p.honors.push(honor);
        p.fame = clamp(p.fame + 5, 0, 100);
        p.wealth += 200000;
        p.yearAwards[p.yearAwards.length - 1].result = '获得' + comp.name + '奖牌';
        p.yearAwards[p.yearAwards.length - 1].icon = '🥈';
        log('NATIONAL', `🥈 ${comp.name}获奖牌 | 名气+5 奖金20万`);
      }
    } else {
      log('NATIONAL', `${comp.name}: 未获奖 (总分${totalScore} < 阈值${winThreshold} 或 OVR不足)`);
    }
  }
}

function checkPhaseTransition(p) {
  // 高中: 16-18岁 (3年: 高一/高二/高三), 18岁毕业
  if (p.phase === 'highschool' && p.age >= 18 && p.hsYear >= 2) {
    p.phase = 'university';
    p.uniYear = 0;
    const universityChoices = pickN(UNIVERSITIES[p.nationality] || UNIVERSITIES.USA, 3);
    p.universityChoices = universityChoices;
    p.career.push({
      age: p.age, event: '高中毕业', team: p.teamName, league: p.league
    });
    log('PHASE', `🎓 高中毕业 → 进入大学阶段 | 高中: ${p.teamName} | 最终OVR: ${p.ovr}`);
  }
  
  // 大学: 18-22岁 (4年), 大四毕业(22岁)必须参加选秀
  // NBA规则: 年满19岁可参加选秀 (one-and-done)
  if (p.phase === 'university' && p.age >= 22 && p.uniYear >= 3 && !p.draftDeclared) {
    log('PHASE', `🎓 大学毕业 → 自动参加选秀 | 大学: ${p.teamName} | OVR: ${p.ovr}`);
    declareDraft();
  }
}

function checkRetirement(p) {
  // 1. 年龄硬上限: 42岁强制退役
  if (p.age >= 42) {
    p.retired = true;
    p.retirementReason = '年龄太大（42岁），身体无法承受职业联赛强度';
    log('RETIRE', `🏁 强制退役: 年龄达到42岁上限`);
    return;
  }
  
  // 2. 职业阶段 OVR < 60: 无球队签约
  if (p.phase === 'pro' && p.ovr < 60) {
    p.retired = true;
    p.retirementReason = `能力值过低（OVR ${p.ovr}），没有球队愿意续约`;
    log('RETIRE', `🏁 被迫退役: OVR=${p.ovr} < 60, 无球队签约`);
    return;
  }
  
  // 3. 严重伤病导致退役: 赛季报销 + OVR大幅下降
  if (p.phase === 'pro' && p.currentInjury && p.currentInjury.severity >= 3 && p.currentInjury.weeksMissed >= 10) {
    p.retired = true;
    p.retirementReason = `严重伤病（${p.currentInjury.name}）无法恢复，被迫退役`;
    log('RETIRE', `🏁 伤病退役: ${p.currentInjury.name} | 严重度:${p.currentInjury.severity} | 停赛${p.currentInjury.weeksMissed}周`);
    return;
  }
  
  // 4. 38岁以上 + OVR < 70: 高概率退役
  if (p.phase === 'pro' && p.age >= 38 && p.ovr < 70) {
    if (Math.random() < 0.5) {
      p.retired = true;
      p.retirementReason = `年龄偏大（${p.age}岁）且状态下滑（OVR ${p.ovr}），选择挂靴`;
      log('RETIRE', `🏁 自然退役: 年龄${p.age} + OVR${p.ovr}`);
      return;
    }
  }
  
  // 5. 慢性伤病过多: 35岁+ 且慢性伤病>=3
  if (p.phase === 'pro' && p.age >= 35 && p.chronicInjuries >= 3) {
    if (Math.random() < 0.4) {
      p.retired = true;
      p.retirementReason = `累积伤病过多（${p.chronicInjuries}次严重伤病），身体不堪重负`;
      log('RETIRE', `🏁 伤病累积退役: 慢性伤病=${p.chronicInjuries}`);
      return;
    }
  }
}

function chooseDecision(choice) {
  const p = state;
  
  // Apply immediate effects
  if (choice.title && choice.title.includes('刻苦训练')) {
    p.ovr = clamp(p.ovr + randInt(1, 3), 40, 99);
    p.relation = clamp(p.relation + randInt(1, 2), 0, 100);
  } else if (choice.title && choice.title.includes('加练提升')) {
    p.ovr = clamp(p.ovr + randInt(1, 2), 40, 99);
  } else if (choice.title && choice.title.includes('商业活动')) {
    p.wealth += randInt(100000, 500000);
    p.fame = clamp(p.fame + randInt(1, 3), 0, 100);
  } else if (choice.title && choice.title.includes('请求续约')) {
    if (p.ovr >= 70) {
      p.salary = Math.round(p.salary * (1.1 + Math.random() * 0.3));
      p.relation = clamp(p.relation + 3, 0, 100);
    } else {
      p.relation = clamp(p.relation - 2, 0, 100);
    }
  } else if (choice.title && choice.title.includes('留守大学')) {
    // Small boost for staying
    p.ovr = clamp(p.ovr + 1, 40, 99);
  }
  
  if (choice.type === 'stay') {
    advanceYear();
  } else if (choice.type === 'transfer') {
    if (choice.team) {
      p.teamName = choice.team.name;
      p.teamLogo = choice.team.logo;
      p.teamLogoCls = choice.team.cls;
      p.league = choice.team.league || choice.team.conf || (p.phase === 'highschool' ? COUNTRIES.find(c => c.code === p.nationality).youthName : COUNTRIES.find(c => c.code === p.nationality).universityName);
      p.team = choice.team;
      if (choice.salary) p.salary = choice.salary;
      const phaseLabel = p.phase === 'highschool' ? '转学' : '转学';
      p.career.push({
        age: p.age, event: phaseLabel, team: choice.team.name, league: p.league
      });
    }
    advanceYear();
  } else if (choice.type === 'draft') {
    declareDraft();
    return;
  } else if (choice.type === 'decline_draft') {
    advanceYear();
  } else if (choice.type === 'g_league') {
    p.phase = 'pro';
    p.salary = Math.round(p.salary * 0.3);
    advanceYear();
  } else if (choice.type === 'retire') {
    p.retired = true;
    p.retirementReason = '主动退役，结束职业生涯';
  }
  
  render();
}

function declareDraft() {
  const p = state;
  p.draftDeclared = true;
  p.phase = 'pro';
  const country = COUNTRIES.find(c => c.code === p.nationality);

  // === 真实选秀逻辑 (NBA规则) ===
  // NBA选秀条件:
  // 1. 年满19岁 + 高中毕业至少1年 (one-and-done规则)
  // 2. 国际球员: 年满22岁自动获得参选资格, <22需主动声明
  // 选秀: 2轮共60顺位 (30队×2轮)
  // 所有国籍球员均可参加NBA选秀, 但低OVR球员可能落选后进入本国联赛

  log('DRAFT', `=== 选秀开始 === 球员:${p.name} | 国籍:${country.name} | 年龄:${p.age} | OVR:${p.ovr} | 潜力:${p.potential}`);

  // 选秀顺位基于: OVR + 潜力 + 年龄(年轻球员有更高上限)
  const ageBonus = p.age <= 19 ? -3 : p.age <= 20 ? -1 : p.age >= 23 ? 2 : 0;
  const potBonus = p.potential >= 90 ? -2 : p.potential >= 85 ? -1 : 0;
  // 国际球员bonus: 非美国球员有"国际神秘感"加成,球探更感兴趣
  const intlBonus = p.nationality !== 'USA' ? -1 : 0;

  let draftPosition;
  let drafted = true;
  let draftLeague = 'NBA';  // 默认参选NBA

  if (p.ovr >= 85) {
    // 乐透秀: 1-14顺位
    draftPosition = clamp(randInt(1, 14) - Math.floor((p.ovr - 85) / 2) + ageBonus + potBonus + intlBonus, 1, 14);
    log('DRAFT', `NBA选秀评估: OVR=${p.ovr} 潜力=${p.potential} 年龄=${p.age} | 年龄修正:${ageBonus} 潜力修正:${potBonus} 国际加成:${intlBonus} → 预估顺位:${draftPosition}`);
  } else if (p.ovr >= 75) {
    // 首轮中后段: 15-30顺位
    draftPosition = clamp(randInt(15, 30) + ageBonus + intlBonus, 15, 30);
    log('DRAFT', `NBA选秀评估: OVR=${p.ovr} 潜力=${p.potential} 年龄=${p.age} | 年龄修正:${ageBonus} 国际加成:${intlBonus} → 预估顺位:${draftPosition}`);
  } else if (p.ovr >= 65) {
    // 次轮: 31-60顺位
    draftPosition = clamp(randInt(31, 60) + ageBonus, 31, 60);
    log('DRAFT', `NBA选秀评估: OVR=${p.ovr} 年龄=${p.age} | 年龄修正:${ageBonus} → 预估顺位:${draftPosition}`);
  } else {
    // OVR < 65: 70%概率NBA落选 (低OVR难获NBA青睐)
    if (Math.random() < 0.7) {
      drafted = false;
      log('DRAFT', `NBA选秀评估: OVR=${p.ovr} < 65, NBA落选概率高`);
    } else {
      draftPosition = randInt(45, 60);
      log('DRAFT', `NBA选秀评估: OVR=${p.ovr} 勉强入选 → 预估顺位:${draftPosition}`);
    }
  }
  
  if (!drafted) {
    // NBA落选 → 检查是否能进入本国联赛
    // OVR≥60: 可签约本国联赛球队(CBA/EuroLeague等)
    // OVR<60: 成为自由球员
    p.draftPick = null;

    if (p.ovr >= 60 && p.nationality !== 'USA') {
      // 签约本国联赛
      const homeTeams = PRO_TEAMS[p.nationality];
      if (homeTeams && homeTeams.length > 0) {
        const draftTeam = pick(homeTeams);
        p.salary = randInt(100000, 300000);  // 本国联赛底薪
        p.teamName = draftTeam.name;
        p.teamLogo = draftTeam.logo;
        p.teamLogoCls = draftTeam.cls;
        p.league = draftTeam.league;
        p.team = draftTeam;
        p.career.push({
          age: p.age, event: 'NBA落选·签约本国联赛', team: draftTeam.name, league: draftTeam.league,
          draftPick: 'NBA落选'
        });
        log('DRAFT', `❌ NBA落选 → ✅ 签约${country.proName}: ${draftTeam.name} | OVR=${p.ovr} | 起薪${formatSalary(p.salary)}`);
        p.fame = clamp(p.fame + 2, 0, 100);
        return;
      }
    }

    // OVR<60或美国球员落选: 自由球员
    p.salary = 50000;
    p.teamName = '自由球员';
    p.teamLogo = 'FA';
    p.teamLogoCls = 'logo-steel';
    p.league = '自由联赛';
    p.team = { name: '自由球员', logo: 'FA', cls: 'logo-steel', league: '自由联赛' };
    p.career.push({
      age: p.age, event: '落选自由球员', team: '自由球员', league: '自由联赛',
      draftPick: '落选'
    });
    log('DRAFT', `❌ 选秀落选 | OVR=${p.ovr} | 成为自由球员 | 起薪${formatSalary(p.salary)}`);
    return;
  }

  const round = draftPosition <= 30 ? 1 : 2;
  const pickNum = draftPosition <= 30 ? draftPosition : draftPosition - 30;

  // 选秀球队: NBA选秀所有球队都来自NBA联盟(30支)
  // 国际球员被NBA选中后去NBA打球, 不限于本国联赛
  const proTeams = PRO_TEAMS.USA;  // NBA球队池
  const draftTeam = pick(proTeams);
  
  p.draftPick = {
    round: round,
    pick: pickNum,
    overall: draftPosition,
    team: draftTeam.name,
    logo: draftTeam.logo,
    cls: draftTeam.cls,
    league: draftTeam.league
  };
  
  // 薪资: 基于真实NBA新秀合同
  // 乐透秀(前14): ~800万-1200万美元/4年 → 约200-300万/年
  // 首轮其他(15-30): ~200-400万/4年 → 约50-100万/年
  // 次轮: ~100-200万/年 (非保障)
  let baseSalary;
  if (draftPosition <= 5) {
    baseSalary = randInt(2500000, 4000000);  // 前5顺位
  } else if (draftPosition <= 14) {
    baseSalary = randInt(1500000, 2500000);  // 乐透区
  } else if (draftPosition <= 30) {
    baseSalary = randInt(800000, 1500000);   // 首轮其他
  } else {
    baseSalary = randInt(100000, 500000);     // 次轮
  }
  p.salary = baseSalary;
  p.teamName = draftTeam.name;
  p.teamLogo = draftTeam.logo;
  p.teamLogoCls = draftTeam.cls;
  p.league = draftTeam.league;
  p.team = draftTeam;
  
  const pickLabel = draftPosition <= 14 ? '乐透秀' : round === 1 ? '首轮秀' : '次轮秀';
  p.career.push({
    age: p.age, event: pickLabel,
    team: draftTeam.name, league: draftTeam.league,
    draftPick: `第${round}轮第${pickNum}顺位 (总第${draftPosition}顺位)`
  });
  
  log('DRAFT', `📋 选秀结果: ${pickLabel} | 第${round}轮第${pickNum}顺位(总第${draftPosition}) | 球队:${draftTeam.name}(${draftTeam.league}) | 起薪:${formatSalary(p.salary)} | OVR:${p.ovr}`, { round, pickNum, overall: draftPosition, team: draftTeam.name, salary: p.salary });
  
  // 选秀后名气提升
  const fameBoost = draftPosition <= 14 ? 15 : draftPosition <= 30 ? 8 : 3;
  p.fame = clamp(p.fame + fameBoost, 0, 100);
}

function getTransferChoices() {
  const p = state;
  const country = COUNTRIES.find(c => c.code === p.nationality);

  // 球队按实力排序: 数组顺序即实力排序(前面的强)
  // 程序化赋予strength: 球队池中越靠前实力越强
  const getTeamStrength = (team, pool) => {
    const idx = pool.indexOf(team);
    return Math.round(90 - (idx / pool.length) * 30);  // 90→60分布
  };

  // 球员所在联赛的球队池 (转会通常在同联赛内)
  // NBA球员在NBA内转会, 其他联赛同理
  let teamPool;
  if (p.league === 'NBA' || p.nationality === 'USA' || p.nationality === 'CAN') {
    teamPool = PRO_TEAMS.USA;
  } else {
    teamPool = PRO_TEAMS[p.nationality] || PRO_TEAMS.USA;
  }

  // 排除当前球队 (避免"转会到原队"的bug)
  const availableTeams = teamPool.filter(t => t.name !== p.teamName);
  if (availableTeams.length === 0) return [];

  // 按实力排序(强队在前)
  const sortedTeams = availableTeams.map(t => ({
    team: t,
    strength: getTeamStrength(t, teamPool)
  })).sort((a, b) => b.strength - a.strength);

  // OVR越高, 强队越愿意接收; OVR低, 只能去弱队
  // 匹配逻辑: 球员OVR决定能去的球队实力上限
  const playerTier = p.ovr >= 85 ? 0 : p.ovr >= 78 ? 1 : p.ovr >= 72 ? 2 : 3;
  const numOffers = p.ovr >= 85 ? 3 : p.ovr >= 75 ? 2 : 1;

  // 高OVR: 从强队中选; 低OVR: 从中下游球队选
  const startIdx = playerTier === 0 ? 0 :
                   playerTier === 1 ? Math.floor(sortedTeams.length * 0.2) :
                   playerTier === 2 ? Math.floor(sortedTeams.length * 0.4) :
                   Math.floor(sortedTeams.length * 0.6);
  const endIdx = Math.min(startIdx + numOffers + 2, sortedTeams.length);
  const candidates = sortedTeams.slice(startIdx, endIdx);

  // 随机选2-3支, 按实力排序展示
  const offers = pickN(candidates, Math.min(2, candidates.length));

  return offers.map(({team, strength}) => {
    // 薪资基于球队实力和球员OVR
    const salaryMultiplier = 0.6 + (strength / 100) * 0.8;  // 强队薪资高
    const newSalary = Math.round(p.salary * salaryMultiplier * (0.9 + Math.random() * 0.3));
    return {
      type: 'transfer',
      title: `加盟 ${team.name}`,
      desc: `${team.league} · 实力${strength} · 年薪 ${formatSalary(newSalary)}`,
      team: team,
      salary: newSalary,
      tag: '转会'
    };
  });
}

function getYearChoices() {
  const p = state;
  const choices = [];
  
  if (p.phase === 'highschool') {
    // High school choices
    choices.push({
      type: 'stay',
      title: `留在 ${p.teamName}`,
      desc: '继续为当前球队效力',
      tag: '稳定'
    });
    
    // Transfer to another high school
    const hsChoices = pickN(HIGH_SCHOOLS[p.nationality] || HIGH_SCHOOLS.USA, 2);
    hsChoices.forEach(hs => {
      choices.push({
        type: 'transfer',
        title: `转学至 ${hs.name}`,
        desc: COUNTRIES.find(c => c.code === p.nationality).youthName,
        team: hs,
        salary: 0,
        tag: '转学'
      });
    });
    
    // Work hard option
    choices.push({
      type: 'stay',
      title: '刻苦训练',
      desc: '每天加练，提升能力值',
      tag: '训练'
    });
    
    return choices.slice(0, 3);
  }
  
  if (p.phase === 'university') {
    // University choices
    choices.push({
      type: 'stay',
      title: `留在 ${p.teamName}`,
      desc: '继续为当前学校效力',
      tag: '稳定'
    });
    
    // Transfer to another university
    const uniChoices = pickN(UNIVERSITIES[p.nationality] || UNIVERSITIES.USA, 2);
    uniChoices.forEach(uni => {
      choices.push({
        type: 'transfer',
        title: `转学至 ${uni.name}`,
        desc: uni.conf,
        team: uni,
        salary: 0,
        tag: '转学'
      });
    });
    
    // Draft option: NBA one-and-done rule (19岁+高中毕业1年即可参选)
    // 高中18岁毕业 → 19岁(大二)起可声明参选
    if (p.age >= 19 && !p.draftDeclared) {
      const draftStock = p.ovr >= 90 ? '状元热门' : p.ovr >= 85 ? '乐透秀' : p.ovr >= 75 ? '首轮秀' : p.ovr >= 65 ? '次轮秀' : '可能落选';
      choices.push({
        type: 'draft',
        title: '参加选秀',
        desc: `当前选秀行情：${draftStock}`,
        tag: '选秀'
      });
      choices.push({
        type: 'decline_draft',
        title: '留守大学',
        desc: '再打一年大学联赛，提升选秀排名',
        tag: '观望'
      });
    } else {
      choices.push({
        type: 'stay',
        title: '加练提升',
        desc: '每天额外训练，提升能力值',
        tag: '训练'
      });
    }
    
    return choices.slice(0, 4);
  }
  
  // Professional phase
  choices.push({
    type: 'stay',
    title: `留在 ${p.teamName}`,
    desc: `继续效力当前球队`,
    tag: '稳定'
  });
  
  // Transfer offers
  const transferChoices = getTransferChoices();
  choices.push(...transferChoices.slice(0, 2));
  
  // Negotiate
  choices.push({
    type: 'stay',
    title: '请求续约',
    desc: '与球队商谈新合同',
    tag: '合同'
  });
  
  // Retirement option
  if (p.age >= 38 || (p.phase === 'pro' && p.ovr < 65)) {
    choices.push({
      type: 'retire',
      title: '考虑退役',
      desc: '结束职业生涯，开始新篇章',
      tag: '退役'
    });
  }
  
  return choices.slice(0, 4);
}

function formatSalary(amount) {
  if (amount >= 10000000) return (amount / 10000000).toFixed(1) + '千万';
  if (amount >= 10000) return (amount / 10000).toFixed(0) + '万';
  return amount + '元';
}

function render() {
  const app = document.getElementById('app');
  
  if (!state) {
    app.innerHTML = renderSetupScreen();
    bindSetupEvents();
    return;
  }
  
  if (state.retired) {
    app.innerHTML = renderRetirementScreen();
    bindRetirementEvents();
    return;
  }
  
  // Check for phase-specific choices
  if (state.phase === 'highschool' && state.highSchoolChoices) {
    app.innerHTML = renderHighSchoolChoice();
    bindHighSchoolEvents();
    return;
  }
  
  if (state.phase === 'university' && state.universityChoices) {
    app.innerHTML = renderUniversityChoice();
    bindUniversityEvents();
    return;
  }
  
  // Main game screen
  app.innerHTML = renderGameScreen();
  bindGameEvents();
}

  document.querySelectorAll('.country-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.country-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedCountry = btn.dataset.code;
    });
  });

// ============= 模拟测试数据系统 =============
// 通过 console.runSimTests() 调用，测试不同场景下的游戏逻辑
// 测试覆盖: 青训体系、选秀逻辑、伤病系统、退役判定

const SIM_TESTS = {
  results: [],
  pass: 0,
  fail: 0,

  reset() { this.results = []; this.pass = 0; this.fail = 0; },

  assert(cond, name, detail) {
    if (cond) { this.pass++; this.results.push(`  ✅ ${name}`); }
    else { this.fail++; this.results.push(`  ❌ ${name} ${detail||''}`); }
  },

  // ===== 测试1: 高中联赛青训体系 (16→18岁, 3年) =====
  testHighSchoolSystem() {
    this.results.push('\n📋 测试1: 高中联赛青训体系');
    const natCodes = ['CHN', 'USA', 'ESP', 'SRB'];
    const pos = POSITIONS[0];

    natCodes.forEach(code => {
      const country = COUNTRIES.find(c => c.code === code);
      const hs = HIGH_SCHOOLS[code];
      this.assert(hs && hs.length >= 3, `${country.name}高中联赛数据≥3支`, `(实际${hs?hs.length:0})`);

      // 模拟创建球员
      const savedState = state;
      const savedYear = gameYear;
      state = createPlayer(code, pos, `测试_${code}`, 23);
      const startOvr = state.ovr;

      // 检查初始状态
      this.assert(state.phase === 'highschool', `${code}初始阶段=highschool`, `(实际${state.phase})`);
      this.assert(state.age === 16, `${code}初始年龄=16`, `(实际${state.age})`);
      this.assert(state.hsYear === 0, `${code}高中年份=0(高一)`, `(实际${state.hsYear})`);

      // 选择高中
      chooseHighSchool(0);
      this.assert(state.teamName !== '', `${code}已分配高中球队`, `(球队=${state.teamName})`);
      this.assert(state.league === country.youthName, `${code}联赛=${country.youthName}`, `(实际${state.league})`);

      // 模拟推进3年高中 (16→18)
      let prevOvr = state.ovr;
      for (let i = 0; i < 3; i++) {
        advanceYear();
        // 高中阶段OVR应整体上升 (16-18岁成长期, 允许随机事件导致的波动)
        if (state.phase === 'highschool' || state.phase === 'university') {
          this.assert(state.ovr >= prevOvr - 3, `${code}第${i+1}年OVR未大幅下降`, `(${prevOvr}→${state.ovr})`);
        }
        prevOvr = state.ovr;
      }

      // 3年后应进入大学
      this.assert(state.phase === 'university' || state.phase === 'pro',
        `${code}3年后进入大学/职业`, `(阶段=${state.phase}, 年龄=${state.age})`);
      this.assert(state.age === 19, `${code}3年后年龄=19`, `(实际${state.age})`);

      // 恢复状态
      state = savedState;
      gameYear = savedYear;
    });
  },

  // ===== 测试2: 选秀逻辑 (不同OVR/年龄/潜力组合) =====
  testDraftLogic() {
    this.results.push('\n📋 测试2: 选秀逻辑 (多场景)');
    const scenarios = [
      { ovr: 92, potential: 95, age: 19, desc: '状元级(高OVR+年轻+高潜力)' },
      { ovr: 88, potential: 90, age: 19, desc: '乐透秀(高OVR+年轻)' },
      { ovr: 85, potential: 88, age: 20, desc: '乐透秀(高OVR)' },
      { ovr: 80, potential: 85, age: 21, desc: '首轮中段' },
      { ovr: 75, potential: 80, age: 20, desc: '首轮末段' },
      { ovr: 70, potential: 75, age: 21, desc: '次轮秀' },
      { ovr: 65, potential: 70, age: 22, desc: '次轮末段' },
      { ovr: 60, potential: 65, age: 22, desc: '低OVR(可能落选)' },
      { ovr: 55, potential: 60, age: 22, desc: '极低OVR(高概率落选)' },
    ];

    const draftResults = [];
    scenarios.forEach(s => {
      const savedState = state;
      const savedYear = gameYear;
      clearLog();

      // 构造测试球员
      state = createPlayer('USA', POSITIONS[0], `选秀测试_${s.ovr}`, 1);
      state.ovr = s.ovr;
      state.potential = s.potential;
      state.age = s.age;
      state.phase = 'university';

      declareDraft();

      const result = {
        scenario: s.desc,
        ovr: s.ovr, potential: s.potential, age: s.age,
        draftPick: state.draftPick,
        salary: state.salary,
        team: state.teamName,
        league: state.league
      };
      draftResults.push(result);

      // 验证选秀结果符合预期
      if (s.ovr >= 85) {
        this.assert(state.draftPick && state.draftPick.overall <= 14,
          `OVR${s.ovr}应进乐透(≤14顺位)`, `(实际=${state.draftPick?state.draftPick.overall:'落选'})`);
      } else if (s.ovr >= 75) {
        this.assert(state.draftPick && state.draftPick.overall <= 30,
          `OVR${s.ovr}应进首轮(≤30顺位)`, `(实际=${state.draftPick?state.draftPick.overall:'落选'})`);
      } else if (s.ovr >= 65) {
        this.assert(state.draftPick && state.draftPick.overall <= 60,
          `OVR${s.ovr}应被选中(≤60顺位)`, `(实际=${state.draftPick?state.draftPick.overall:'落选'})`);
      } else {
        // OVR<65可能落选,两种结果都合理
        this.assert(true, `OVR${s.ovr}选秀结果: ${state.draftPick?'第'+state.draftPick.overall+'顺位':'落选(自由球员)'}`);
      }

      // 验证薪资符合新秀合同
      if (state.draftPick) {
        const dp = state.draftPick.overall;
        if (dp <= 5) {
          this.assert(state.salary >= 2500000 && state.salary <= 4000000,
            `前5顺位薪资250-400万`, `(实际=${state.salary})`);
        } else if (dp <= 14) {
          this.assert(state.salary >= 1500000 && state.salary <= 2500000,
            `乐透秀薪资150-250万`, `(实际=${state.salary})`);
        } else if (dp <= 30) {
          this.assert(state.salary >= 800000 && state.salary <= 1500000,
            `首轮秀薪资80-150万`, `(实际=${state.salary})`);
        } else {
          this.assert(state.salary >= 100000 && state.salary <= 500000,
            `次轮秀薪资10-50万`, `(实际=${state.salary})`);
        }
      }

      // 验证阶段转换
      this.assert(state.phase === 'pro', `选秀后阶段=pro`, `(实际=${state.phase})`);

      state = savedState;
      gameYear = savedYear;
    });

    // 输出选秀结果汇总
    this.results.push('\n  📊 选秀结果汇总:');
    draftResults.forEach(r => {
      const pick = r.draftPick ? `第${r.draftPick.overall}顺位` : '落选';
      this.results.push(`    ${r.scenario}: ${pick} → ${r.team}(${r.league}) 薪资${formatSalary(r.salary)}`);
    });
  },

  // ===== 测试3: 伤病系统 (不同严重度场景) =====
  testInjurySystem() {
    this.results.push('\n📋 测试3: 伤病系统');
    const savedState = state;
    const savedYear = gameYear;

    // 测试每种伤病类型
    INJURIES.forEach(injury => {
      clearLog();
      state = createPlayer('USA', POSITIONS[0], `伤病测试_${injury.name}`, 1);
      state.age = 25;
      state.phase = 'pro';
      state.ovr = 80;

      // 手动触发伤病
      const duration = randInt(injury.recovery[0], injury.recovery[1]);
      state.currentInjury = { ...injury, weeksMissed: duration, yearMissed: duration > 8 };
      const prevOvr = state.ovr;
      const prevChronic = state.chronicInjuries;

      if (injury.severity >= 2) {
        const ovrLoss = randInt(1, 3);
        state.ovr = Math.max(40, state.ovr - ovrLoss);
        state.chronicInjuries++;
      }

      state.injuryHistory.push({
        age: state.age, year: gameYear, name: injury.name,
        severity: injury.severity, weeks: duration
      });

      // 验证伤病记录
      this.assert(state.injuryHistory.length === 1, `${injury.name}已记录到病史`);
      this.assert(state.currentInjury.name === injury.name, `${injury.name}当前伤病已设置`);

      // 验证严重伤病影响
      if (injury.severity >= 2) {
        this.assert(state.ovr < prevOvr, `${injury.name}(严重度${injury.severity})导致OVR下降`, `(${prevOvr}→${state.ovr})`);
        this.assert(state.chronicInjuries === prevChronic + 1, `${injury.name}慢性伤病计数+1`, `(=${state.chronicInjuries})`);
      }

      // 验证恢复时间在合理范围
      this.assert(duration >= injury.recovery[0] && duration <= injury.recovery[1],
        `${injury.name}恢复时间${injury.recovery[0]}-${injury.recovery[1]}周`, `(实际=${duration})`);

      // 模拟恢复过程
      const weeksToRecover = duration;
      for (let w = 0; w < weeksToRecover; w++) {
        if (state.currentInjury) state.currentInjury.weeksMissed--;
        if (state.currentInjury && state.currentInjury.weeksMissed <= 0) {
          state.currentInjury = null;
        }
      }
      this.assert(state.currentInjury === null, `${injury.name}恢复后currentInjury=null`);
    });

    // 测试年龄对伤病概率的影响
    this.results.push('\n  📊 年龄-伤病概率测试:');
    [20, 25, 30, 33, 36, 40].forEach(age => {
      const baseChance = 0.12;
      const ageMod = age > 30 ? (age - 30) * 0.02 : 0;
      const totalChance = baseChance + ageMod;
      this.results.push(`    ${age}岁: 伤病概率=${(totalChance*100).toFixed(1)}% (基础12%+年龄修正${(ageMod*100).toFixed(0)}%)`);
    });

    state = savedState;
    gameYear = savedYear;
  },

  // ===== 测试4: 退役判定 (多条件) =====
  testRetirement() {
    this.results.push('\n📋 测试4: 退役判定');
    const savedState = state;
    const savedYear = gameYear;

    // 场景1: 年龄42强制退役
    clearLog();
    state = createPlayer('USA', POSITIONS[0], '退役测试_年龄', 1);
    state.age = 42;
    state.phase = 'pro';
    state.ovr = 75;
    checkRetirement(state);
    this.assert(state.retired === true, '42岁强制退役', `(retired=${state.retired})`);
    this.assert(state.retirementReason.includes('42'), '退役原因含"42岁"');

    // 场景2: OVR<60被迫退役 (30岁以下)
    clearLog();
    state = createPlayer('USA', POSITIONS[0], '退役测试_低OVR', 1);
    state.age = 28;
    state.phase = 'pro';
    state.ovr = 55;
    checkRetirement(state);
    this.assert(state.retired === true, 'OVR<60被迫退役', `(OVR=${state.ovr}, retired=${state.retired})`);
    this.assert(state.retirementReason.includes('能力值'), '退役原因含"能力值"');

    // 场景3: 严重伤病退役
    clearLog();
    state = createPlayer('USA', POSITIONS[0], '退役测试_伤病', 1);
    state.age = 32;
    state.phase = 'pro';
    state.ovr = 70;
    state.currentInjury = { name: '十字韧带撕裂', severity: 3, weeksMissed: 10, recovery: [4,10] };
    checkRetirement(state);
    this.assert(state.retired === true, '严重伤病(severity≥3,≥10周)退役', `(retired=${state.retired})`);

    // 场景4: 38岁+OVR<70 自然退役 (概率性,运行多次)
    let retireCount = 0;
    const trials = 20;
    for (let i = 0; i < trials; i++) {
      state = createPlayer('USA', POSITIONS[0], '退役测试_自然', 1);
      state.age = 38;
      state.phase = 'pro';
      state.ovr = 65;
      state.currentInjury = null;
      checkRetirement(state);
      if (state.retired) retireCount++;
    }
    this.assert(retireCount > 0 && retireCount < trials,
      `38岁+OVR65有概率退役(~50%)`, `(20次中${retireCount}次退役)`);

    // 场景5: 正常球员不应过早退役
    clearLog();
    state = createPlayer('USA', POSITIONS[0], '退役测试_正常', 1);
    state.age = 28;
    state.phase = 'pro';
    state.ovr = 80;
    state.currentInjury = null;
    state.chronicInjuries = 0;
    checkRetirement(state);
    this.assert(state.retired === false, '28岁OVR80不应退役', `(retired=${state.retired})`);

    state = savedState;
    gameYear = savedYear;
  },

  // ===== 测试5: 完整生涯模拟 (16岁→退役) =====
  testFullCareer() {
    this.results.push('\n📋 测试5: 完整生涯模拟');
    const careers = [];
    const testConfigs = [
      { nat: 'USA', pos: POSITIONS[0], name: '天才后卫', desc: '美国PG' },
      { nat: 'CHN', pos: POSITIONS[4], name: '中国大个子', desc: '中国C' },
      { nat: 'ESP', pos: POSITIONS[2], name: '西班牙前锋', desc: '西班牙SF' },
      { nat: 'SRB', pos: POSITIONS[1], name: '塞尔维亚射手', desc: '塞尔维亚SG' },
    ];

    testConfigs.forEach(cfg => {
      const savedState = state;
      const savedYear = gameYear;
      clearLog();

      state = createPlayer(cfg.nat, cfg.pos, cfg.name, randInt(1, 55));
      const startOvr = state.ovr;
      chooseHighSchool(0);

      // 大学选择
      if (state.phase === 'highschool' && state.highSchoolChoices === null) {
        // 推进到大学
        while (state.phase === 'highschool' && !state.retired) advanceYear();
        if (state.universityChoices) chooseUniversity(0);
      }

      // 大学阶段: 19岁后选择参选或留守
      let draftAge = null;
      while (state.phase === 'university' && !state.retired) {
        if (state.age >= 19 && !state.draftDeclared && state.ovr >= 80) {
          // 高OVR球员提前参选
          declareDraft();
          draftAge = state.age;
          break;
        } else if (state.age >= 22) {
          // 22岁强制参选
          declareDraft();
          draftAge = state.age;
          break;
        }
        advanceYear();
        // advanceYear内部可能触发自动选秀(checkPhaseTransition)
        if (state.phase === 'pro' && draftAge === null) {
          draftAge = state.age;
        }
      }

      // 职业阶段: 推进到退役
      let proYears = 0;
      while (!state.retired && state.age < 45) {
        advanceYear();
        proYears++;
        if (proYears > 30) break; // 安全阀
      }

      const career = {
        name: cfg.name,
        desc: cfg.desc,
        startOvr: startOvr,
        peakOvr: state.ovr,
        finalOvr: state.ovr,
        draftAge: draftAge,
        draftPick: state.draftPick,
        retired: state.retired,
        retirementReason: state.retirementReason,
        retireAge: state.age,
        totalGames: state.stats.gp,
        totalPts: state.stats.pts,
        totalReb: state.stats.reb,
        totalAst: state.stats.ast,
        ppg: state.stats.ppg,
        honors: state.honors,
        injuries: state.injuryHistory.length,
        chronicInjuries: state.chronicInjuries,
        wealth: state.wealth,
        fame: state.fame,
        proYears: proYears
      };
      careers.push(career);

      // 验证生涯完整性
      this.assert(state.retired === true, `${cfg.name}已退役`, `(age=${state.age})`);
      this.assert(state.age >= 22 && state.age <= 45, `${cfg.name}退役年龄22-45岁`, `(实际=${state.age})`);
      this.assert(state.stats.gp > 0, `${cfg.name}有比赛记录`, `(GP=${state.stats.gp})`);
      this.assert(state.career.length >= 3, `${cfg.name}生涯事件≥3`, `(事件数=${state.career.length})`);

      state = savedState;
      gameYear = savedYear;
    });

    // 输出生涯汇总
    this.results.push('\n  📊 生涯模拟汇总:');
    careers.forEach(c => {
      const pick = c.draftPick ? `第${c.draftPick.overall}顺位` : '落选';
      this.results.push(`    ${c.name}(${c.desc}): ${c.startOvr}→${c.peakOvr}OVR | ${c.draftAge}岁参选${pick} | ${c.retireAge}岁退役(${c.retirementReason||''}) | ${c.totalGames}场 ${c.totalPts}分 ${c.totalReb}板 ${c.totalAst}助 | ${c.injuries}次伤病 | ${c.honors.length}荣誉 | 财富${formatSalary(c.wealth)}`);
    });
  },

  // ===== 运行所有测试 =====
  runAll() {
    this.reset();
    console.log('🏀 ===== 篮球生涯模拟器 · 逻辑测试开始 =====');
    const t0 = Date.now();

    this.testHighSchoolSystem();
    this.testDraftLogic();
    this.testInjurySystem();
    this.testRetirement();
    this.testFullCareer();

    const elapsed = Date.now() - t0;
    this.results.push(`\n⏱️ 测试耗时: ${elapsed}ms`);

    const report = this.results.join('\n');
    console.log('%c' + report, 'color: #ff6b35');
    console.log(`%c📊 结果: ${this.pass} 通过 / ${this.fail} 失败`, `color: ${this.fail===0?'#22c55e':'#ef4444'}; font-weight: bold`);

    // 同时返回到日志系统
    log('TEST', `模拟测试完成: ${this.pass}通过/${this.fail}失败 (${elapsed}ms)`);

    return { report, pass: this.pass, fail: this.fail, elapsed };
  }
};

// 控制台快捷调用
window.runSimTests = () => SIM_TESTS.runAll();
window.getLog = () => getLog();

console.log('  printGameLog()     - 打印游戏日志');
